[package]
name = "forever-sim"
version = "0.1.0"
edition = "2021"
description = "Data-driven Monte Carlo combat simulator for World of Warcraft: Forever"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = { version = "0.8", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.test]
opt-level = 2

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fsim"
path = "src/main.rs"
