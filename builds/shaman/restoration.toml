# The healer: Water Shield, Mana Tide Totem, Nature's Swiftness and Riptide, then an Enhancement dip for crit,
# Intellect and an instant Ghost Wolf. Here it plays solo with a mace and shield: a Lightning Bolt pull,
# Flame Shock, Earth Shock, Searing Totem and melee. Level 60 points are theorycrafted until launch.

# Sources:
# - Warcraft Tavern, WoW Forever Shaman Guide (level 30 Restoration build and talent order; the 12-point
#   Enhancement dip): https://www.warcrafttavern.com/forever/guides/shaman/
# - wow.gg, WoW Forever Restoration Shaman (beta) (level 20 build, Orc or Dwarf):
#   https://wow.gg/guides/wow-forever-restoration-shaman-beta
# - Method, WoW Forever Shaman Leveling Guide (Rockbiter Weapon on a one-hander and shield, the basic
#   Flame Shock, Searing Totem, shock and melee play):
#   https://www.method.gg/wow-forever/wow-forever-shaman-leveling-guide-and-talents
# - Blizzard, WoW Forever beta development notes, Oct 15 Shaman changes (blue post mirror):
#   https://www.bluetracker.gg/wow/topic/eu-en/631316-wow-forever-beta-development-notes-updated-15-october/
# Levels 10 to 30 follow Warcraft Tavern's order, which is still legal after Oct 15 (Tidal Focus moved up to
# the first row). Theorycrafted (31 to 60): Healing Way 3, the fifth Tidal Mastery point, Purification 5 and
# Riptide at 40 (its first rank is a level 40 spell), the last Tidal Focus points, Restorative Totems 5 and
# Healing Focus 1, then the guide's Enhancement dip: Thundering Strikes 5, Ancestral Knowledge 5 and
# Improved Ghost Wolf 2.
# Race: Dwarf, the only Alliance shaman (wow.gg lists Orc and Dwarf): Stoneform when hurt, and the mace crit
# bonus with the kit's mace.
