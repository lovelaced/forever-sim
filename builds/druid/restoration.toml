# - wow.gg, Restoration beta guide: https://wow.gg/guides/wow-forever-restoration-druid-beta
# No guide has a level 60 Restoration build yet. From 36 this one takes Gift of the Earthmother,
# Improved Regrowth, Wild Growth at 40 and Tranquil Spirit, then a Balance dip for Genesis, Moonglow,
# Nature's Majesty, Nature's Splendor and Improved Moonfire: 13/0/38.
# Race: High Order Skyborne (Alliance). Warcraft Tavern's Restoration guide gives Skyborne the edge for
# Read Leyline (mana; not simulated); Wind Blessed gives 3% haste since build 70425.
