# The healing druid: Rejuvenation, Regrowth and Swiftmend with Nature's Swiftness at 32 and Wild Growth
# at 40, solo with Moonfire and Starfire. Level 60 points are theorycrafted until launch.

# Sources:
# - Warcraft Tavern, Druid leveling guide ("Mid-Level Restoration", 26 points: the order here for
#   10-35; "Leveling primarily as a healer is not recommended due to their slow kill times"):
#   https://www.warcrafttavern.com/forever/guides/druid-leveling/
# - Warcraft Tavern, Restoration druid guide (key talents: Gift of the Earthmother, Wild Growth,
#   Nature's Splendor; healing priority; Skyborne for the race):
#   https://www.warcrafttavern.com/forever/guides/restoration-druid/
# - Mobalytics, Druid leveling guide (Resto 21 points with the same core; read from search excerpts,
