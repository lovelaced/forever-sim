# The cat druid most players level with: Claw, Rake and Rip, Leader of the Pack at 30, Shifting Power for
# Energy and Berserk at 40, then Furor and a Balance dip for Genesis and crit. Level 60 points are
# theorycrafted until launch.

# Sources:
# - Method, Druid leveling guide and talents (updated Sep 29): the order for 10-30 (0/21/0) and its
#   projected level 60 build (9/35/7), followed point for point; the cat play (Prowl, Faerie Fire,
#   Rake, Claw for combo points, Rip only on targets that live through it):
#   https://www.method.gg/wow-forever/wow-forever-druid-leveling-guide-and-talents
# - Warcraft Tavern, Druid leveling guide (the same 21 Feral points at 30; Shifting Power below 50
#   Energy, Rip at 4-5 combo points, no bleeds on targets about to die; Feral is "the smoothest
#   route"): https://www.warcrafttavern.com/forever/guides/druid-leveling/
# - wowtbc.gg, Feral DPS druid (level 60 play: Faerie Fire, Berserk, Shifting Power, Rip at 5,
#   Rake, Shred): https://wowtbc.gg/warcraftforever/class-guides/feral-dps-druid/
# - wow.gg, Feral beta guide: https://wow.gg/guides/wow-forever-feral-druid-beta
# Race: Windshaper Skyborne (Horde). Method picks Skyborne for a PvE cat; Wind Blessed gives 3%
# haste since build 70425. Tauren is the usual Horde pick for bears and PvP.
