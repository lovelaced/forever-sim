  "improved_renew", "improved_renew", "improved_renew", "inspiration", "inspiration",
  "inspiration", "improved_healing", "improved_healing", "improved_healing", "binding_heal",
  "holy_nova",
  "litany_of_light", "litany_of_light", "spirit_of_redemption",
  "spiritual_guidance", "spiritual_guidance", "spiritual_guidance", "spiritual_guidance", "spiritual_guidance",
  "spiritual_healing", "spiritual_healing", "spiritual_healing",
  "prayer_of_mending",
  "twin_disciplines", "twin_disciplines", "twin_disciplines", "twin_disciplines", "twin_disciplines",
  "silent_resolve", "silent_resolve", "mental_strength", "mental_strength", "mental_strength",
  "improved_power_word_shield", "improved_power_word_shield", "improved_power_word_shield",
