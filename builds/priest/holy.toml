# The healing build: Holy Specialization, Divine Fury, Inspiration and Improved Healing, Holy Nova at 30
# and Prayer of Mending at 42, then Discipline points for Meditation and shields. Solo it opens with a
# shield and Holy Fire, uses Shadow Word: Pain, Mind Blast and Smite, and finishes with the wand.
# Level 60 points are theorycrafted until launch.

# Sources:
# - talentsforever.com, Priest leveling orders (the most planned Holy order, levels 10 to 29) and Priest
#   builds (the most used Holy build at 60, 19/32/0):
#   https://talentsforever.com/priest/leveling and https://talentsforever.com/priest/builds
# - Overgear, WoW Forever Holy Priest Guide (level 60 build, written 19/32/0 but adding up to 18/33/0,
#   which this build follows; Holy Fire, Mind Blast, Shadow Word: Pain, Smite, wand; Gnome or Undead):
#   https://overgear.com/guides/wow-forever/holy-priest-how-to-play/
# - Warcraft Tavern, WoW Forever Priest Leveling Guide (level 30 Holy build with Holy Nova, Binding Heal,
#   Inspiration and Improved Healing): https://www.warcrafttavern.com/forever/guides/priest-leveling/
# Levels 10 to 29 follow the planner. Theorycrafted (30 to 60): Holy Nova, then Overgear's order to
# Prayer of Mending (Litany of Light, Spirit of Redemption, Spiritual Guidance, Spiritual Healing), then
# the Discipline points. Build 70425 moved Improved Power Word: Shield to row 3, so Mental Strength 3
# stands in for Overgear's Mental Agility and opens that row; Holy Nova takes the place of Holy Reach,
# which the sim does not model.
# Race: Gnome, Overgear's Alliance pick for Holy: Eureka! makes spells cheaper and stronger for 8 sec, and
# Expansive Mind adds mana.
