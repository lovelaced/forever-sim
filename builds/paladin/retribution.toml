# The two-handed damage build: Seal of Command, Sanctified Judgement and Vengeance, Twist of Light at 40,
# then Toughness, Precision and a few Holy points. It fights with Seal of Command, Judgement, Holy Strike
# and Consecration. Level 60 points are theorycrafted until launch.

# Sources:
# - talentsforever.com, Paladin leveling orders (the most planned Retribution order, levels 10 to 49) and
#   Paladin builds (the most used level 60 Retribution build, 8/8/35, which this build ends on):
#   https://talentsforever.com/paladin/leveling and https://talentsforever.com/paladin/builds
# - Warcraft Tavern, WoW Forever Paladin Guide (the 26-point Seal of Command build: Benediction and
#   Conviction, Pursuit of Justice, Sanctified Judgement, Sacred Arbiter, Improved Judgement, then
#   Vengeance and Two-Handed Weapon Specialization): https://www.warcrafttavern.com/forever/guides/paladin/
# - Method, WoW Forever Paladin Leveling Guide (Seal of Righteousness, Judgement, Holy Strike; Twist of
#   Light as the Retribution capstone):
#   https://www.method.gg/wow-forever/wow-forever-paladin-leveling-guide-and-talents
# Levels 10 to 45 follow the planner's order, which agrees with Warcraft Tavern's build. Theorycrafted
# (46 to 60): Precision 3, Holy Conduit 2, Instrument of Law 2, Divine Strength 5 and Improved Seals 3,
# which complete the 8/8/35 build.
# Race: Undead, the Horde paladin (Icy Veins' race breakdown picks it for Horde, Human for Alliance):
