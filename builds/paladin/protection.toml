  "improved_righteous_fury", "improved_righteous_fury", "sacred_duty", "sacred_duty", "swift_judgement",
  "templars_bulwark",
  "reckoning", "reckoning", "reckoning", "reckoning",
  "iron_creed", "iron_creed", "iron_creed", "iron_creed", "iron_creed",
  "holy_shield",
  "anticipation", "anticipation", "anticipation",
  "one_handed_weapon_specialization", "one_handed_weapon_specialization", "one_handed_weapon_specialization",
  "reckoning",
  "toughness", "toughness", "toughness", "toughness", "toughness",
  "divine_intellect", "divine_intellect", "divine_intellect", "divine_intellect", "divine_intellect",
  "improved_seals", "improved_seals", "improved_seals",
