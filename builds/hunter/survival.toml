# Forever's melee Survival hunter: a polearm with Aspect of the Beast, Raptor Strike, Strider Kick and
# Mongoose Bite, Predator's Edge for big melee crits and Lacerating Strikes at 40, with the cat at your
# side. Level 60 points are theorycrafted until launch.

# Sources:
# - Warcraft Tavern, Hunter guide (Sponge): the Survival talent order for 10-30 (0/0/21) and "the spec
#   has been developed further into a melee-focused playstyle":
#   https://www.warcrafttavern.com/forever/guides/hunter/
# - wowtbc.gg, Survival hunter ("a full talent tree overhaul to turn them into a melee DPS"; the 35
#   Survival points at 60 and the play: Aspect of the Beast, Hunter's Mark, Mongoose Bite, Strider
#   Kick, Raptor Strike): https://wowtbc.gg/warcraftforever/class-guides/survival-hunter/
# - Icy Veins, Survival hunter melee guide (Strider Kick by 30, "a decent melee spec at 30"; read from
#   search excerpts, the page refuses automated readers):
#   https://www.icy-veins.com/wow-forever/survival-hunter-melee-dps-pve-guide
# - wow.gg, Survival beta guide (melee play: Aspect of the Beast, Hunter's Mark, send the pet, Serpent
#   Sting, then Raptor Strike on cooldown): https://wow.gg/guides/wow-forever-survival-hunter-beta
# - classicwowforever.com, Survival hunter (Aspect of the Monkey until 30, then Beast):
#   https://classicwowforever.com/class-guides/hunter/survival/
# Ranged or melee: the guides play Forever's Survival in melee from 30 on. Below 30 several say
# shooting is still stronger (wow.gg; forum thread 2373238), but the talents are melee talents.
# Levels 31 to 60 take the rest of the melee core wowtbc.gg lists (Strider Kick, Resourcefulness 2,
# Expose Prey, Lightning Reflexes, Lacerating Strikes, Survivalist), keep the pet (Deadly Aspects,
# Focused Fire) instead of wowtbc.gg's petless Lone Wolf at 60, and end with Lethal Attacks and
# Careful Aim. Entrapment and Clever Traps (traps) do nothing in the sim. Weapons: the hunter kit's
# two-handed polearm; wow.gg suggests dual wield, forum posters expect two-handers.
# Race: Tauren, the race wow.gg calls strongest for hunters: in melee range War Stomp (90 sec since
# build 70425) and Endurance's +5% health count most. Endurance's +1% hit, which guides cite, became
# +2% crit damage in build 70425.
