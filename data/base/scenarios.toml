# Scenarios. kind = leveling | boss | duel | pressure.
# `behind` = the simulated player attacks from behind (no parry/block).

[scenarios.solo_1]
kind = "leveling"
desc = "Levelling for an hour: single pulls of same-level humanoids, 8 s between pulls"
pull = 1
minutes = 60
enemy = "humanoid"
travel = 8

[scenarios.solo_2]
kind = "leveling"
desc = "Levelling for an hour: double pulls"
pull = 2
minutes = 60
enemy = "humanoid"
travel = 8

[scenarios.solo_2_hard]
kind = "leveling"
desc = "Levelling for an hour: double pulls of mobs hitting 40% harder"
pull = 2
minutes = 60
enemy = "humanoid_hard"
travel = 8

[scenarios.solo_3]
kind = "leveling"
desc = "Levelling for an hour: triple pulls"
pull = 3
minutes = 60
enemy = "humanoid"
travel = 8

[scenarios.boss]
kind = "boss"
desc = "Dungeon boss for 120 s from behind, tank holds threat, health falls linearly (execute phase in the last 20%)"
duration = 120
enemy = "boss_plus2"
behind = true

[scenarios.pressure]
kind = "pressure"
desc = "World PvP pressure: one geared melee attacker with two stuns. Breakeven = attacker DPS (before your mitigation) at which you win half the time"
attacker = "pressure_rogue"
attackers = 1
lo = 0.05
hi = 8
steps = 12
max_time = 180

[scenarios.pressure_2v1]
kind = "pressure"
desc = "World PvP pressure: two geared melee attackers. Breakeven is per attacker"
attacker = "pressure_rogue"
attackers = 2
lo = 0.05
hi = 8
steps = 12
max_time = 180

[scenarios.duel]
kind = "duel"
desc = "Duel against another build (--vs), standing and trading, 180 s limit"
max_time = 180

[scenarios.heal_dungeon]
kind = "healing"
desc = "Dungeon healing: you, a tank and three others against a boss for 120 s. Breakeven = the boss's damage per second (before armor) you heal through without anyone dying, half the time"
boss = "heal_dungeon_boss"
tank = "tank"
party = ["rogue", "mage", "hunter"]
duration = 120
max_dead = 1

[scenarios.heal_tank]
kind = "healing"
desc = "Main tank healing: you keep one tank alive against a raid boss three levels up for 180 s. Breakeven = the boss's damage per second (before armor) you heal through, half the time"
boss = "heal_tank_boss"
tank = "tank"
duration = 180
max_dead = 1

[scenarios.heal_raid]
kind = "healing"
desc = "Raid healing at 60: ten players in two groups against Onyxia for 150 s. Breakeven = the boss's damage per second (before armor) you heal through with the tank and you alive and at most two others down, half the time"
boss = "heal_raid_boss"
tank = "raid_tank"
party = ["warrior", "rogue", "mage"]
raid = ["hunter", "warlock", "mage", "rogue", "warrior"]
duration = 150
max_dead = 3
min_level = 60
