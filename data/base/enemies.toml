# ------------------------------------------------------------ healing tests
# The bosses of the healing tests hit to a timetable: melee on the tank plus
# the `script` attacks (each line's `dmg` is per target, before armor). Every
# number scales with the test's damage scale, which the breakeven searches.
# `D` in the comments is the boss's total damage per second before armor at
# scale 1 (5 players in the dungeon, 1 tank, 10 in the raid), calibrated so a
# Holy priest preset breaks even near 1.

# Dungeon boss (+2): 55% melee on the tank, 10% Mortal Strike on the tank,
# 20% Fire Nova on everyone, 15% Shadow Bolts on someone other than the tank.
[enemies.heal_dungeon_boss]
name = "Dungeon boss"
creature = "humanoid"
level_offset = 2
boss = true
hp = "1e12"
armor = "interp(level, 22,450, 42,900, 62,1500)"
dodge = "5.4"
speed = 2.0
crit = 5.0
dmg = "0.55 * 2.0 * interp(level, 10,43, 15,56, 20,65, 25,99, 30,129, 35,168, 40,216, 45,259, 50,324, 55,423, 60,648)"
script = [
  { name = "Mortal Strike", icon = "ability_warrior_savageblow", melee = true, target = "tank", every = 8, first = 5, dmg = "0.10 * 8 * interp(level, 10,43, 15,56, 20,65, 25,99, 30,129, 35,168, 40,216, 45,259, 50,324, 55,423, 60,648)" },
  { name = "Fire Nova", icon = "spell_fire_sealoffire", school = "fire", target = "all", every = 6, first = 4, dmg = "0.20 * 6 / 5 * interp(level, 10,43, 15,56, 20,65, 25,99, 30,129, 35,168, 40,216, 45,259, 50,324, 55,423, 60,648)" },
  { name = "Shadow Bolt", icon = "spell_shadow_shadowbolt", school = "shadow", target = "others", count = 1, every = 3, first = 2, dmg = "0.15 * 3 * interp(level, 10,43, 15,56, 20,65, 25,99, 30,129, 35,168, 40,216, 45,259, 50,324, 55,423, 60,648)" },
]
mods = [{ stat = "immune_stun", add = 1 }, { stat = "immune_root", add = 1 }, { stat = "immune_fear", add = 1 }, { stat = "immune_incap", add = 1 }]

