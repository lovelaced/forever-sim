# Standardised gear kits: typical quest/dungeon gear totals at each level,
# so builds are compared on equal footing. Stats are summed item stats
# (crit and hit in percent). Levels between anchors are interpolated.
# Forever reworked item stats, so these are deliberately generic.
# Weapon: min, max, speed, type (sword axe mace dagger fist polearm staff
# sword2h axe2h mace2h bow gun crossbow thrown wand), and for a wand its
# school. Cloth kits carry a typical wand for the level: about 20 damage per
# second at 20 (Greater Magic Wand 17.5, Gravestone Scepter 29), 30 at 30
# (Goblin Igniter 33), 40 at 40 (Blackbone Wand 35, Dreambough Wand 39) and
# 56 at 60 (Skul's Ghastly Touch); crafted arcane wands early, shadow later.
# Level 10 is starter-zone quest gear: about 40% of level 20's stats and
# armor, weapons with about 62% of its damage per second, and a wand of about
# 11 damage per second for cloth.

