# Hybrid kits: Forever's crafted sets and quest weapons put "+X spell damage
# and healing" on melee gear (about +7 to 8 a piece at levels 20 to 25:
# Totemic Leather Pants +7, Rhahk'Zor's Hammer +8). Bonus healing already
# gives a third as much spell damage here (core.toml heal_to_spell_damage),
# so X of both is heal_power X plus sp two thirds of X. Weapons that carry
# spell power have a little less damage per second than the plain kits'.

