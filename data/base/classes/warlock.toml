# (wowforevertalents.com/warlock and /abilities/warlock, checked 2026-10-15).
# Spell coefficients and demon stats are Classic approximations (the client
# tooltips do not show them). Base stats are Classic 1.12.
name = "Warlock"
icon = "classicon_warlock"
resources = ["mana"]
source = "forever-70338"

base = [
  { level = 1, str = 20, agi = 20, sta = 21, int = 22, spi = 23, hp = 23, mana = 90 },
  { level = 40, str = 37, agi = 41, sta = 49, int = 80, spi = 85, hp = 820, mana = 840 },
  { level = 60, str = 47, agi = 52, sta = 64, int = 108, spi = 113, hp = 1414, mana = 1373 },
]

[formulas]
ap = "str - 10"
rap = "agi - 10"
melee_crit = "agi / 20"
ranged_crit = "agi / 20"
spell_crit = "1.7 + int / interp(level, 1,10, 40,40, 60,60.6)"
dodge = "agi / 20"
mana_regen = "8 + spi / 4"
hp_regen = "spi * 0.1 + 2"

