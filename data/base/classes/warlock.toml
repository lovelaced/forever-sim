tree = "Affliction"
points = 20
ranks = 3
text = "Drain Life, Drain Soul and Wrack deal 12% more per other Affliction effect of yours on the target, up to 36%."
# Spell 18271 still lists Classic's 2; the trait data gives 1% a rank.
[talents.shadow_mastery]
icon = "spell_shadow_shadetruesight"
tree = "Affliction"
points = 25
ranks = 5
text = "Shadow damage +5%."
mods = [{ stat = "shadow_dmg_done", mul = "1 + 0.01 * rank" }]
# Tooltip vs spell 1316697: the spell's +10% lists only Corruption and Bane
# of Agony; the tooltip's "your other Shadow damage over time effects" is
# kept (Corruption, Bane of Agony, Siphon Life).
[talents.wrack]
icon = "ability_deathknight_hemorrhagicfever"
tree = "Affliction"
points = 30
ranks = 1
requires = "siphon_life"
text = "Wrack: 36 Shadow per sec for 6 sec and +10% damage from your other Shadow DoTs."

[talents.improved_health_funnel]
icon = "spell_shadow_lifedrain"
tree = "Demonology"
points = 0
ranks = 2
text = "Health Funnel heals your pet more for less of your health (the talent's own numbers are not simulated)."
[talents.improved_imp]
icon = "spell_shadow_summonimp"
tree = "Demonology"
points = 0
ranks = 3
text = "Imp Firebolt +30% (Fire Shield +30% not simulated)."
# Spell 18697 also lowers Spirit by 1% (Classic's rank-1 penalty); the trait
# data and the tooltip have only the Stamina, which is kept.
[talents.demonic_embrace]
icon = "spell_shadow_metamorphosis"
tree = "Demonology"
points = 0
ranks = 5
text = "Stamina +15%."
