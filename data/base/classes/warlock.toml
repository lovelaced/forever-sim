# ------------------------------------------------------------------ auras
[auras.demon_armor]
name = "Demon Armor"
mods = [{ stat = "armor", add = "r.armor * (1 + 0.15 * t.demonic_aegis)" }, { stat = "hp5", add = "r.hp5 * (1 + 0.15 * t.demonic_aegis)" }]
[auras.corruption]
name = "Corruption"
debuff = true
duration = "r.dur"
[auras.corruption.tick]
interval = 3
effects = [
  { type = "damage", school = "shadow", periodic = true, tag = "Corruption", amount = "r.total * 3 / r.dur", coef = "3 / r.dur", mult = "(1 + 0.02 * t.improved_corruption) * (1 + 0.01 * t.malediction) * (target.aura.wrack.up ? 1.1 : 1)", can_crit = true, crit = "t.pandemic > 0 ? 0 : -100", crit_bonus = "t.pandemic / 3" },
  { type = "chance", p = "0.02 * t.nightfall", then = [{ type = "aura", aura = "shadow_trance", target = "self" }] },
]
[auras.bane_of_agony]
name = "Bane of Agony"
debuff = true
duration = 24
text = "Classic ramp: the first ticks are weaker, the last stronger (12 ticks of 1/24, 1/12 and 1/8 of the total)."
[auras.bane_of_agony.tick]
interval = 2
effects = [
  { type = "damage", school = "shadow", periodic = true, tag = "Bane of Agony", amount = "r.total / 12", coef = "1 / 12", mult = "(1 + 0.05 * t.improved_bane_of_agony) * (1 + 0.01 * t.malediction) * (target.aura.wrack.up ? 1.1 : 1)", can_crit = true, crit = "t.pandemic > 0 ? 0 : -100", crit_bonus = "t.pandemic / 3" },
]
[auras.immolate]
name = "Immolate"
debuff = true
duration = 15
tick = { interval = 3, effects = [{ type = "damage", school = "fire", periodic = true, tag = "Immolate (burn)", amount = "r.dot / 5", coef = "0.13", mult = "1 + 0.01 * t.malediction" }] }
[auras.siphon_life]
name = "Siphon Life"
debuff = true
duration = 30
tick = { interval = 3, effects = [{ type = "damage", school = "shadow", periodic = true, tag = "Siphon Life", amount = "r.tick", coef = "0.05", lifesteal = 1, mult = "(1 + 0.01 * t.malediction) * (target.aura.wrack.up ? 1.1 : 1)", can_crit = true, crit = "t.pandemic > 0 ? 0 : -100", crit_bonus = "t.pandemic / 3" }] }
[auras.wrack]
name = "Wrack"
debuff = true
duration = 6
[auras.wrack.tick]
interval = 1
effects = [
  { type = "damage", school = "shadow", periodic = true, tag = "Wrack", amount = 36, coef = "0.05", mult = "(1 + 0.0667 * t.improved_drains) * (1 + 0.01 * t.malediction)", can_crit = true, crit = "t.pandemic > 0 ? 0 : -100", crit_bonus = "t.pandemic / 3" },
  { type = "chance", p = "0.02 * t.nightfall", then = [{ type = "aura", aura = "shadow_trance", target = "self" }] },
]
