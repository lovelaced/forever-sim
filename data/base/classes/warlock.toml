# ------------------------------------------------------------------ passives

# ------------------------------------------------------------------ pets
# Health, armor, mana and melee damage are Classic approximations. Demons
# also get a share of your Stamina (assumption pet_owner_sta, 10 health per
# point as for players) and of your spell damage (demon_owner_sp).
[pets.imp]
name = "Imp"
creature = "demon"
speed = 2.0
hp = "(interp(level, 1,40, 20,300, 40,720, 60,1350) + 10 * opt.pet_owner_sta * sta) * (1 + 0.05 * t.fel_vitality)"
armor = "interp(level, 1,20, 60,1100)"
mana = "interp(level, 1,80, 20,400, 40,900, 60,1600) * (1 + 0.05 * t.fel_vitality)"
dmg_min = "interp(level, 1,2, 60,20)"
dmg_max = "interp(level, 1,3, 60,30)"
crit = 5
auto_melee = false
mods = [
  { stat = "sp", add = "owner.sp * opt.demon_owner_sp + level * interp(t.demonic_knowledge, 0,0, 1,0.33, 2,0.67, 3,1)" },
  { stat = "dmg_done", mul = "1 + 0.02 * t.unholy_power" },
  { stat = "dmg_done", mul = "owner.aura.soul_link_buff.up ? 1.03 : 1" },
  { stat = "fire_dmg_done", mul = "1 + 0.02 * t.master_demonologist" },
]
[pets.imp.rotation]
actions = [{ cast = "blood_pact", if = "!owner.aura.blood_pact.up" }, { cast = "firebolt" }]

[pets.voidwalker]
name = "Voidwalker"
creature = "demon"
speed = 2.0
hp = "(interp(level, 10,450, 20,900, 40,2200, 60,4200) + 10 * opt.pet_owner_sta * sta) * (1 + 0.05 * t.fel_vitality)"
armor = "interp(level, 10,500, 60,3800)"
dmg_min = "interp(level, 10,10, 60,45)"
dmg_max = "interp(level, 10,14, 60,62)"
ap = "interp(level, 10,20, 60,100)"
crit = 5
dodge = 5
mods = [
  { stat = "dmg_done", mul = "1 + 0.02 * t.unholy_power" },
  { stat = "dmg_done", mul = "owner.aura.soul_link_buff.up ? 1.03 : 1" },
  { stat = "phys_dmg_taken", mul = "1 - 0.02 * t.master_demonologist" },
]
[pets.voidwalker.rotation]
actions = [{ cast = "torment", if = "!target.is_player && !target.boss" }]

[pets.succubus]
name = "Succubus"
creature = "demon"
speed = 2.0
hp = "(interp(level, 20,700, 40,1700, 60,3100) + 10 * opt.pet_owner_sta * sta) * (1 + 0.05 * t.fel_vitality)"
armor = "interp(level, 20,500, 60,1800)"
dmg_min = "interp(level, 20,20, 60,62)"
dmg_max = "interp(level, 20,28, 60,86)"
ap = "interp(level, 20,40, 60,180)"
crit = 5
dodge = 5
mods = [
  { stat = "sp", add = "owner.sp * opt.demon_owner_sp + level * interp(t.demonic_knowledge, 0,0, 1,0.33, 2,0.67, 3,1)" },
  { stat = "dmg_done", mul = "1 + 0.02 * t.unholy_power" },
  { stat = "dmg_done", mul = "owner.aura.soul_link_buff.up ? 1.03 : 1" },
  { stat = "shadow_dmg_done", mul = "1 + 0.02 * t.master_demonologist" },
]
[pets.succubus.rotation]
# charms the add on a double pull, then lashes your target
actions = [
  { cast = "seduction", target = "other_enemy", pick = "nearest", if = "enemies >= 2 && !target.incapacitated && !target.feared && !target.stunned" },
