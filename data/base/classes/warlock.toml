[rotations.destruction]
# The Voidwalker tanks from level 10 (the Imp before): Warcraft Tavern's
# Forever leveling guide plays Destruction with the Voidwalker in the open
# world. Against the Imp, with the standard build
# (builds/warlock/destruction.toml): solo_2_hard 100 kills/h against 38 at
# level 30 and 122 against 79 at 60; boss 64 DPS against 61 at 30, 267
# against 276 at 60.
# Sacrificing the Succubus at 60 (the build's last point) gave boss 270 DPS
# and solo_2_hard 68 kills/h, so the demon stays out.
# Until Shadow and Flame is full (level 44 here) Conflagrate eats the
# Immolate, so a lone mob or a boss waits for the burn to run out (or a
# kill) instead of recasting Immolate every 10 seconds: solo_1 at 30 went
# from 113 to 119 kills/h, with a third fewer drinks. Players and double
# pulls still get it on cooldown for the burst.
# On a boss: Corruption, Bane of Agony, Shadowburn on cooldown, and Life Tap
# down to a quarter of your health while the tank holds it (it wanded out of
# mana before): 290 to 351 DPS at 60.
# Gnomes use Eureka! on cooldown.
desc = "Destruction with the Voidwalker tanking: Immolate, Conflagrate, Shadowburn to finish, Incinerate or Shadow Bolt; Corruption and Bane of Agony on bosses"
auto_melee = false
precombat = ["demon_armor", "demon_skin", "summon_voidwalker", { cast = "summon_imp", if = "!pet.active" }]
opener = []
actions = [
  { cast = "healthstone", if = "hp_pct < 0.3", emergency = true },
  { cast = "healing_potion", if = "potions && (hp_pct < 0.2)", emergency = true },
  { cast = "mana_potion", if = "potions && (mana_pct < 0.3 && (target.boss || target.is_player))" },
  { cast = "death_coil", if = "hp_pct < 0.4", emergency = true },
  { cast = "life_tap", if = "mana_pct < 0.2 && hp_pct > (fight.boss && !has_aggro ? 0.25 : 0.5)" },   # on a boss with the tank holding it, nobody hits you: tap deeper
  { cast = "howl_of_terror", if = "enemies_within_10 >= 3 || (enemies_within_10 >= 2 && hp_pct < 0.5)" },   # three on you, or two once it hurts: everyone near runs
  { cast = "fear", if = "target.is_player && !target.feared && !target.held && !target.immune_fear && target.dist < 8" },   # a player in your face: fear it first
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "eureka" },
  { cast = "shadowburn", if = "target.hp_pct < 0.25 || target.boss" },
  { cast = "immolate", if = "target.hp_pct > 0.25 || target.boss" },
  { cast = "banish", target = "other_enemy", pick = "nearest", if = "enemies_active >= 2 && hp_pct < 0.45 && (target.demon || target.elemental) && !target.feared && !target.incapacitated && !target.stunned" },   # hold the add
  { cast = "fear", target = "other_enemy", pick = "nearest", if = "enemies_active >= 2 && hp_pct < 0.45 && !target.boss && !target.feared && !target.incapacitated && !target.stunned" },
  { cast = "conflagrate", if = "(t.shadow_and_flame >= 5 || target.is_player || enemies >= 2 || target.aura.immolate.remains < 3 || target.hp_pct < 0.3) && !target.feared" },   # before Shadow and Flame it eats the Immolate: on a lone mob or a boss, wait for the burn to run out or a kill (players and pulls of two get the burst); never into your own Fear
  { cast = "corruption", if = "target.boss || (target.feared && target.is_player)" },   # a boss gets the DoTs too, and so does a player while it runs in fear
  { cast = "bane_of_agony", if = "target.boss || (target.feared && target.is_player)" },
  { cast = "fear", if = "!target.is_player && !target.boss && !target.feared && hp_pct < 0.5 && has_aggro && target.dist < 8" },   # it's on you: fear it off, let the DoTs work
  { cast = "fear", if = "target.is_player && !target.feared && !target.immune_fear && hp_pct < 0.8" },   # duels: fear, let the DoTs work
  { cast = "curse_of_exhaustion", if = "target.fleeing && !target.slowed" },
  { cast = "curse_of_recklessness", if = "target.humanoid && !target.is_player && !target.boss && target.hp_pct < 0.25 && target.hp_pct > 0.15 && !target.fleeing && enemies < 2" },   # it won't run
  { cast = "rain_of_fire", if = "enemies_active >= 3 && cc_near == 0" },
  { cast = "shoot", if = "gcd_remains <= 0 && !target.boss && !target.is_player && (target.hp_pct < 0.2 || mana_pct < 0.4)" },   # leveling: wand to finish and save mana
  { cast = "incinerate", if = "target.aura.immolate.up && (!target.feared || !target.is_player || target.aura.fear.remains < 2.5)" },   # not into a feared player until the Fear is about to end
  { cast = "shadow_bolt", if = "!target.feared || !target.is_player || target.aura.fear.remains < 3" },
  { cast = "shoot", if = "gcd_remains <= 0" },   # out of mana: the wand is free
]
rest = [
  { cast = "health_funnel", if = "pet.active && pet.hp_pct < 0.6 && hp_pct > 0.6" },   # pets keep their wounds between pulls
  { cast = "summon_voidwalker", if = "!pet.active" },
  { cast = "summon_imp", if = "!pet.active" },
  { cast = "life_tap", if = "mana_pct < 0.7 && hp_pct > 0.8" },
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "demon_armor" },
  { cast = "demon_skin" },
]
eat_below = "pull.size >= 2 || pull.danger > 1 ? 0.85 : 0.5"
drink_below = "pull.size >= 2 || pull.danger > 1 ? 0.7 : 0.35"

