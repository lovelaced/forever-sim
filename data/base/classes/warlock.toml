# ------------------------------------------------------------------ rotations
[rotations.affliction_drain]
desc = "Affliction levelling with the Voidwalker tanking: Corruption, Bane of Agony, Siphon Life, Wrack, Nightfall Shadow Bolts, Drain Life when hurt, Life Tap"
auto_melee = false
precombat = ["demon_armor", "summon_voidwalker"]
opener = []
actions = [
  { cast = "healthstone", if = "hp_pct < 0.3" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "death_coil", if = "hp_pct < 0.4" },
  { cast = "life_tap", if = "mana_pct < 0.25 && hp_pct > 0.6" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "corruption" },
  { cast = "bane_of_agony", if = "target.hp_pct > 0.3 || target.boss" },
  { cast = "siphon_life" },
  { cast = "wrack", if = "target.aura.corruption.up" },
  { cast = "shadow_bolt", if = "aura.shadow_trance.up" },
  { cast = "drain_life", if = "hp_pct < 0.7" },
  { cast = "drain_soul", if = "target.hp_pct < 0.25 && !target.boss" },
  { cast = "shadow_bolt", if = "t.nightfall == 0 || mana_pct > 0.5" },
  { cast = "drain_life" },
]
rest = [
  { cast = "summon_voidwalker", if = "!pet.active" },
  { cast = "life_tap", if = "mana_pct < 0.7 && hp_pct > 0.8" },
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "demon_armor" },
]
eat_below = 0.5
drink_below = 0.35

[rotations.pact]
desc = "Demonic Pact: sacrifice the Voidwalker for mana regeneration, then fight with a Felhunter (Imp below 30); Soul Link; Affliction DoTs and Drain Life"
auto_melee = false
precombat = ["demon_armor", "summon_voidwalker", "demonic_sacrifice", "summon_felhunter", { cast = "summon_imp", if = "!pet.active" }, "soul_link"]
opener = []
actions = [
  { cast = "healthstone", if = "hp_pct < 0.3" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "death_coil", if = "hp_pct < 0.4" },
  { cast = "life_tap", if = "mana_pct < 0.25 && hp_pct > 0.6" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "corruption" },
  { cast = "bane_of_agony", if = "target.hp_pct > 0.3 || target.boss" },
  { cast = "siphon_life" },
  { cast = "immolate", if = "target.hp_pct > 0.4 && !known.siphon_life" },
  { cast = "shadow_bolt", if = "aura.shadow_trance.up" },
  { cast = "drain_life", if = "hp_pct < 0.75" },
  { cast = "searing_pain", if = "t.demonic_brand > 0 && !pet.aura.demonic_brand.up" },
  { cast = "shadow_bolt" },
]
rest = [
  { cast = "summon_voidwalker", if = "!aura.sacrifice_voidwalker.up && !pet.active && known.demonic_sacrifice" },
  { cast = "demonic_sacrifice", if = "pet.voidwalker.active && known.demonic_sacrifice" },
  { cast = "summon_felhunter", if = "!pet.active" },
  { cast = "summon_imp", if = "!pet.active" },
  { cast = "soul_link" },
  { cast = "life_tap", if = "mana_pct < 0.7 && hp_pct > 0.8" },
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "demon_armor" },
]
eat_below = 0.5
drink_below = 0.35

[rotations.destruction]
desc = "Destruction with the Imp: Immolate, Conflagrate, Shadowburn to finish, Incinerate or Shadow Bolt"
auto_melee = false
precombat = ["demon_armor", "summon_imp"]
opener = []
actions = [
  { cast = "healthstone", if = "hp_pct < 0.3" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.3 && (target.boss || target.is_player)" },
  { cast = "death_coil", if = "hp_pct < 0.4" },
  { cast = "life_tap", if = "mana_pct < 0.2 && hp_pct > 0.5" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "shadowburn", if = "target.hp_pct < 0.25" },
  { cast = "immolate", if = "target.hp_pct > 0.25 || target.boss" },
  { cast = "conflagrate" },
  { cast = "corruption", if = "target.boss" },
  { cast = "incinerate", if = "target.aura.immolate.up" },
  { cast = "shadow_bolt" },
]
rest = [
  { cast = "summon_imp", if = "!pet.active" },
  { cast = "life_tap", if = "mana_pct < 0.7 && hp_pct > 0.8" },
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "demon_armor" },
]
eat_below = 0.5
drink_below = 0.35
