[talents.demonic_aegis]
icon = "spell_shadow_ragingscream"
tree = "Demonology"
points = 5
ranks = 2
text = "Demon Skin and Demon Armor +30%."
[talents.improved_voidwalker]
icon = "spell_shadow_summonvoidwalker"
tree = "Demonology"
points = 5
ranks = 3
text = "Voidwalker abilities +30% (Torment threat only here)."
[talents.fel_vitality]
icon = "spell_shadow_demonictactics"
tree = "Demonology"
points = 5
ranks = 3
text = "Demon health and mana +15%, your maximum mana +15%."
mods = [{ stat = "max_mana_mult", mul = "1 + 0.05 * rank" }]
[talents.demonic_energies]
icon = "spell_shadow_felmending"
tree = "Demonology"
points = 5
ranks = 2
text = "Your spells heal your demon for 15% of their damage, and Life Tap gives it 100% of the mana you gain (demons don't spend mana in the sim yet)."
procs = [{ on = "spell_landed", if = "pet.active", effects = [{ type = "heal", target = "pet", amount = "event.amount * (rank == 1 ? 0.08 : 0.15)", tag = "Demonic Energies" }] }]
[talents.improved_sayaad]
icon = "ability_warlock_randomizesuccubusincubus"
tree = "Demonology"
points = 10
ranks = 3
text = "Lash of Pain +30%."
[talents.demonic_sacrifice]
icon = "spell_shadow_psychicscream"
tree = "Demonology"
points = 10
ranks = 1
text = "Sacrifice your demon for 2 hours: Imp +15% Shadow (Burning Shadow), Voidwalker 2% mana per 4 sec, Succubus +15% Fire (Touch of Fire), Felhunter 3% health per 4 sec."
[talents.master_summoner]
icon = "spell_shadow_impphaseshift"
tree = "Demonology"
points = 10
ranks = 2
text = "Summons cost 40% less and cast 4 sec faster (the cast time does not matter yet: summons happen between pulls)."
spell_mods = [
  { spells = ["summon_imp", "summon_voidwalker", "summon_succubus", "summon_felhunter"], prop = "cost", mul = "1 - 0.2 * rank" },
  { spells = ["summon_imp", "summon_voidwalker", "summon_succubus", "summon_felhunter"], prop = "cast_time", add = "-2 * rank" },
]
[talents.decimation]
icon = "spell_fire_fireball02"
tree = "Demonology"
points = 15
ranks = 2
text = "Soul Fire cooldown -90%. Shadow Bolt and Searing Pain on a target below 35% health deal 6% more and make your next Soul Fire within 10 sec cast 40% faster."
# Spell 440870 lists the damage bonus without a value; the trait data (and
# the tooltip) give 3% a rank.
spell_mods = [
  { spells = ["soul_fire"], prop = "cooldown", mul = "1 - 0.45 * rank" },
  { spells = ["shadow_bolt", "searing_pain"], prop = "damage", mul = "target.hp_pct < 0.35 ? 1 + 0.03 * rank : 1" },
]
procs = [
  { on = "cast:shadow_bolt", if = "target.hp_pct < 0.35", effects = [{ type = "aura", aura = "decimation" }] },
  { on = "cast:searing_pain", if = "target.hp_pct < 0.35", effects = [{ type = "aura", aura = "decimation" }] },
]
[talents.fel_domination]
icon = "spell_nature_removecurse"
tree = "Demonology"
points = 15
ranks = 1
requires = "master_summoner"
text = "Faster summon (not simulated)."
# Spell 1293695 adds 3 charges to the brand and halves Searing Pain's
# threat; the trait data (and the tooltip) give 2/4/6 attacks and 17/33/50%
# less threat by rank.
[talents.demonic_brand]
icon = "ability_demonhunter_chaoticimprint_fire"
tree = "Demonology"
points = 15
ranks = 3
text = "Searing Pain brands the target: your demon's next 2/4/6 attacks deal 65-68 + 7.8% of your spell power extra Fire damage. Searing Pain causes 50% less threat."
procs = [{ on = "cast:searing_pain", if = "pet.active", effects = [{ type = "aura", aura = "demonic_brand", target = "pet" }] }]
spell_mods = [{ spells = ["searing_pain"], prop = "threat", mul = "1 - interp(rank, 1,0.17, 2,0.33, 3,0.5)" }]
[talents.improved_felhunter]
icon = "spell_shadow_summonfelhunter"
tree = "Demonology"
points = 20
ranks = 3
text = "Felhunter abilities (not simulated)."
[talents.soul_link]
icon = "spell_shadow_gathershadows"
tree = "Demonology"
points = 20
ranks = 1
requires = "demonic_sacrifice"
text = "30% of damage you take goes to your demon; both deal 3% more while it is out."
[talents.demonic_knowledge]
icon = "spell_shadow_improvedvampiricembrace"
tree = "Demonology"
points = 20
ranks = 3
text = "You and your demon gain spell damage up to 100% of your level (33%, 67%, 100% by rank) while it is out."
mods = [{ stat = "sp", add = "pet.active ? level * interp(rank, 1,0.33, 2,0.67, 3,1) : 0" }]
# Spells 23759-23762 are auras on you and your demon. The Felhunter's lists
# no base value (0.2 a level); the trait data (and the tooltip) give 2% a rank.
[talents.master_demonologist]
icon = "spell_shadow_shadowpact"
tree = "Demonology"
points = 25
ranks = 5
text = "For you and your demon. Imp: +10% Fire damage. Voidwalker: -10% physical damage taken. Succubus: +10% Shadow damage. Felhunter: -10% spell damage taken."
mods = [
  { stat = "fire_dmg_done", mul = "pet.imp.active ? 1 + 0.02 * rank : 1" },
  { stat = "phys_dmg_taken", mul = "pet.voidwalker.active ? 1 - 0.02 * rank : 1" },
  { stat = "shadow_dmg_done", mul = "pet.succubus.active ? 1 + 0.02 * rank : 1" },
  { stat = "spell_dmg_taken", mul = "pet.felhunter.active ? 1 - 0.02 * rank : 1" },
]
[talents.demonic_pact]
icon = "inv_ability_soulharvesterwarlock_demonicsoul"
tree = "Demonology"
points = 30
ranks = 1
requires = "soul_link"
text = "Demonic Sacrifice survives summoning a different demon."

[talents.destructive_reach]
icon = "spell_shadow_corpseexplode"
tree = "Destruction"
points = 0
ranks = 2
text = "Destruction spells reach 10% farther per point."
[talents.improved_shadow_bolt]
