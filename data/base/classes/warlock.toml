# ------------------------------------------------------------------ rotations
[rotations.affliction_drain]
desc = "Affliction leveling with the Voidwalker tanking: Corruption, Bane of Agony, Siphon Life, Wrack, Nightfall Shadow Bolts, Drain Life when hurt, Life Tap, and Fear for anything that reaches you"
auto_melee = false
precombat = ["demon_armor", "demon_skin", "summon_voidwalker"]
opener = []
actions = [
  { cast = "healthstone", if = "hp_pct < 0.3", emergency = true },
  { cast = "healing_potion", if = "potions && (hp_pct < 0.2)", emergency = true },
  { cast = "death_coil", if = "hp_pct < 0.4", emergency = true },
  { cast = "life_tap", if = "mana_pct < 0.25 && hp_pct > (fight.boss && !has_aggro ? 0.25 : 0.6)" },   # on a boss with the tank holding it, nobody hits you: tap deeper
  { cast = "howl_of_terror", if = "enemies_within_10 >= 2 && (hp_pct < 0.4 || !target.is_player)" },   # two or more on you: everyone near runs while the DoTs tick (players: kept for when it gets bad)
  { cast = "fear", if = "target.is_player && !target.feared && !target.held && !target.immune_fear && target.dist < 8" },   # a player in your face: fear it first, then DoT it (not through Berserk and the like)
  { cast = "fear", if = "!target.is_player && !target.boss && !target.feared && hp_pct < 0.5 && has_aggro && target.dist < 8" },   # it's on you: fear it off, let the DoTs work
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "corruption" },
  { cast = "corruption", target = "other_enemy", pick = "undotted", if = "enemies >= 2 && target.hp_pct > 0.3 && !target.feared && !target.incapacitated && !target.stunned" },   # spread it
  { cast = "amplify_curse", if = "!target.aura.bane_of_agony.up && (target.hp_pct > 0.3 || target.boss)" },
  { cast = "bane_of_agony", if = "target.hp_pct > 0.3 || target.boss" },
