# Warlock. Talents and spell ranks: Forever client 1.60.1.70338
# (wowforevertalents.com/warlock and /abilities/warlock, checked 2026-10-15).
# Spell ranks, costs, coefficients, DoT ticks and talent values are checked
# against Forever's spell data (data/reference/spellbook.json, build 70338;
# `fsim audit warlock`, deliberate differences in
# data/reference/accepted/warlock.toml). Talent values per rank and talent
# prerequisites are Forever's trait data (the talents section of the
# spellbook), which is what the in-game talent tooltips show. Demon base
# stats (health, armor, melee damage) are Classic approximations: they live
# in the creature data, which the spell data does not include. Base stats are
# Classic 1.12.
name = "Warlock"
icon = "classicon_warlock"
resources = ["mana"]
source = "forever-70338"

base = [
  { level = 1, str = 20, agi = 20, sta = 21, int = 22, spi = 23, hp = 23, mana = 90 },
  { level = 40, str = 37, agi = 41, sta = 49, int = 80, spi = 85, hp = 820, mana = 840 },
  { level = 60, str = 47, agi = 52, sta = 64, int = 108, spi = 113, hp = 1414, mana = 1373 },
]

[formulas]
ap = "str - 10"
rap = "agi - 10"
melee_crit = "agi / 20"
ranged_crit = "agi / 20"
spell_crit = "1.7 + int / interp(level, 1,10, 40,40, 60,60.6)"
dodge = "agi / 20"
mana_regen = "(8 + spi / 4) * (1 + 0.5 * t.soul_harvest * aura.soul_harvest.up)"
hp_regen = "spi * 0.1 + 2"

# ------------------------------------------------------------------ talents
# Per-rank values follow Forever's trait data, which is not always linear
# (Improved Drains 7/13/20, Cataclysm 3/6/10). Where a talent's spell holds a
# different number (a Classic rank-1 leftover, or 0 for a script), the trait
# value is used: Improved Life Tap's spell 18182 lists 0, its trait 10/20.
[talents.improved_life_tap]
icon = "spell_shadow_burningspirit"
tree = "Affliction"
points = 0
ranks = 2
text = "Life Tap gives 20% more mana."
[talents.suppression]
icon = "spell_shadow_unsummonbuilding"
tree = "Affliction"
points = 0
ranks = 5
text = "+5% hit with spells and attacks, -20% threat. The game's talent spell (18174) raises hit with every spell, not only Affliction ones. It carries both a spell hit and a melee hit aura; Forever has one hit chance, so the sim counts the 5% once."
mods = [
  { stat = "hit", add = "rank" },
  { stat = "threat", mul = "1 - 0.04 * rank" },
]
[talents.improved_corruption]
icon = "spell_shadow_abominationexplosion"
tree = "Affliction"
points = 0
ranks = 5
text = "Corruption cast time -2 sec (instant at 5), damage +10%."
spell_mods = [
  { spells = ["corruption"], prop = "cast_time", add = "-0.4 * rank" },
  { spells = ["corruption"], prop = "damage", mul = "1 + 0.02 * rank" },
]
# Spell 1225177 lists 10 for both effects; the trait data (and the tooltip)
# give 1% a rank.
[talents.malediction]
icon = "spell_shadow_curseofachimonde"
tree = "Affliction"
points = 5
ranks = 5
text = "Periodic damage +5%: Corruption, Bane of Agony, Siphon Life, Wrack, Immolate's burn, Drain Life, Drain Soul and Hellfire's burn on you."
[talents.soul_harvest]
icon = "inv_elemental_primal_shadow"
tree = "Affliction"
points = 5
ranks = 2
text = "Killing a target afflicted by your Drain Soul raises your mana regeneration by 100% for 10 sec and lets it continue while casting."
procs = [{ on = "kill", if = "target.aura.drain_soul_mark.up", effects = [{ type = "aura", aura = "soul_harvest" }] }]
[talents.improved_drains]
icon = "spell_shadow_haunting"
tree = "Affliction"
points = 5
ranks = 3
text = "Drain Life, Drain Soul and Wrack +20% (7%, 13%, 20% by rank)."
spell_mods = [{ spells = ["drain_life", "drain_soul", "wrack"], prop = "damage", mul = "1 + interp(rank, 1,0.07, 2,0.13, 3,0.2)" }]
# Spell 18827 still lists Classic's 2; the trait data gives 5% a rank.
[talents.improved_bane_of_agony]
icon = "spell_shadow_curseofsargeras"
tree = "Affliction"
points = 10
ranks = 2
text = "Bane of Agony damage +10%."
spell_mods = [{ spells = ["bane_of_agony"], prop = "damage", mul = "1 + 0.05 * rank" }]
[talents.fel_concentration]
icon = "spell_shadow_fingerofdeath"
tree = "Affliction"
points = 10
ranks = 3
text = "70% chance to avoid pushback on Drain spells (23%, 47%, 70% by rank; applied to all casts here)."
mods = [{ stat = "pushback_resist", add = "interp(rank, 1,0.23, 2,0.47, 3,0.7)" }]
[talents.amplify_curse]
icon = "spell_shadow_contagion"
tree = "Affliction"
points = 10
ranks = 1
text = "Amplify Curse (3 min cooldown, no global cooldown): your next Bane of Agony within 30 sec deals 50% more. Its effect on Curse of Weakness and Curse of Exhaustion is not simulated."
procs = [{ on = "cast:bane_of_agony", if = "aura.amplify_curse.up", effects = [{ type = "aura", aura = "amplified_agony", target = "target" }, { type = "remove_aura", aura = "amplify_curse" }] }]
[talents.pandemic]
icon = "spell_shadow_unstableaffliction_2"
tree = "Affliction"
points = 10
ranks = 3
text = "Corruption, Bane of Agony, Drain Life, Drain Soul, Siphon Life and Wrack can crit, for +100% crit damage bonus (33%, 67%, 100% by rank)."
[talents.malevolence]
icon = "spell_shadow_focusedpower"
tree = "Affliction"
points = 15
ranks = 5
text = "Shadow spell crit +5%."
spell_mods = [{ school = "shadow", prop = "crit", add = "rank" }]
[talents.nightfall]
icon = "spell_shadow_twilight"
tree = "Affliction"
points = 15
ranks = 2
text = "Corruption, Drain Life, Drain Soul and Wrack ticks have a 4% chance (2% a rank, assumption nightfall_chance) to make the next Shadow Bolt instant."
[talents.curse_of_exhaustion]
icon = "spell_shadow_grimward"
tree = "Affliction"
points = 15
ranks = 1
requires = "amplify_curse"
text = "Learns Curse of Exhaustion: slows the target 30% for 12 sec."
[talents.siphon_life]
