# ------------------------------------------------------------------ rotations
[rotations.feral_cat]
desc = "Cat with shift-healing: Pounce/Ravage/Rake opener, Rake, Rip on long fights, Ferocious Bite, Shred from behind or Claw, Shifting Power; leaves Cat Form to Rejuvenation/Swiftmend/Regrowth when low"
precombat = ["mark_of_the_wild", "thorns", "cat_form", "prowl"]
opener = ["pounce", "ravage"]
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "berserk", if = "feared" },
  { cast = "barkskin", if = "hp_pct < 0.5" },
  { cast = "natures_grasp", if = "hp_pct < 0.6 && target.is_player" },
  { cast = "caster_form", if = "form.cat_form && hp_pct < 0.4 && mana_pct > 0.3" },
  { cast = "natures_swiftness", if = "!form.any && hp_pct < 0.3" },
  { cast = "healing_touch", if = "!form.any && aura.natures_swiftness.up" },
  { cast = "rejuvenation", if = "!form.any && hp_pct < 0.85" },
  { cast = "swiftmend", if = "!form.any && hp_pct < 0.7" },
  { cast = "regrowth", if = "!form.any && hp_pct < 0.6 && mana_pct > 0.15" },
  { cast = "healing_touch", if = "!form.any && hp_pct < 0.5 && !known.regrowth" },
  { cast = "cat_form", if = "!form.any" },
  { cast = "shifting_power", if = "energy < 30 && mana_pct > 0.35" },
  { cast = "berserk", if = "target.is_player || target.boss" },
  { cast = "rip", if = "cp >= 4 && !target.aura.rip.up && (target.boss || target.hp_pct > 0.5)" },
  { cast = "ferocious_bite", if = "cp >= 5 || (cp >= 2 && target.hp_pct < 0.2)" },
  { cast = "rake", if = "!target.aura.rake.up && (target.boss || target.hp_pct > 0.3)" },
  { cast = "shred" },
  { cast = "claw" },
  { cast = "wrath", if = "!known.cat_form" },
]
rest = [
  { cast = "caster_form", if = "form.any && hp_pct < 0.8 && mana_pct > 0.4" },
  { cast = "rejuvenation", if = "!form.any && hp_pct < 0.8" },
  { cast = "regrowth", if = "!form.any && hp_pct < 0.6" },
  { cast = "mark_of_the_wild", if = "!form.any" },
  { cast = "thorns", if = "!form.any" },
  { cast = "cat_form", if = "!form.any && hp_pct >= 0.8" },
  { cast = "prowl" },
]
eat_below = 0.45
drink_below = 0.35

[rotations.bear]
desc = "Bear tank: Primal Bite, Lacerate to five, Swipe on packs, Maul with spare Rage, Enrage, Frenzied Regeneration and Barkskin when low"
precombat = ["mark_of_the_wild", "thorns", "bear_form"]
opener = []
actions = [
  { cast = "bear_form", if = "!form.any" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "berserk", if = "feared" },
  { cast = "frenzied_regeneration", if = "hp_pct < 0.4 && rage >= 20" },
  { cast = "barkskin", if = "hp_pct < 0.5" },
  { cast = "caster_form", if = "form.bear_form && hp_pct < 0.25 && mana_pct > 0.25 && !aura.frenzied_regeneration.up" },
  { cast = "natures_swiftness", if = "!form.any && hp_pct < 0.4" },
  { cast = "healing_touch", if = "!form.any && aura.natures_swiftness.up" },
  { cast = "rejuvenation", if = "!form.any && hp_pct < 0.6" },
  { cast = "swiftmend", if = "!form.any && hp_pct < 0.6" },
  { cast = "regrowth", if = "!form.any && hp_pct < 0.45 && mana_pct > 0.15" },
  { cast = "bear_form", if = "!form.any" },
  { cast = "enrage", if = "rage < 20" },
  { cast = "bash", if = "target.is_player || target.casting" },
  { cast = "berserk", if = "enemies >= 2" },
  { cast = "primal_bite" },
  { cast = "swipe", if = "enemies >= 2" },
  { cast = "lacerate", if = "target.aura.lacerate.stacks < 5 || target.aura.lacerate.remains < 4" },
  { cast = "maul", if = "rage >= 35" },
  { cast = "swipe", if = "rage >= 50" },
]
rest = [
  { cast = "caster_form", if = "form.any && hp_pct < 0.7 && mana_pct > 0.4" },
  { cast = "rejuvenation", if = "!form.any && hp_pct < 0.8" },
  { cast = "regrowth", if = "!form.any && hp_pct < 0.6" },
  { cast = "mark_of_the_wild", if = "!form.any" },
