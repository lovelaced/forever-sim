# ------------------------------------------------------------------ rotations
# Faerie Fire is free in Cat and Bear Form and lasts 40 sec, so cats and
# bears keep it on every target, normal mobs included. In solo_1 it gains
# kills per hour at levels 20 to 40 (cats +3 to +6%, bears +2 to +4%); at 60
# cats lose under 1%, partly because the sim's Cat Form global cooldown is
# 1.5 sec instead of the game's 1.0.
[rotations.feral_cat]
desc = "Cat with shift-healing: Pounce/Ravage/Rake opener, Faerie Fire, Rake, Rip on long fights, Ferocious Bite, Shred from behind or Claw, Shifting Power; leaves Cat Form to Rejuvenation/Swiftmend/Regrowth when low"
precombat = ["mark_of_the_wild", "thorns", "cat_form", "prowl"]
opener = ["pounce", "ravage"]
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "berserk", if = "feared" },
  { cast = "barkskin", if = "hp_pct < 0.5" },
  { cast = "natures_grasp", if = "hp_pct < 0.6 && target.is_player" },
  { cast = "caster_form", if = "form.cat_form && hp_pct < 0.4 && mana_pct > 0.3" },
  { cast = "natures_swiftness", if = "!form.any && hp_pct < 0.3" },
  { cast = "healing_touch", if = "!form.any && aura.natures_swiftness.up" },
  { cast = "rejuvenation", if = "!form.any && hp_pct < 0.85" },
  { cast = "swiftmend", if = "!form.any && hp_pct < 0.7" },
  { cast = "regrowth", if = "!form.any && hp_pct < 0.6 && mana_pct > 0.15" },
  { cast = "healing_touch", if = "!form.any && hp_pct < 0.5 && !known.regrowth" },
  { cast = "cat_form", if = "!form.any" },
  { cast = "shifting_power", if = "energy < 30 && mana_pct > 0.35" },
  { cast = "berserk", if = "target.is_player || target.boss" },
  { cast = "faerie_fire", if = "!target.aura.faerie_fire.up" },
  { cast = "rip", if = "cp >= 4 && !target.aura.rip.up && (target.boss || target.hp_pct > 0.5)" },
  { cast = "ferocious_bite", if = "cp >= 5 || (cp >= 2 && target.hp_pct < 0.2)" },
  { cast = "rake", if = "!target.aura.rake.up && (target.boss || target.hp_pct > 0.3)" },
  { cast = "shred" },
  { cast = "claw" },
  { cast = "wrath", if = "!known.cat_form" },
]
rest = [
  { cast = "caster_form", if = "form.any && hp_pct < 0.8 && mana_pct > 0.4" },
  { cast = "rejuvenation", if = "!form.any && hp_pct < 0.8" },
  { cast = "regrowth", if = "!form.any && hp_pct < 0.6" },
  { cast = "mark_of_the_wild", if = "!form.any" },
  { cast = "thorns", if = "!form.any" },
  { cast = "cat_form", if = "!form.any && hp_pct >= 0.8" },
  { cast = "prowl" },
]
eat_below = 0.45
drink_below = 0.35

[rotations.bear]
desc = "Bear tank: Faerie Fire, Primal Bite, Lacerate to five, Swipe on packs, Maul with spare Rage, Enrage, Frenzied Regeneration and Barkskin when low"
precombat = ["mark_of_the_wild", "thorns", "bear_form"]
opener = []
actions = [
  { cast = "bear_form", if = "!form.any" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "berserk", if = "feared" },
  { cast = "frenzied_regeneration", if = "hp_pct < 0.4 && rage >= 20" },
  { cast = "barkskin", if = "hp_pct < 0.5" },
  { cast = "caster_form", if = "form.bear_form && hp_pct < 0.25 && mana_pct > 0.25 && !aura.frenzied_regeneration.up" },
  { cast = "natures_swiftness", if = "!form.any && hp_pct < 0.4" },
  { cast = "healing_touch", if = "!form.any && aura.natures_swiftness.up" },
  { cast = "rejuvenation", if = "!form.any && hp_pct < 0.6" },
  { cast = "swiftmend", if = "!form.any && hp_pct < 0.6" },
  { cast = "regrowth", if = "!form.any && hp_pct < 0.45 && mana_pct > 0.15" },
  { cast = "bear_form", if = "!form.any" },
  { cast = "enrage", if = "rage < 20" },
  { cast = "bash", if = "target.is_player || target.casting" },
  { cast = "berserk", if = "enemies >= 2" },
  { cast = "faerie_fire", if = "!target.aura.faerie_fire.up" },
  { cast = "primal_bite" },
  { cast = "swipe", if = "enemies >= 2" },
  { cast = "lacerate", if = "target.aura.lacerate.stacks < 5 || target.aura.lacerate.remains < 4" },
  { cast = "maul", if = "rage >= 35" },
  { cast = "swipe", if = "rage >= 50" },
]
rest = [
  { cast = "caster_form", if = "form.any && hp_pct < 0.7 && mana_pct > 0.4" },
  { cast = "rejuvenation", if = "!form.any && hp_pct < 0.8" },
  { cast = "regrowth", if = "!form.any && hp_pct < 0.6" },
  { cast = "mark_of_the_wild", if = "!form.any" },
  { cast = "thorns", if = "!form.any" },
  { cast = "bear_form", if = "!form.any && hp_pct >= 0.7" },
]
eat_below = 0.45
drink_below = 0.3

[rotations.balance]
desc = "Balance: Moonkin Form, Moonfire, Insect Swarm, Wrath then two Starfires (Eclipse) while mana lasts, Wrath before Eclipse or when mana is low (Starfire without Improved Wrath); leaves Moonkin to heal"
auto_melee = false
precombat = ["mark_of_the_wild", "thorns", "moonkin_form"]
opener = []
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.25 && (target.boss || target.is_player)" },
  { cast = "barkskin", if = "hp_pct < 0.5" },
  { cast = "caster_form", if = "form.moonkin_form && hp_pct < 0.4" },
  { cast = "natures_swiftness", if = "!form.any && hp_pct < 0.3" },
  { cast = "healing_touch", if = "!form.any && aura.natures_swiftness.up" },
  { cast = "rejuvenation", if = "!form.any && hp_pct < 0.7" },
  { cast = "swiftmend", if = "!form.any && hp_pct < 0.6" },
  { cast = "regrowth", if = "!form.any && hp_pct < 0.5" },
  { cast = "moonkin_form", if = "!form.any && hp_pct >= 0.5" },
  { cast = "moonfire", if = "target.hp_pct > 0.25 || target.boss" },
  { cast = "insect_swarm", if = "target.hp_pct > 0.3 || target.boss" },
  # Eclipse Starfires while there is mana for them, Wrath once mana runs low
  # (Warcraft Tavern: two Starfires to one Wrath after 30; Wrath "until the
  # enemy is nearly dead or you run low on mana"). On a boss this gains 9%
  # at level 60 against Starfire down to empty.
  { cast = "starfire", if = "(aura.eclipse.up && mana_pct > 0.3) || !known.wrath" },
  { cast = "wrath", if = "t.eclipse > 0 && !aura.eclipse.up" },
  # Before Eclipse, and when mana is low, a druid with Improved Wrath casts
  # Wrath (Warcraft Tavern: "Before level 30, cast Wrath"). With the talent's
  # -50% cost Wrath does about the same damage per second as Starfire for half
  # the mana per point of damage; without it (Restoration) Starfire is the
  # better nuke.
  { cast = "wrath", if = "t.improved_wrath >= 3" },
  { cast = "starfire" },
  { cast = "wrath" },
]
rest = [
  { cast = "caster_form", if = "form.any && hp_pct < 0.8 && mana_pct > 0.4" },
  { cast = "rejuvenation", if = "!form.any && hp_pct < 0.8" },
  { cast = "mark_of_the_wild", if = "!form.any" },
  { cast = "thorns", if = "!form.any" },
  { cast = "moonkin_form", if = "!form.any && hp_pct >= 0.8" },
]
eat_below = 0.45
drink_below = 0.4

# Restoration solo (builds/druid/restoration.toml): the Balance rotation's
# damage and self-healing without Moonkin Form or Eclipse. Warcraft Tavern
# levels Restoration with Wrath and Moonfire ("not recommended due to their
# slow kill times"); without Improved Wrath, Starfire does more damage for
# its mana than Wrath, so it is the main nuke from 20.
[rotations.restoration]
desc = "Restoration played solo: Thorns, Moonfire (and Insect Swarm if known), Starfire (Wrath before 20), Rejuvenation, Swiftmend and Regrowth when hurt, Nature's Swiftness with Healing Touch in an emergency"
auto_melee = false
precombat = ["mark_of_the_wild", "thorns"]
opener = []
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.25 && (target.boss || target.is_player)" },
  { cast = "barkskin", if = "hp_pct < 0.5" },
  { cast = "caster_form", if = "form.any" },
  { cast = "natures_swiftness", if = "hp_pct < 0.3" },
  { cast = "healing_touch", if = "aura.natures_swiftness.up" },
  { cast = "rejuvenation", if = "hp_pct < 0.7" },
  { cast = "swiftmend", if = "hp_pct < 0.6" },
  { cast = "regrowth", if = "hp_pct < 0.5" },
  { cast = "moonfire", if = "target.hp_pct > 0.25 || target.boss" },
  { cast = "insect_swarm", if = "target.hp_pct > 0.3 || target.boss" },
  { cast = "wrath", if = "t.improved_wrath >= 3" },
  { cast = "starfire" },
  { cast = "wrath" },
]
rest = [
  { cast = "caster_form", if = "form.any" },
  { cast = "rejuvenation", if = "hp_pct < 0.8" },
  { cast = "mark_of_the_wild" },
  { cast = "thorns" },
]
eat_below = 0.45
drink_below = 0.4
