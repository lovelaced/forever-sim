# ------------------------------------------------------------------ passives
[[passives]]
name = "Omen of Clarity"
# Forever's spell (16864): "Your spells and attacks have a chance to grant you
# Clearcasting". Its proc types (81940) are melee auto attacks, melee
# abilities, and helpful and harmful magic spells; 100% chance in the data,
# at most once per 10 sec (Moonkin Form: double chance, half the cooldown).
# The game's server sets the real rate, so the chance per hit is
# opt.omen_ppm and the chance per spell opt.omen_spell_chance; the internal
# cooldown is the game's.
# Spells: the magic spells that cost Mana (spells and abilities that cost
# nothing can't trigger it, per the Oct 15 notes). Wrath triggers it but
# can't use it (the tooltip). Shapeshifts and Shifting Power are not
# magic spells (no damage class), so they don't count. In this build Faerie
# Fire in Cat and Bear Form, free there, still triggers it (the bug the
# Oct 15 notes fix).
procs = [
  { on = "melee_landed", if = "opt.druid_omen > 0 && !event.extra && !aura.omen_cooldown.up", ppm = "opt.omen_ppm * (form.moonkin_form ? 2 : 1)", effects = [{ type = "aura", aura = "clearcasting" }, { type = "aura", aura = "omen_cooldown" }] },
  { on = "cast", if = "opt.druid_omen > 0 && !aura.omen_cooldown.up && (spell.wrath || spell.moonfire || spell.starfire || spell.insect_swarm || spell.entangling_roots || spell.natures_grasp || spell.thorns || spell.mark_of_the_wild || spell.faerie_fire || spell.healing_touch || spell.rejuvenation || spell.regrowth || spell.swiftmend || spell.wild_growth)", chance = "opt.omen_spell_chance * (form.moonkin_form ? 2 : 1)", effects = [{ type = "aura", aura = "clearcasting" }, { type = "aura", aura = "omen_cooldown" }] },
]

# ------------------------------------------------------------------ auras (forms)
[auras.cat_form]
name = "Cat Form"
form = true
# Cat Form (Passive) 3025: 12 attack power + 2 per level above 6 (r.ap), 29%
# less threat; Agility counts as attack power in Cat Form.
mods = [
  { stat = "ap", add = "r.ap + agi" },
  { stat = "threat", mul = 0.71 },
  { stat = "weapon_speed_override", add = 1.0 },
  { stat = "energy_active", add = 1 },
]
# Faerie Fire costs nothing in Cat Form (Oct 15 notes).
spell_mods = [{ spells = ["faerie_fire"], prop = "cost", mul = 0 }]
on_apply = [{ type = "chance", p = "1 - 0.2 * t.furor", then = [{ type = "resource", res = "energy", amount = 0, set = true }] }]
[auras.bear_form]
name = "Bear Form"
form = true
# Bear Form (Passive) 1178 / Dire Bear Form (Passive) 9635 give the rank's
# attack power, armor and health; Bear Form (Passive2) 21178: +50% threat.
# Shifting into Bear Form empties your Energy, Furor or not (the Oct 15 notes:
# Furor "now allows the player to retain the Energy ... even if they go into
# Bear or Dire Bear Form").
mods = [
  { stat = "ap", add = "r.ap" },
  { stat = "armor_mult", mul = "1 + r.armor" },
  { stat = "max_hp_add", add = "r.hp" },
  { stat = "threat", mul = 1.5 },
  { stat = "weapon_speed_override", add = 2.5 },
]
# Faerie Fire costs nothing in Bear and Dire Bear Form (Oct 15 notes).
spell_mods = [{ spells = ["faerie_fire"], prop = "cost", mul = 0 }]
on_apply = [{ type = "resource", res = "rage", amount = 0, set = true }, { type = "chance", p = "0.2 * t.furor", then = [{ type = "resource", res = "rage", amount = 10 }] }, { type = "resource", res = "energy", amount = 0, set = true }]
[auras.moonkin_form]
name = "Moonkin Form"
form = true
mods = [{ stat = "armor_mult", mul = 4.6 }, { stat = "crit", add = 3 }]
[auras.prowl]
name = "Prowl"
# any damage you deal or take, or Faerie Fire, ends it (Pounce and Ravage
# remove it themselves; buffs on yourself don't)
break_on_damage = true
procs = [
  { on = "damage_dealt", effects = [{ type = "remove_self" }] },
