# Druid. Talents and spell ranks: Forever client 1.60.1.70338
# (wowforevertalents.com/druid and /abilities/druid, checked 2026-10-15),
# checked against Forever's spell data (data/reference/spellbook.json, build
# 70338) with `fsim audit druid`; deliberate differences are listed in
# data/reference/accepted/druid.toml.
# Forever rules used: weapon DPS counts in forms; Furor keeps your Energy
# when you shift out and regenerates it in caster form; Naturalist adds
# damage; Swiftmend does not consume the heal over time; Barkskin and
# Nature's Grasp work in forms; Rejuvenation, Regrowth's heal over time and
# Wild Growth can crit (patch notes). Attack power bonuses of Rake, Rip,
# Ferocious Bite, Lacerate and Swipe, Thorns' spell power ratio and the
# threat of bear attacks are not in the client data; they are assumptions
# (opt.druid_*). Omen of Clarity (16864, level 20) has no trainer row in
# the client tables, but the Oct 15 notes fix a bug in it, so druids have it
# (opt.druid_omen, on by default); its proc rates are assumptions.
# Talent spells: most multi-rank Forever talents keep one spell whose value
# is sometimes the per-rank step and sometimes the total, so rank values,
# points and prerequisites follow the client's trait tables (the "talents"
# section of the spellbook), which agree with the tooltips; which spells a
# talent changes follows the spell data.
name = "Druid"
icon = "classicon_druid"
resources = ["mana", "rage", "energy"]
energy_gcd = false
source = "forever-70338"

base = [
  { level = 1, str = 21, agi = 20, sta = 20, int = 22, spi = 22, hp = 44, mana = 60 },
  { level = 40, str = 47, agi = 45, sta = 52, int = 74, spi = 82, hp = 870, mana = 750 },
  { level = 60, str = 62, agi = 60, sta = 69, int = 100, spi = 110, hp = 1483, mana = 1244 },
]

[formulas]
ap = "str * 2 - 20"
rap = "agi - 10"
melee_crit = "agi / interp(level, 1,4, 40,14, 60,20)"
ranged_crit = "agi / interp(level, 1,4, 40,14, 60,20)"
spell_crit = "1.8 + int / interp(level, 1,10, 40,40, 60,60)"
dodge = "agi / interp(level, 1,4, 40,14, 60,20)"
mana_regen = "15 + spi / 5"
hp_regen = "spi * 0.15 + 3"

