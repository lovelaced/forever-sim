# ------------------------------------------------------------------ passives
[[passives]]
name = "Omen of Clarity (if trainable)"
procs = [{ on = "melee_landed", if = "opt.druid_omen > 0 && !event.extra", ppm = "opt.omen_ppm * (form.moonkin_form ? 2 : 1)", effects = [{ type = "aura", aura = "clearcasting" }] }]

# ------------------------------------------------------------------ auras (forms)
[auras.cat_form]
name = "Cat Form"
form = true
mods = [
  { stat = "ap", add = "120 + agi" },
  { stat = "weapon_speed_override", add = 1.0 },
  { stat = "energy_active", add = 1 },
]
on_apply = [{ type = "chance", p = "1 - 0.2 * t.furor", then = [{ type = "resource", res = "energy", amount = 0, set = true }] }]
[auras.bear_form]
name = "Bear Form"
form = true
mods = [
  { stat = "ap", add = "r.ap" },
  { stat = "armor_mult", mul = "1 + r.armor" },
  { stat = "max_hp_add", add = "r.hp" },
  { stat = "weapon_speed_override", add = 2.5 },
]
on_apply = [{ type = "resource", res = "rage", amount = 0, set = true }, { type = "chance", p = "0.2 * t.furor", then = [{ type = "resource", res = "rage", amount = 10 }] }]
[auras.moonkin_form]
name = "Moonkin Form"
form = true
mods = [{ stat = "armor_mult", mul = 4.6 }, { stat = "crit", add = 3 }]
[auras.prowl]
name = "Prowl"
[auras.clearcasting]
name = "Clearcasting"
duration = 15
consume_on_cast = true
spell_mods = [{ spells = ["claw", "shred", "rake", "rip", "ferocious_bite", "maul", "swipe", "lacerate", "primal_bite", "wrath", "starfire", "moonfire", "healing_touch", "regrowth"], prop = "cost", mul = 0 }]

# ------------------------------------------------------------------ auras (other)
[auras.mark_of_the_wild]
name = "Mark of the Wild"
mods = [{ stat = "armor", add = "r.armor" }, { stat = "all_stats", add = "r.stats" }]
[auras.thorns]
name = "Thorns"
duration = 600
procs = [{ on = "struck_melee", effects = [{ type = "damage", school = "nature", target = "target", hit = "auto", can_crit = false, no_proc = true, amount = "r.dmg", tag = "Thorns" }] }]
[auras.natures_grasp]
name = "Nature's Grasp"
duration = 45
charges = 1
procs = [{ on = "struck_melee", effects = [{ type = "aura", aura = "root", target = "target", duration = 12 }, { type = "consume" }] }]
[auras.rake]
name = "Rake"
debuff = true
duration = 9
tick = { interval = 3, effects = [{ type = "damage", school = "physical", periodic = true, tag = "Rake", amount = "(r.dot + 0.06 * ap) / 3 * (1 + 0.01 * t.genesis)" }] }
[auras.rip]
name = "Rip"
debuff = true
refresh = "replace"
max_stacks = 5
duration = 12
text = "Stacks hold the combo points Rip was cast with."
tick = { interval = 2, effects = [{ type = "damage", school = "physical", periodic = true, tag = "Rip", amount = "(interp(stacks, 1,r.c1, 2,r.c2, 3,r.c3, 4,r.c4, 5,r.c5) + 0.048 * stacks * ap) / 6 * (1 + 0.01 * t.genesis)" }] }
[auras.pounce_bleed]
name = "Pounce Bleed"
debuff = true
duration = 18
tick = { interval = 3, effects = [{ type = "damage", school = "physical", periodic = true, tag = "Pounce", amount = "r.dot / 6 * (1 + 0.01 * t.genesis)" }] }
[auras.lacerate]
name = "Lacerate"
debuff = true
duration = 15
max_stacks = 5
tick = { interval = 3, effects = [{ type = "damage", school = "physical", periodic = true, tag = "Lacerate", amount = "(r.total + 0.05 * ap) / 5 * stacks * (1 + 0.01 * t.genesis)" }] }
[auras.moonfire]
name = "Moonfire"
debuff = true
duration = "r.dur + 3 * t.natures_splendor"
tick = { interval = 3, effects = [{ type = "damage", school = "arcane", periodic = true, tag = "Moonfire (dot)", amount = "r.dot / (r.dur / 3)", coef = "0.13 * 3 / r.dur", mult = "(1 + 0.01 * t.genesis) * (1 + 0.05 * t.improved_moonfire)" }] }
[auras.insect_swarm]
name = "Insect Swarm"
debuff = true
duration = "12 + 2 * t.natures_splendor"
tick = { interval = 2, effects = [{ type = "damage", school = "nature", periodic = true, tag = "Insect Swarm", amount = "r.total / 6", coef = "0.127", mult = "1 + 0.01 * t.genesis" }] }
[auras.rejuvenation]
name = "Rejuvenation"
duration = "12 + 3 * t.natures_splendor"
tick = { interval = 3, effects = [{ type = "heal", target = "target", periodic = true, tag = "Rejuvenation", amount = "r.total / 4", coef = 0.2, mult = "(1 + 0.01 * t.genesis) * (1 + 0.05 * t.improved_rejuvenation)" }] }
[auras.regrowth]
name = "Regrowth"
duration = "21 + 6 * t.natures_splendor"
tick = { interval = 3, effects = [{ type = "heal", target = "target", periodic = true, tag = "Regrowth (HoT)", amount = "r.hot / 7", coef = 0.1, mult = "1 + 0.01 * t.genesis" }] }
[auras.wild_growth]
name = "Wild Growth"
duration = 7
tick = { interval = 1, effects = [{ type = "heal", target = "target", periodic = true, tag = "Wild Growth", amount = "r.total / 7", coef = 0.07, mult = "1 + 0.01 * t.genesis" }] }
[auras.frenzied_regeneration]
name = "Frenzied Regeneration"
duration = 10
tick = { interval = 1, effects = [{ type = "heal", target = "self", tag = "Frenzied Regeneration", amount = "min(rage, 10) * 0.01 * max_hp" }, { type = "resource", res = "rage", amount = "-min(rage, 10)" }] }
[auras.enrage]
name = "Enrage"
duration = 10
mods = [{ stat = "armor_mult", mul = "aura.bear_form.up ? (level >= 40 ? 0.84 : 0.73) : 1" }]
tick = { interval = 1, effects = [{ type = "resource", res = "rage", amount = 2 }] }
[auras.barkskin]
name = "Barkskin"
duration = 15
mods = [{ stat = "phys_dmg_taken", mul = 0.8 }]
[auras.natures_grace]
name = "Nature's Grace"
duration = 3
mods = [{ stat = "cast_haste", mul = 1.1 }]
spell_mods = [{ prop = "gcd", add = -0.15 }]
[auras.eclipse]
name = "Eclipse"
duration = 15
charges = 2
consume_on_cast = true
spell_mods = [{ spells = ["starfire"], prop = "cast_time", add = "-t.eclipse / 6" }]
[auras.natures_swiftness]
name = "Nature's Swiftness"
consume_on_cast = true
spell_mods = [{ spells = ["healing_touch", "regrowth", "wrath", "starfire", "entangling_roots"], prop = "cast_time", mul = 0 }]
[auras.berserk]
name = "Berserk"
duration = 15
mods = [{ stat = "immune_fear", add = 1 }]
spell_mods = [{ spells = ["primal_bite"], prop = "cooldown", mul = 0 }, { spells = ["claw", "shred", "rake"], prop = "crit", add = 100 }]

# ------------------------------------------------------------------ spells: forms and buffs
[spells.cat_form]
name = "Cat Form"
level = 20
target = "self"
requires = "!form.cat_form"
cost = { mana = "0.55 * base_mana" }
effects = [{ type = "remove_aura", aura = "prowl" }, { type = "aura", aura = "cat_form" }]
[spells.bear_form]
name = "Bear Form"
