[auras.natures_grasp]
name = "Nature's Grasp"
duration = 45
charges = 1
text = "The first melee attacker is caught in Entangling Roots of Nature's Grasp's rank; the roots' damage over time is applied at once."
procs = [{ on = "struck_melee", effects = [
  { type = "aura", aura = "root", target = "target", duration = "r.dur" },
  { type = "damage", school = "nature", target = "target", hit = "spell", can_crit = false, no_proc = true, amount = "r.dot", coef = "0.02 * r.dur", mult = "(1 + 0.25 * t.improved_entangling_roots) * (1 + 0.01 * t.genesis)", tag = "Nature's Grasp" },
  { type = "consume" },
] }]
[auras.faerie_fire]
name = "Faerie Fire"
debuff = true
duration = 40
text = "Armor reduced (the rank's armor). Also stops stealth (not simulated)."
mods = [{ stat = "armor", add = "-r.armor" }]
[auras.rake]
name = "Rake"
debuff = true
duration = 9
tick = { interval = 3, effects = [{ type = "damage", school = "physical", periodic = true, tag = "Rake", amount = "(r.dot + opt.druid_rake_ap * ap) / 3 * (1 + 0.01 * t.genesis)" }] }
[auras.rip]
name = "Rip"
debuff = true
refresh = "replace"
max_stacks = 5
duration = 12
text = "Stacks hold the combo points Rip was cast with."
tick = { interval = 2, effects = [{ type = "damage", school = "physical", periodic = true, tag = "Rip", amount = "(interp(stacks, 1,r.c1, 2,r.c2, 3,r.c3, 4,r.c4, 5,r.c5) + opt.druid_rip_ap * stacks * ap) / 6 * (1 + 0.01 * t.genesis)" }] }
[auras.pounce_bleed]
name = "Pounce Bleed"
debuff = true
duration = 18
tick = { interval = 3, effects = [{ type = "damage", school = "physical", periodic = true, tag = "Pounce", amount = "r.dot / 6 * (1 + 0.01 * t.genesis)" }] }
[auras.lacerate]
name = "Lacerate"
debuff = true
duration = 15
max_stacks = 5
tick = { interval = 3, effects = [{ type = "damage", school = "physical", periodic = true, tag = "Lacerate", amount = "(r.total + opt.druid_lacerate_ap * ap) / 5 * stacks * (1 + 0.01 * t.genesis)" }] }
# Ticks take their spell's modifiers (Improved Moonfire, Improved
# Rejuvenation, Gift of Nature, Savage Fury), so only Genesis is written here.
# Spell power coefficients are the game's, per tick.
[auras.moonfire]
name = "Moonfire"
debuff = true
duration = "r.dur + 3 * t.natures_splendor"
tick = { interval = 3, effects = [{ type = "damage", school = "arcane", periodic = true, tag = "Moonfire (dot)", amount = "r.dot / (r.dur / 3)", coef = 0.13, mult = "1 + 0.01 * t.genesis" }] }
[auras.insect_swarm]
