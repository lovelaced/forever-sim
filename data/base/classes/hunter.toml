# ------------------------------------------------------------------ pets
[pets.cat]
name = "Cat"
creature = "beast"
speed = 2.0
hp = "interp(level, 1,60, 20,520, 40,1450, 60,3100) * (1 + 0.03 * t.endurance_training)"
armor = "interp(level, 1,20, 20,450, 40,1500, 60,2700) * (1 + 0.03 * t.endurance_training)"
dmg_min = "interp(level, 1,2, 20,16, 40,32, 60,50)"
dmg_max = "interp(level, 1,4, 20,24, 40,46, 60,72)"
ap = "interp(level, 1,0, 60,120) + opt.pet_owner_ap * rap"
crit = "5 + 2 * t.ferocity"
dodge = "interp(level, 1,5, 60,10)"
mods = [
  { stat = "dmg_done", mul = "(1 + 0.03 * t.unleashed_fury) * (1 + 0.01 * t.focused_fire)" },
]
procs = [{ on = "melee_crit", chance = "0.2 * t.frenzy", effects = [{ type = "aura", aura = "pet_frenzy" }] }]
[pets.cat.rotation]
actions = [
  { cast = "growl", if = "!target.is_player && !target.boss" },
  { cast = "claw" },
]

