# ------------------------------------------------------------------ rotations
[rotations.ranged_pet]
desc = "Ranged with a cat tanking: Hunter's Mark, Serpent Sting, Aimed/Arcane/Hawk on cooldown, Mend Pet when it is low"
auto_melee = false
auto_ranged = true
precombat = ["aspect_of_the_hawk", "call_pet"]
opener = ["hunters_mark"]
actions = [
  { cast = "mend_pet", if = "pet.active && pet.hp_pct < 0.4 && !pet.aura.mend_pet.up" },
  { cast = "deterrence", if = "hp_pct < 0.35" },
  { cast = "intimidation", if = "target.is_player" },
  { cast = "bestial_wrath" },
  { cast = "rapid_fire" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "scatter_shot", if = "target.is_player" },
  { cast = "serpent_sting", if = "target.hp_pct > 0.3" },
  { cast = "summon_hawk", if = "aura.hawk.stacks < 2" },
  { cast = "sniper_shot" },
  { cast = "aimed_shot" },
  { cast = "multi_shot", if = "enemies >= 2 || !known.aimed_shot" },
  { cast = "arcane_shot", if = "mana_pct > 0.3" },
  { cast = "aspect_of_the_hawk" },
]
rest = [
  { cast = "call_pet", if = "!pet.active" },
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
]
eat_below = 0.55
drink_below = 0.4

[rotations.survival_melee]
desc = "Survival melee with a cat: Raptor Strike, Mongoose Bite, Counterattack, Strider Kick, Lacerate and Serpent Sting"
auto_melee = true
auto_ranged = false
precombat = ["aspect_of_the_monkey", "call_pet"]
opener = ["hunters_mark"]
actions = [
  { cast = "mend_pet", if = "pet.active && pet.hp_pct < 0.4 && !pet.aura.mend_pet.up" },
  { cast = "deterrence", if = "hp_pct < 0.35" },
  { cast = "intimidation", if = "target.is_player" },
  { cast = "bestial_wrath" },
  { cast = "rapid_fire" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "counterattack" },
  { cast = "mongoose_bite" },
  { cast = "raptor_strike" },
  { cast = "strider_kick" },
  { cast = "wing_clip" },
  { cast = "lacerate", if = "target.hp_pct > 0.3" },
  { cast = "serpent_sting", if = "target.hp_pct > 0.3" },
  { cast = "summon_hawk", if = "aura.hawk.stacks < 2" },
  { cast = "aspect_of_the_monkey" },
]
rest = [
  { cast = "call_pet", if = "!pet.active" },
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
]
eat_below = 0.55
drink_below = 0.4
