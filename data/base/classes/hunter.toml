# ------------------------------------------------------------------ pets
# Base health, armor, damage, attack power and dodge are estimates
# modeled on the original game's level-60 cat; Forever's data has no pet
# stat table. Pets also get a share of the hunter's Stamina and ranged
# attack power (opt.pet_owner_sta, opt.pet_owner_ap), 10 health per Stamina.
[pets.cat]
name = "Cat"
creature = "beast"
speed = 2.0
hp = "interp(level, 1,60, 20,520, 40,1450, 60,3100) + 10 * opt.pet_owner_sta * sta"
armor = "interp(level, 1,20, 20,450, 40,1500, 60,2700)"
dmg_min = "interp(level, 1,2, 20,16, 40,32, 60,50)"
dmg_max = "interp(level, 1,4, 20,24, 40,46, 60,72)"
ap = "interp(level, 1,0, 60,120) + opt.pet_owner_ap * rap"
# Crit: Forever's pets inherit the hunter's crit (Hunter Pet Scaling, 415429,
# effect 13; the Oct 15 notes: pets "were only ever inheriting the player's
# Melee Critical Strike chance"), taken when the pet is summoned. The pet's
# own base crit is dropped (it was an estimate of 5%); whether Forever adds
# one on top is a judgment call.
crit = "melee_crit + 2 * t.ferocity"
dodge = "interp(level, 1,5, 60,10) + (t.improved_aspect_of_the_monkey > 0 && aura.aspect_of_the_monkey.up ? 0.5 * (8 + 2 * t.improved_aspect_of_the_monkey) : 0)"
mods = [
  { stat = "dmg_done", mul = "(1 + 0.03 * t.unleashed_fury) * (1 + 0.01 * t.focused_fire)" },
  { stat = "max_hp_mult", mul = "1 + 0.03 * t.endurance_training" },
  { stat = "armor_mult", mul = "1 + 0.03 * t.endurance_training" },
]
procs = [{ on = "melee_crit", chance = "0.2 * t.frenzy", effects = [{ type = "aura", aura = "pet_frenzy" }] }]
[pets.cat.rotation]
actions = [
  { cast = "growl", if = "!target.is_player && !target.boss" },
  { cast = "claw" },
]

