points = 15
ranks = 5
requires = "careful_aim"
text = "Ranged crit damage bonus +30%, Auto Shot included, Sniper Shot not (the sim gives it to melee crits too)."
# Spell 19485 covers Auto Shot and every shot except Sniper Shot (its family
# flag, word 3 bit 8388608, is missing from the 70338 list). The engine has
# one crit bonus for all physical attacks, so melee crits get it as well, and
# Sniper Shot takes it back off.
mods = [{ stat = "crit_bonus_melee", add = "0.06 * rank" }]
spell_mods = [{ spells = ["sniper_shot"], prop = "crit_bonus", add = "-0.06 * rank" }]
# Improved Serpent Sting (node 105003, spell 19464) is left out: the client
# keeps the node but places it far off the Marksmanship tree (y 39300; the
# tree ends at 5730), and its points don't count toward the 20 and 25 point
# rows (TraitNodeGroup 12720 and 12721 leave it out). The same in 70425, so
# players can't take it.
[talents.rapid_recuperation]
icon = "ability_hunter_rapidregeneration"
tree = "Marksmanship"
points = 20
ranks = 2
requires = "rapid_killing"
text = "Serpent Sting gives 50% mana regeneration while casting for 15 sec; using up Rapid Killing gives 100%."
# Trait data: 25/50% from Serpent Sting, 50/100% from the shot that uses up
# Rapid Killing (one buff, #1242512: the newer one replaces the other). A
# Rapid Killing with its full 20 sec left was earned by this very shot's
# kill, so the shot doesn't use it up.
procs = [
  { on = "cast:serpent_sting", effects = [{ type = "aura", aura = "rapid_recuperation" }] },
  { on = "cast", if = "aura.rapid_killing.up && aura.rapid_killing.remains < 19.99 && (spell.arcane_shot || spell.aimed_shot || spell.multi_shot || spell.sniper_shot || spell.scatter_shot)", effects = [{ type = "aura", aura = "rapid_recuperation_kill" }] },
]
