# ------------------------------------------------------------------ rotations
[rotations.ranged_pet]
desc = "Ranged with a cat tanking: Hunter's Mark, Serpent Sting, Aimed/Arcane/Hawk on cooldown, Mend Pet when it is low"
auto_melee = false
auto_ranged = true
precombat = ["aspect_of_the_hawk", "trueshot_aura", "call_pet"]
opener = ["hunters_mark"]
actions = [
  { cast = "mend_pet", if = "pet.active && pet.hp_pct < 0.4 && !pet.aura.mend_pet.up" },
  { cast = "deterrence", if = "hp_pct < 0.35" },
  { cast = "intimidation", target = "enemy", if = "target.is_player" },
  { cast = "bestial_wrath" },
  { cast = "rapid_fire" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "scatter_shot", if = "target.is_player" },
  { cast = "serpent_sting", if = "target.hp_pct > 0.3" },
  { cast = "summon_hawk", if = "aura.hawk.stacks < 2" },
  { cast = "sniper_shot" },
  { cast = "multi_shot", if = "enemies >= 2 || !known.aimed_shot" },
  { cast = "aimed_shot" },
  { cast = "arcane_shot", if = "mana_pct > 0.3" },
  { cast = "aspect_of_the_hawk" },
]
rest = [
  { cast = "revive_pet" },
  { cast = "call_pet", if = "!pet.active" },
  { cast = "trueshot_aura" },
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
]
eat_below = 0.55
drink_below = 0.4

[rotations.survival_melee]
desc = "Survival melee with a cat: Raptor Strike, Mongoose Bite, Counterattack, Strider Kick, Lacerate and Serpent Sting"
auto_melee = true
auto_ranged = false
precombat = ["aspect_of_the_monkey", "call_pet"]
opener = ["hunters_mark"]
actions = [
  { cast = "mend_pet", if = "pet.active && pet.hp_pct < 0.4 && !pet.aura.mend_pet.up" },
  { cast = "deterrence", if = "hp_pct < 0.35" },
  { cast = "intimidation", target = "enemy", if = "target.is_player" },
  { cast = "bestial_wrath" },
  { cast = "rapid_fire" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "counterattack" },
  { cast = "mongoose_bite" },
  { cast = "raptor_strike" },
  { cast = "strider_kick" },
  { cast = "wing_clip" },
  { cast = "lacerate", if = "target.hp_pct > 0.3" },
  { cast = "serpent_sting", if = "target.hp_pct > 0.3" },
  { cast = "summon_hawk", if = "aura.hawk.stacks < 2" },
  { cast = "aspect_of_the_monkey" },
]
rest = [
  { cast = "revive_pet" },
  { cast = "call_pet", if = "!pet.active" },
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
]
eat_below = 0.55
drink_below = 0.4

# The three standard specs (builds/hunter/beast_mastery.toml, marksmanship.toml,
# survival.toml). ranged_pet and survival_melee above stay as they are for the
# experimental builds; the patch file restates their action lists.
# Aimed Shot and Multi-Shot share a 6 sec cooldown, so Multi-Shot has to come
# first on packs or it is never cast once Aimed Shot is known (in ranged_pet it
# never is after level 20). The guides: "Multi-Shot replaces Aimed Shot on
# groups" (wow.gg), Aimed Shot single target (Method, wowtbc.gg).
[rotations.beast_mastery]
desc = "Beast Mastery with a cat tanking: Hunter's Mark, Serpent Sting, Bestial Wrath and Rapid Fire on cooldown, two hawks on bosses and players, Aimed Shot (Multi-Shot on two or more), Arcane Shot with spare mana"
auto_melee = false
auto_ranged = true
precombat = ["aspect_of_the_hawk", "trueshot_aura", "call_pet"]
opener = ["hunters_mark"]
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.25 && (target.boss || target.is_player)" },
  { cast = "mend_pet", if = "pet.active && pet.hp_pct < 0.4 && !pet.aura.mend_pet.up" },
  { cast = "intimidation", target = "enemy", if = "target.is_player" },
  { cast = "bestial_wrath" },
  { cast = "rapid_fire" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "serpent_sting", if = "target.hp_pct > 0.3 || target.boss" },
  { cast = "summon_hawk", if = "target.aura.hawk.stacks < 2 && (target.boss || target.is_player)" },
  { cast = "multi_shot", if = "enemies >= 2" },
  { cast = "aimed_shot" },
  { cast = "multi_shot" },
  { cast = "arcane_shot", if = "mana_pct > 0.3" },
  { cast = "aspect_of_the_hawk" },
]
rest = [
  { cast = "revive_pet" },
  { cast = "call_pet", if = "!pet.active" },
  { cast = "trueshot_aura" },
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
]
eat_below = 0.55
drink_below = 0.4

