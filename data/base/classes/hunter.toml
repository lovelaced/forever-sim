# Survival in melee as the guides play it: Aspect of the Beast (melee Attack
# Power in Forever, learned at 30; Aspect of the Monkey before that), Hunter's
# Mark for Expose Prey, Serpent Sting to open, then Raptor Strike, Strider
# Kick, Mongoose Bite and Counterattack as they come up (wowtbc.gg, wow.gg,
# classicwowforever.com). Traps are not simulated.
[rotations.survival]
desc = "Survival in melee with a cat: Aspect of the Beast (Monkey before 30), Hunter's Mark, Serpent Sting, Mongoose Bite, Counterattack, Raptor Strike and Strider Kick on cooldown, Lacerate on longer fights, War Stomp on players and double pulls"
auto_melee = true
auto_ranged = false
precombat = ["call_pet", "aspect_of_the_beast", { cast = "aspect_of_the_monkey", if = "!known.aspect_of_the_beast" }]
opener = ["hunters_mark"]
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.25 && (target.boss || target.is_player)" },
  { cast = "mend_pet", if = "pet.active && pet.hp_pct < 0.4 && !pet.aura.mend_pet.up" },
  { cast = "deterrence", if = "hp_pct < 0.35" },
  { cast = "war_stomp", if = "target.is_player || enemies >= 2" },
  { cast = "intimidation", target = "enemy", if = "target.is_player" },
  { cast = "rapid_fire" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "elunes_light" },
  { cast = "serpent_sting", if = "target.hp_pct > 0.5 || target.boss" },
  { cast = "mongoose_bite" },
  { cast = "counterattack" },
  { cast = "raptor_strike" },
  { cast = "strider_kick" },
  { cast = "wing_clip" },
  { cast = "lacerate", if = "target.hp_pct > 0.3 || target.boss" },
  { cast = "aspect_of_the_beast" },
  { cast = "aspect_of_the_monkey", if = "!known.aspect_of_the_beast" },
]
rest = [
  { cast = "revive_pet" },
  { cast = "call_pet", if = "!pet.active" },
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
]
eat_below = 0.55
drink_below = 0.4
