# Hunter. Talents and spell ranks: Forever client 1.60.1.70338
# (wowforevertalents.com/hunter and /abilities/hunter, checked 2026-10-15).
# Talent rows, ranks and prerequisites match the client's talent (trait)
# tables, which `fsim audit hunter` checks. Base stats and stat formulas are
# Classic 1.12 values.
#
# Spell numbers come from Forever's spell tables, build 1.60.1.70338
# (data/reference/spellbook.json); every rank carries the game's spell `id`
# and `fsim audit hunter` checks them. Deliberate differences are listed with
# a reason in data/reference/accepted/hunter.toml.
# Forever keeps one spell per talent; the per-rank numbers come from the
# talent's trait data (spellbook.json "talents"), which the talent tooltip
# uses. Several of those spells still hold Classic's full-rank number
# (Unleashed Fury, Ferocity, Bestial Discipline, Barrage, Savage Strikes,
# Lightning Reflexes, Survival Tactics, Frenzy); the sim follows the trait
# data and says so next to the talent.
name = "Hunter"
icon = "classicon_hunter"
resources = ["mana"]
can_parry = true
can_dual_wield = true
source = "forever-70338"

base = [
  { level = 1, str = 20, agi = 23, sta = 21, int = 20, spi = 21, hp = 46, mana = 65 },
  { level = 40, str = 42, agi = 86, sta = 62, int = 45, spi = 49, hp = 877, mana = 1000 },
  { level = 60, str = 57, agi = 120, sta = 86, int = 61, spi = 66, hp = 1467, mana = 1720 },
]

[formulas]
ap = "str + agi + level * 2 - 20"
rap = "agi * 2 + level * 2 - 10"
melee_crit = "agi / interp(level, 1,7, 40,33, 60,53)"
ranged_crit = "agi / interp(level, 1,7, 40,33, 60,53)"
spell_crit = "int / 60"
dodge = "agi / interp(level, 1,3.5, 40,16.5, 60,26.5)"
parry = "5"
mana_regen = "15 + spi / 5"
hp_regen = "spi * 0.5 + 2"

# ------------------------------------------------------------------ talents
[talents.deadly_aspects]
icon = "spell_nature_ravenform"
tree = "Beast Mastery"
points = 0
ranks = 5
text = "With Aspect of the Hawk, ranged attacks have a 10% chance to give +30% ranged attack speed for 12 sec. With Aspect of the Beast, melee auto attacks have a 10% chance to give +30% melee attack speed for 12 sec."
