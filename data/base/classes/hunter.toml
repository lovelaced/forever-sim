# and Aspect of the Beast (melee auto attacks).
procs = [
  { on = "ranged_landed", if = "aura.aspect_of_the_hawk.up", chance = "0.02 * rank", effects = [{ type = "aura", aura = "quick_shots" }] },
  { on = "melee_landed", if = "!event.special && aura.aspect_of_the_beast.up", chance = "0.02 * rank", effects = [{ type = "aura", aura = "quick_strikes" }] },
]
