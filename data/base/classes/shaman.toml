# ------------------------------------------------------------------ rotations
[rotations.enhancement]
desc = "Enhancement two-hander: Windfury Weapon, Stormstrike, shocks, instant Lightning Bolt at five Maelstrom stacks, totems; Lesser Healing Wave when hurt"
precombat = ["lightning_shield", "windfury_weapon", { cast = "rockbiter_weapon", if = "!known.windfury_weapon" }, "strength_of_earth_totem", "grace_of_air_totem"]
opener = []
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "natures_swiftness", if = "hp_pct < 0.3" },
  { cast = "healing_wave", if = "hp_pct < 0.3 && aura.natures_swiftness.up" },
  { cast = "lightning_bolt", if = "aura.maelstrom_weapon.stacks >= 5 && hp_pct >= 0.4" },
  { cast = "lesser_healing_wave", if = "hp_pct < 0.4" },
  { cast = "healing_wave", if = "hp_pct < 0.4 && !known.lesser_healing_wave" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "rage_of_the_farseer" },
  { cast = "stormstrike" },
  { cast = "flame_shock", if = "!target.aura.flame_shock.up && target.hp_pct > 0.4" },
  { cast = "earth_shock" },
  { cast = "searing_totem", if = "target.hp_pct > 0.4 || target.boss" },
  { cast = "fire_nova", if = "enemies >= 2" },
  { cast = "lightning_shield" },
  { cast = "strength_of_earth_totem", if = "target.boss || target.hp_pct > 0.5" },
  { cast = "grace_of_air_totem", if = "target.boss || target.hp_pct > 0.5" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "healing_wave", if = "hp_pct < 0.6 && mana_pct > 0.5" },
  { cast = "lightning_shield" },
  { cast = "windfury_weapon" },
  { cast = "rockbiter_weapon", if = "!known.windfury_weapon" },
]
eat_below = 0.5
drink_below = 0.35

[rotations.elemental]
desc = "Elemental: Flame Shock, Lava Burst, Earth Shock, Chain Lightning, Lightning Bolt, Searing Totem; heals when hurt"
auto_melee = false
precombat = ["lightning_shield", "flametongue_weapon", { cast = "rockbiter_weapon", if = "!known.flametongue_weapon" }, "mana_spring_totem"]
opener = []
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.25 && (target.boss || target.is_player)" },
  { cast = "natures_swiftness", if = "hp_pct < 0.3" },
  { cast = "healing_wave", if = "hp_pct < 0.3 && aura.natures_swiftness.up" },
  { cast = "lesser_healing_wave", if = "hp_pct < 0.35" },
  { cast = "healing_wave", if = "hp_pct < 0.35 && !known.lesser_healing_wave" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "flame_shock", if = "!target.aura.flame_shock.up && (target.hp_pct > 0.35 || target.boss)" },
  { cast = "lava_burst" },
  { cast = "earth_shock", if = "target.hp_pct < 0.35 || !known.flame_shock" },
  { cast = "chain_lightning" },
  { cast = "searing_totem", if = "target.hp_pct > 0.4 || target.boss" },
  { cast = "fire_nova", if = "enemies >= 2" },
  { cast = "lightning_bolt" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "healing_wave", if = "hp_pct < 0.6 && mana_pct > 0.5" },
  { cast = "lightning_shield" },
]
eat_below = 0.5
drink_below = 0.4

[rotations.stormwarden]
desc = "Stormwarden: one-hander and shield, Water Shield (Lightning Shield before it), Flametongue, Stormstrike, shocks, Maelstrom Lightning Bolts or heals"
precombat = ["water_shield", "lightning_shield", "flametongue_weapon", { cast = "rockbiter_weapon", if = "!known.flametongue_weapon" }, "strength_of_earth_totem"]
opener = []
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "natures_swiftness", if = "hp_pct < 0.3" },
  { cast = "healing_wave", if = "hp_pct < 0.3 && aura.natures_swiftness.up" },
  { cast = "riptide", if = "hp_pct < 0.6" },
  { cast = "lesser_healing_wave", if = "hp_pct < 0.4" },
  { cast = "healing_wave", if = "hp_pct < 0.4 && !known.lesser_healing_wave" },
  { cast = "lightning_bolt", if = "aura.maelstrom_weapon.stacks >= 5" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "rage_of_the_farseer" },
  { cast = "stormstrike" },
  { cast = "flame_shock", if = "!target.aura.flame_shock.up && target.hp_pct > 0.4" },
  { cast = "earth_shock" },
  { cast = "searing_totem", if = "target.hp_pct > 0.4 || target.boss" },
  { cast = "fire_nova", if = "enemies >= 2" },
  { cast = "water_shield" },
  { cast = "lightning_shield" },
  { cast = "strength_of_earth_totem", if = "target.boss || target.hp_pct > 0.5" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "healing_wave", if = "hp_pct < 0.6 && mana_pct > 0.5" },
  { cast = "water_shield" },
  { cast = "lightning_shield" },
  { cast = "flametongue_weapon" },
]
eat_below = 0.45
