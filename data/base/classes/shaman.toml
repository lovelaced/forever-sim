procs = [{ on = "melee_swing", icd = 0.5, effects = [{ type = "consume" }] }]
[auras.elemental_devastation]
name = "Elemental Devastation"
duration = 10
mods = [{ stat = "melee_crit", add = "3 * t.elemental_devastation" }]
[auras.clearcasting]
name = "Clearcasting"
react = true
duration = 15
consume_on_cast = true
spell_mods = [{ spells = ["lightning_bolt", "chain_lightning", "earth_shock", "flame_shock", "frost_shock", "lava_burst", "fire_nova"], prop = "cost", mul = 0 }]
[auras.rage_of_the_farseer]
name = "Rage of the Farseer"
duration = 25
mods = [{ stat = "melee_haste", mul = 1.3 }]
[auras.natures_swiftness]
name = "Nature's Swiftness"
dispel = "magic"
consume_on_cast = true
spell_mods = [{ spells = ["healing_wave", "lesser_healing_wave", "chain_heal", "lightning_bolt", "chain_lightning"], prop = "cast_time", mul = 0 }]
[auras.ancestral_fortitude]
name = "Ancestral Fortitude"
duration = 15
# Ancestral Healing: +8/17/25% armor
mods = [{ stat = "armor_mult", mul = "1 + (t.ancestral_healing == 1 ? 0.08 : t.ancestral_healing == 2 ? 0.17 : t.ancestral_healing == 3 ? 0.25 : 0)" }]
[auras.riptide]
name = "Riptide"
dispel = "magic"
duration = 15
# 5 ticks of the rank's periodic base, coefficient 0.1 per tick (game data)
tick = { interval = 3, effects = [{ type = "heal", target = "target", amount = "r.hot / 5", coef = 0.1, periodic = true, tag = "Riptide" }] }

