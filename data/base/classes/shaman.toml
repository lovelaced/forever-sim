[rotations.restoration]
# A leveling Restoration shaman on its own (the healing test comes later): a
# one-hander and shield with Rockbiter Weapon (Method: better than Flametongue
# for a one-hander and shield; it also beats Windfury Weapon on a 2.6 sec mace
# here), a Lightning Bolt pull, Flame Shock, Earth Shock while mana allows,
# Searing Totem and melee. Water Shield from level 20 (Lightning Shield before
# it), Riptide and Healing Waves to stay up, Mana Tide Totem when mana runs low.
desc = "Restoration leveling: one-hander and shield, Water Shield (Lightning Shield before it), Rockbiter Weapon, a Lightning Bolt pull, Flame Shock, Earth Shock, Searing Totem and melee; Riptide and heals when hurt"
precombat = ["water_shield", "lightning_shield", "rockbiter_weapon", "strength_of_earth_totem", "mana_spring_totem", { cast = "healing_stream_totem", if = "!known.mana_spring_totem" }]
opener = []
actions = [
  { cast = "healing_potion", if = "opt.potions && (hp_pct < 0.2)" },
  { cast = "natures_swiftness", if = "hp_pct < 0.35" },
  { cast = "healing_wave", if = "hp_pct < 0.35 && aura.natures_swiftness.up" },
  { cast = "stoneform", if = "hp_pct < 0.5" },
  { cast = "riptide", if = "hp_pct < 0.65" },
  { cast = "lesser_healing_wave", if = "(hp_pct < 0.45) && !(!target.is_player && target.hp_pct < 0.25 && hp_pct > (enemies < 2 ? 0.2 : 0.35))" },
  { cast = "healing_wave", if = "(hp_pct < 0.45 && !known.lesser_healing_wave) && !(!target.is_player && target.hp_pct < 0.25 && hp_pct > (enemies < 2 ? 0.2 : 0.35))" },
  { cast = "mana_tide_totem", if = "mana_pct < 0.3" },
  # the pull: one Lightning Bolt at a fresh target (not at an enemy player who has opened on you)
  { cast = "lightning_bolt", if = "target.hp_pct >= 0.99 && !target.is_player" },
  { cast = "earth_shock", if = "target.casting" },   # cut a cast short
  { cast = "purge", if = "target.is_player && target.magic_buffs > 0" },   # strip a player's shield or buff
  { cast = "war_stomp", if = "enemies_within_8 >= 2 && hp_pct < 0.4" },   # panic (Tauren)
  { cast = "frost_shock", if = "target.fleeing && !target.slowed" },   # stop a runner
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "flame_shock", if = "!target.aura.flame_shock.up && (target.hp_pct > 0.4 || target.boss)" },
  # no Convection or Shamanistic Focus: Earth Shock only with mana to spare
  { cast = "earth_shock", if = "mana_pct > 0.5" },
  { cast = "searing_totem", if = "(target.hp_pct > 0.4 || target.boss) && target.dist < 8" },   # in melee, so Fire Nova reaches
  { cast = "fire_nova", if = "enemies >= 2" },
  { cast = "water_shield" },
  { cast = "lightning_shield" },
  { cast = "strength_of_earth_totem", if = "target.boss || (target.hp_pct > 0.5 && mana_pct > 0.4)" },   # not when mana runs low
  { cast = "mana_spring_totem", if = "target.boss || target.hp_pct > 0.5" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "healing_wave", if = "hp_pct < 0.7 && mana_pct > 0.4" },
  { cast = "water_shield" },
  { cast = "lightning_shield" },
  { cast = "rockbiter_weapon" },
]
eat_below = 0.4
