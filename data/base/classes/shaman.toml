# ------------------------------------------------------------------ auras
# Weapon imbues. Forever's imbue spells last 1800 sec (30 min); the sim keeps
# them up for the whole session.
[auras.frost_shock]
name = "Frost Shock"
debuff = true
per_source = false
mechanic = "slow"
duration = 8
slow = 0.5
[auras.rockbiter_weapon]
name = "Rockbiter Weapon"
group = "imbue_mh"
# Elemental Weapons: +7/13/20%
mods = [{ stat = "ap", add = "r.ap * (1 + (t.elemental_weapons == 1 ? 0.07 : t.elemental_weapons == 2 ? 0.13 : t.elemental_weapons == 3 ? 0.2 : 0))" }]
[auras.flametongue_weapon]
name = "Flametongue Weapon"
group = "imbue_mh"
# damage per hit = the proc spell's value x weapon speed / 100 (rank 6 at 56:
# 2498, so 35 to 112 for 1.4 to 4.5 speed, as the tooltip says); coefficient
# 0.1 from Flametongue Attack (10444)
procs = [{ on = "melee_landed", if = "event.mh", effects = [{ type = "damage", school = "fire", target = "target", hit = "auto", no_proc = true, tag = "Flametongue", amount = "r.ft * mh.speed / 100", coef = 0.1, mult = "1 + 0.05 * t.elemental_weapons" }] }]
[auras.windfury_weapon]
name = "Windfury Weapon"
group = "imbue_mh"
# 1.5 sec between procs: Forever's Windfury Weapon proc (439431); Elemental
# Weapons raises the extra attacks' attack power by 13/27/40%
procs = [{ on = "melee_landed", if = "event.mh && !event.extra", chance = "opt.windfury_chance", icd = 1.5, effects = [{ type = "extra_attack", hand = "mh", count = 2, ap_bonus = "r.ap * (1 + (t.elemental_weapons == 1 ? 0.13 : t.elemental_weapons == 2 ? 0.27 : t.elemental_weapons == 3 ? 0.4 : 0))" }] }]
[auras.lightning_shield]
name = "Lightning Shield"
dispel = "magic"
group = "elemental_shield"
duration = 600
charges = 3
# one orb every 3.5 sec at most (the shield's proc cooldown in the spell data)
procs = [{ on = "struck_melee", icd = 3.5, effects = [{ type = "cast", spell = "lightning_shield_orb", target = "target" }, { type = "consume" }] }]
[auras.water_shield]
name = "Water Shield"
dispel = "magic"
group = "elemental_shield"
duration = 600
charges = 3
# Hits you take and your healing crits share the globe cooldown (opt.water_shield_icd).
procs = [
  { on = "struck", if = "!aura.water_shield_globe.up", effects = [{ type = "resource", res = "mana", amount = "0.02 * max_mana" }, { type = "aura", aura = "water_shield_globe" }, { type = "consume" }] },
  { on = "heal_crit", if = "!aura.water_shield_globe.up", effects = [{ type = "resource", res = "mana", amount = "0.02 * max_mana" }, { type = "aura", aura = "water_shield_globe" }, { type = "consume" }] },
]
[auras.water_shield_globe]
name = "Water Shield (globe cooldown)"
hidden = true
duration = "opt.water_shield_icd"

# Totems: units on the ground, one per element; a new one replaces the old.
# A pulsing totem works from where it stands (Searing Totem on your target
# within 20 yd, Magma Totem on everything within 8, the water totems while
# you're within 30); a buff totem gives its buff to the party within 30 yd
# (the Flametongue Totem buff's radius in the game's data) for as long as it
# stands. Durations, costs and values are the game's.
[auras.searing_totem]
name = "Searing Totem"
group = "fire_totem"
duration = "r.dur"
totem = { element = "fire", radius = 20, reach = "target" }
tick = { interval = "opt.shaman_searing_interval", effects = [{ type = "cast", spell = "searing_totem_attack", target = "my_target" }] }
[auras.magma_totem]
name = "Magma Totem"
group = "fire_totem"
duration = 20
totem = { element = "fire", radius = 8, reach = "area" }
tick = { interval = "opt.shaman_magma_interval", effects = [{ type = "cast", spell = "magma_totem_pulse", target = "my_target" }] }
[auras.flametongue_totem]
name = "Flametongue Totem"
group = "fire_totem"
duration = 300
totem = { element = "fire", radius = 30, buff = true }
# Forever: a party buff, not a weapon enchant. Damage per hit = the proc
# spell's value x weapon speed / 100, like Flametongue Weapon; no spell power
# coefficient (Flametongue Attack 16368 lists none).
procs = [{ on = "melee_landed", if = "event.mh && (opt.shaman_totem_imbue_stack > 0 || !aura.flametongue_weapon.up)", effects = [{ type = "damage", school = "fire", target = "target", hit = "auto", no_proc = true, tag = "Flametongue Totem", amount = "r.ft * mh.speed / 100" }] }]
[auras.strength_of_earth_totem]
name = "Strength of Earth Totem"
group = "earth_totem"
duration = 300
totem = { element = "earth", radius = 30, buff = true }
mods = [{ stat = "str", add = "r.str" }]
[auras.stoneskin_totem]
name = "Stoneskin Totem"
group = "earth_totem"
duration = 300
totem = { element = "earth", radius = 30, buff = true }
text = "Reduces each melee hit you take by the rank's amount (not simulated: the engine has no flat per-hit reduction yet)."
[auras.earthbind_totem]
name = "Earthbind Totem"
group = "earth_totem"
duration = 45
totem = { element = "earth", radius = 10, reach = "area" }
# Earthbind (3600) every 3 sec: 50% slower for 5 sec within 10 yd; Earthbound
# roots them for 5 sec when it goes down
on_apply = [{ type = "if", cond = "t.earthbound > 0", then = [{ type = "aura", aura = "root", target = "enemies", duration = 5 }] }]
tick = { interval = 3, effects = [{ type = "aura", aura = "earthbind", target = "enemies" }] }
[auras.earthbind]
name = "Earthbind"
debuff = true
per_source = false
mechanic = "slow"
duration = 5
slow = 0.5
[auras.stoneclaw_totem]
name = "Stoneclaw Totem"
group = "earth_totem"
duration = 15
totem = { element = "earth", radius = 8, reach = "area", health = "r.hp * (1 + 0.25 * t.earths_grasp)" }
# taunts enemies within 8 yd to attack it (every 2 sec: an estimate)
on_apply = [{ type = "taunt", target = "enemies", duration = 2 }]
tick = { interval = 2, effects = [{ type = "taunt", target = "enemies", duration = 2 }] }
[auras.tremor_totem]
name = "Tremor Totem"
group = "earth_totem"
duration = 300
totem = { element = "earth", radius = 30, reach = "owner" }
# every 4 sec (Tremor Totem Passive, 8145): fear off the party within 30 yd;
# charm and sleep are not modelled
tick = { interval = 4, effects = [{ type = "dispel", mechanics = ["fear"], target = "party" }] }
[auras.grace_of_air_totem]
name = "Grace of Air Totem"
group = "air_totem"
duration = 300
totem = { element = "air", radius = 30, buff = true }
mods = [{ stat = "agi", add = "r.agi" }]
[auras.windfury_totem]
name = "Windfury Totem"
group = "air_totem"
duration = 300
totem = { element = "air", radius = 30, buff = true }
# Forever: a party buff. One extra attack with the rank's attack power (8516).
procs = [{ on = "melee_landed", if = "event.mh && !event.extra && (opt.shaman_totem_imbue_stack > 0 || !aura.windfury_weapon.up)", chance = "opt.shaman_windfury_totem_chance", effects = [{ type = "extra_attack", hand = "mh", count = 1, ap_bonus = "r.ap" }] }]
[auras.grounding_totem]
name = "Grounding Totem"
group = "air_totem"
duration = 45
totem = { element = "air", radius = 30, reach = "area" }
text = "Draws in one harmful spell every 10 sec (not simulated: spells aren't redirected here, so it only takes the air slot)."
[auras.mana_spring_totem]
name = "Mana Spring Totem"
group = "water_totem"
duration = 300
totem = { element = "water", radius = 30, reach = "owner" }
tick = { interval = 2, effects = [{ type = "resource", res = "mana", amount = "r.regen * (1 + 0.05 * t.restorative_totems)" }] }
[auras.healing_stream_totem]
name = "Healing Stream Totem"
group = "water_totem"
duration = 300
totem = { element = "water", radius = 30, reach = "owner" }
tick = { interval = 2, effects = [{ type = "heal", target = "party", amount = "r.heal", coef = 0.022, mult = "1 + 0.1 * t.restorative_totems", periodic = true, tag = "Healing Stream Totem" }] }
[auras.mana_tide_totem]
name = "Mana Tide Totem"
group = "water_totem"
duration = 13
totem = { element = "water", radius = 30, reach = "owner" }
tick = { interval = 3, effects = [{ type = "resource", res = "mana", amount = "r.regen" }] }

[auras.flame_shock]
name = "Flame Shock"
debuff = true
duration = 12
# 4 ticks of the rank's periodic base, coefficient 0.1 per tick (game data).
# Call of Flame reaches the burn through Flame Shock's spell modifiers.
tick = { interval = 3, effects = [{ type = "damage", school = "fire", periodic = true, tag = "Flame Shock (burn)", amount = "r.dot / 4", coef = 0.1 }] }
[auras.stormstrike]
name = "Stormstrike"
duration = 12
consume_on_cast = true
spell_mods = [{ spells = ["lightning_bolt", "chain_lightning", "earth_shock"], prop = "damage", mul = 1.2 }]
[auras.stormstrike_regen]
name = "Stormstrike (regeneration)"
duration = 15
mods = [{ stat = "casting_regen", add = 0.5 }]
[auras.maelstrom_weapon]
