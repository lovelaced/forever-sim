# Shaman. Talents: Forever client 1.60.1.70338 (wowforevertalents.com/shaman,
# checked 2026-10-15). Spell ranks, costs, cooldowns, durations, coefficients,
# proc chances and internal cooldowns: Forever's own spell data, build
# 1.60.1.70338 (data/reference/spellbook.json; `fsim audit shaman` checks every
# rank, and data/reference/accepted/shaman.toml lists the deliberate
# differences). Every rank carries the game's spell `id`.
# Totems are units on the ground (5 health, Stoneclaw more): one per element,
# put down where you stand. Base stats Classic 1.12.
name = "Shaman"
icon = "classicon_shaman"
resources = ["mana"]
can_block = true
source = "forever-70338"

base = [
  { level = 1, str = 22, agi = 20, sta = 22, int = 21, spi = 22, hp = 40, mana = 55 },
  { level = 40, str = 61, agi = 39, sta = 68, int = 62, spi = 70, hp = 820, mana = 900 },
  { level = 60, str = 85, agi = 52, sta = 95, int = 85, spi = 97, hp = 1423, mana = 1520 },
]

[formulas]
ap = "str * 2 + level * 2 - 20"
rap = "agi - 10"
melee_crit = "agi / interp(level, 1,4, 40,14, 60,20)"
ranged_crit = "agi / interp(level, 1,4, 40,14, 60,20)"
spell_crit = "2.2 + int / interp(level, 1,10, 40,40, 60,59.5)"
dodge = "1.7 + agi / interp(level, 1,4, 40,14, 60,20)"
parry = "0"
block = "5"
mana_regen = "15 + spi / 5"
hp_regen = "spi * 0.2 + 3"

# ------------------------------------------------------------------ talents
# Tree layout, prerequisites and per-rank values: Forever's talent trait data
# (the "talents" section of data/reference/spellbook.json), which is what the
# game's talent window uses and agrees with the tooltips. Forever ships one
# spell per talent whose base points hold only one rank's value (sometimes
# rank 1, sometimes the full talent); the trait data gives every rank, and
# uneven steps (3/7/10, 8/17/25, ...) are written out rank by rank.
[talents.convection]
icon = "spell_nature_wispsplode"
tree = "Elemental Combat"
points = 0
ranks = 5
text = "Shocks, Lightning Bolt, Lava Burst and Chain Lightning cost 10% less."
spell_mods = [{ spells = ["earth_shock", "flame_shock", "frost_shock", "lightning_bolt", "lava_burst", "chain_lightning"], prop = "cost", mul = "1 - 0.02 * rank" }]
[talents.concussion]
icon = "spell_nature_earthshock"
tree = "Elemental Combat"
points = 0
ranks = 5
text = "Lightning Bolt, Chain Lightning and Earth Shock deal 5% more damage."
# the overload copies carry Lightning Bolt's and Chain Lightning's spell family, so the talent reaches them too
spell_mods = [{ spells = ["lightning_bolt", "chain_lightning", "earth_shock", "lightning_bolt_overload", "chain_lightning_overload"], prop = "damage", mul = "1 + 0.01 * rank" }]
[talents.elemental_warding]
icon = "spell_nature_spiritarmor"
tree = "Elemental Combat"
points = 5
ranks = 3
# trait data 3/7/10% (the talent's spell, 28996, still holds Classic's 4%)
text = "Fire, Frost and Nature damage taken -3/7/10% (applied to all spell damage here)."
mods = [{ stat = "spell_dmg_taken", mul = "1 - (rank == 1 ? 0.03 : rank == 2 ? 0.07 : 0.1)" }]
[talents.reverberation]
icon = "spell_frost_frostward"
tree = "Elemental Combat"
points = 5
ranks = 5
text = "Shock cooldowns are 1 sec shorter."
spell_mods = [{ spells = ["earth_shock", "flame_shock", "frost_shock"], prop = "cooldown", add = "-0.2 * rank" }]
[talents.call_of_flame]
icon = "spell_fire_immolation"
tree = "Elemental Combat"
points = 5
ranks = 3
# spell 16038: Flame Shock (and its burn), the totems' fire attacks, Fire Nova and Lava Burst
text = "Fire totems, Flame Shock, Fire Nova and Lava Burst deal 15% more damage."
spell_mods = [{ spells = ["flame_shock", "fire_nova", "lava_burst", "searing_totem_attack", "magma_totem_pulse"], prop = "damage", mul = "1 + 0.05 * rank" }]
[talents.elemental_devastation]
icon = "spell_fire_elementaldevastation"
tree = "Elemental Combat"
points = 5
ranks = 3
text = "Spell critical strikes give +9% melee crit for 10 sec."
procs = [{ on = "spell_crit", if = "!event.periodic", effects = [{ type = "aura", aura = "elemental_devastation" }] }]
[talents.elemental_focus]
icon = "spell_shadow_manaburn"
tree = "Elemental Combat"
points = 10
ranks = 1
# 10% from the spell data (16164 proc chance)
text = "10% chance after a Fire, Frost or Nature damage spell that your next damage spell costs no mana."
procs = [{ on = "spell_landed", if = "!event.periodic && (spell.lightning_bolt || spell.chain_lightning || spell.earth_shock || spell.flame_shock || spell.frost_shock || spell.lava_burst || spell.fire_nova)", chance = 0.1, effects = [{ type = "aura", aura = "clearcasting" }] }]
[talents.elemental_alacrity]
icon = "spell_lightning_lightningbolt01"
tree = "Elemental Combat"
points = 10
ranks = 3
# trait data 0.17/0.33/0.5 sec (the talent's spell, 16578, holds Classic's Lightning Mastery rank 1, 0.2 sec)
text = "Lightning Bolt, Chain Lightning and Lava Burst cast 0.17/0.33/0.5 sec faster."
spell_mods = [{ spells = ["lightning_bolt", "chain_lightning", "lava_burst"], prop = "cast_time", add = "-(rank == 1 ? 0.17 : rank == 2 ? 0.33 : 0.5)" }]
[talents.improved_fire_nova]
icon = "spell_fire_sealoffire"
tree = "Elemental Combat"
points = 15
ranks = 2
# trait data 10/20% and 2/4 sec (the talent's spell, 16086, holds 20% and 2 sec)
text = "Fire Nova deals 10/20% more damage and its cooldown is 2/4 sec shorter."
spell_mods = [{ spells = ["fire_nova"], prop = "damage", mul = "1 + 0.1 * rank" }, { spells = ["fire_nova"], prop = "cooldown", add = "-2 * rank" }]
[talents.eye_of_the_storm]
