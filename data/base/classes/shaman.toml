# ------------------------------------------------------------------ auras
[auras.rockbiter_weapon]
name = "Rockbiter Weapon"
group = "imbue_mh"
mods = [{ stat = "ap", add = "r.ap * (1 + t.elemental_weapons / 15)" }]
[auras.flametongue_weapon]
name = "Flametongue Weapon"
group = "imbue_mh"
procs = [{ on = "melee_landed", if = "event.mh", effects = [{ type = "damage", school = "fire", target = "target", hit = "auto", no_proc = true, tag = "Flametongue", amount = "r.lo + (r.hi - r.lo) * clamp((mh.speed - 1.5) / 2.5, 0, 1)", coef = "0.1 * mh.speed / 3.5", mult = "1 + 0.05 * t.elemental_weapons" }] }]
[auras.windfury_weapon]
name = "Windfury Weapon"
group = "imbue_mh"
procs = [{ on = "melee_landed", if = "event.mh && !event.extra", chance = "opt.windfury_chance", effects = [{ type = "extra_attack", hand = "mh", count = 2, ap_bonus = "r.ap * (1 + 0.1333 * t.elemental_weapons)" }] }]
[auras.lightning_shield]
name = "Lightning Shield"
group = "elemental_shield"
duration = 600
charges = 3
procs = [{ on = "struck_melee", effects = [{ type = "damage", school = "nature", target = "target", hit = "auto", no_proc = true, tag = "Lightning Shield", amount = "r.dmg", coef = 0.267, mult = "1 + 0.05 * t.improved_lightning_shield" }, { type = "consume" }] }]
[auras.water_shield]
name = "Water Shield"
group = "elemental_shield"
duration = 600
charges = 3
procs = [{ on = "struck", icd = 3, effects = [{ type = "resource", res = "mana", amount = "0.02 * max_mana" }, { type = "consume" }] }]
[auras.searing_totem]
name = "Searing Totem"
group = "fire_totem"
duration = "r.dur"
tick = { interval = 2.5, effects = [{ type = "damage", school = "fire", target = "my_target", min = "r.lo", max = "r.hi", coef = 0.083, mult = "1 + 0.05 * t.call_of_flame", tag = "Searing Totem" }] }
[auras.strength_of_earth_totem]
name = "Strength of Earth Totem"
group = "earth_totem"
duration = 300
mods = [{ stat = "str", add = "r.str" }]
[auras.grace_of_air_totem]
name = "Grace of Air Totem"
group = "air_totem"
duration = 300
mods = [{ stat = "agi", add = "r.agi" }]
[auras.windfury_totem]
name = "Windfury Totem"
group = "air_totem"
duration = 300
procs = [{ on = "melee_landed", if = "event.mh && !event.extra && !aura.windfury_weapon.up", chance = 0.2, effects = [{ type = "extra_attack", hand = "mh", count = 1, ap_bonus = "r.ap" }] }]
[auras.mana_spring_totem]
name = "Mana Spring Totem"
group = "water_totem"
duration = 300
mods = [{ stat = "mp5", add = "r.mana * 2.5 * (1 + 0.05 * t.restorative_totems)" }]
[auras.mana_tide_totem]
name = "Mana Tide Totem"
group = "water_totem"
duration = 12
tick = { interval = 3, effects = [{ type = "resource", res = "mana", amount = 88 }] }
[auras.flame_shock]
name = "Flame Shock"
debuff = true
duration = 12
tick = { interval = 3, effects = [{ type = "damage", school = "fire", periodic = true, tag = "Flame Shock (burn)", amount = "r.dot / 4", coef = "0.1", mult = "1 + 0.05 * t.call_of_flame" }] }
[auras.stormstrike]
name = "Stormstrike"
duration = 12
consume_on_cast = true
spell_mods = [{ spells = ["lightning_bolt", "chain_lightning", "earth_shock"], prop = "damage", mul = 1.2 }]
[auras.stormstrike_regen]
name = "Stormstrike (regeneration)"
duration = 15
mods = [{ stat = "casting_regen", add = 0.5 }]
[auras.maelstrom_weapon]
name = "Maelstrom Weapon"
duration = 30
max_stacks = 5
consume_on_cast = true
spell_mods = [{ spells = ["lightning_bolt"], prop = "cast_time", mul = "max(0, 1 - 0.04 * t.maelstrom_weapon * stacks)" }, { spells = ["lightning_bolt"], prop = "cost", mul = "max(0, 1 - 0.04 * t.maelstrom_weapon * stacks)" }]
[auras.flurry]
name = "Flurry"
duration = 15
charges = 3
mods = [{ stat = "melee_haste", mul = "1 + 0.05 * t.flurry" }]
procs = [{ on = "melee_swing", effects = [{ type = "consume" }] }]
[auras.elemental_devastation]
name = "Elemental Devastation"
duration = 10
mods = [{ stat = "melee_crit", add = "3 * t.elemental_devastation" }]
[auras.clearcasting]
name = "Clearcasting"
