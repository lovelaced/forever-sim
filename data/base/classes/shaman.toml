tree = "Elemental Combat"
points = 20
ranks = 3
# The copies are the game's own overload spells (half damage, half coefficient;
# lightning_bolt_overload and chain_lightning_overload below). They roll their own hit and crit.
# trait data 3/7/10% (the talent's spell, 408438, holds 30)
text = "3/7/10% chance that Lightning Bolt or Chain Lightning casts a free half-damage copy of itself."
procs = [
  { on = "spell_landed", if = "!event.periodic && spell.lightning_bolt", chance = "rank == 1 ? 0.03 : rank == 2 ? 0.07 : 0.1", effects = [{ type = "cast", spell = "lightning_bolt_overload" }] },
  { on = "spell_landed", if = "!event.periodic && spell.chain_lightning", chance = "rank == 1 ? 0.03 : rank == 2 ? 0.07 : 0.1", effects = [{ type = "cast", spell = "chain_lightning_overload" }] },
