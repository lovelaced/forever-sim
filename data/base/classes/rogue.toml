# ------------------------------------------------------------------ rotations
[rotations.combat_swords]
desc = "Combat swords: Slice and Dice up, Sinister Strike to 5 points, Eviscerate; Kidney Shot and Evasion against players"
precombat = ["instant_poison_mh", "deadly_poison_oh", { cast = "instant_poison_oh", if = "!known.deadly_poison_oh" }, "stealth"]
opener = ["premeditation", "cheap_shot"]
actions = [
  { cast = "evasion", if = "hp_pct < 0.5 && target.is_player" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "adrenaline_rush" },
  { cast = "blade_flurry" },
  { cast = "riposte" },
  { cast = "kick" },
  { cast = "kidney_shot", if = "target.is_player && cp >= 4 && !target.stunned" },
  { cast = "slice_and_dice", if = "!aura.slice_and_dice.up && cp >= 2 && target.hp_pct > 0.35" },
  { cast = "cold_blood", if = "cp >= 4" },
  { cast = "eviscerate", if = "cp >= 5 || (cp >= 2 && target.hp_pct < 0.2)" },
  { cast = "sinister_strike" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "stealth" },
]
eat_below = 0.55

[rotations.daggers]
desc = "Daggers: Ambush/Garrote opener, Mutilate or Backstab (Sinister Strike when not behind), Rupture on long fights, Eviscerate"
precombat = ["instant_poison_mh", "deadly_poison_oh", { cast = "instant_poison_oh", if = "!known.deadly_poison_oh" }, "stealth"]
opener = ["premeditation", "ambush", "garrote", "cheap_shot"]
actions = [
  { cast = "evasion", if = "hp_pct < 0.5 && target.is_player" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "adrenaline_rush" },
  { cast = "riposte" },
  { cast = "kick" },
  { cast = "kidney_shot", if = "target.is_player && cp >= 4 && !target.stunned" },
  { cast = "slice_and_dice", if = "!aura.slice_and_dice.up && cp >= 2 && target.hp_pct > 0.35" },
  { cast = "venom", if = "!aura.venom.up && cp >= 3" },
  { cast = "rupture", if = "cp >= 5 && !target.aura.rupture.up && target.hp_pct > 0.5" },
  { cast = "cold_blood", if = "cp >= 4" },
  { cast = "eviscerate", if = "cp >= 5 || (cp >= 2 && target.hp_pct < 0.2)" },
  { cast = "ambush" },
  { cast = "ghostly_strike", if = "target.is_player || hp_pct < 0.6" },
  { cast = "mutilate" },
  { cast = "backstab" },
  { cast = "hemorrhage" },
  { cast = "sinister_strike", if = "!known.mutilate && !known.hemorrhage && !(behind && mh.dagger)" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "stealth" },
]
eat_below = 0.55
