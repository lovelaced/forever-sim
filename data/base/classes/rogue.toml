# Rogue. Talents and spell ranks: Forever client 1.60.1.70338
# (wowforevertalents.com/rogue and /abilities/rogue, checked 2026-10-15).
# Spell numbers are checked against Forever's spell tables with `fsim audit
# rogue` (data/reference/spellbook.json); deliberate differences are listed in
# data/reference/accepted/rogue.toml. Talent values per rank come from the
# client's talent tree (trait tree 1111: TraitDefinitionEffectPoints curves),
# because each Forever talent has one spell whose own number is either the
# full-rank value or a leftover Classic rank-1 value.
# Weapon strikes follow the game's effect order: the flat bonus is added to
# the weapon roll before the weapon-damage percentage multiplies both
# (Backstab rank 1: (weapon + 10) x 150%), and "normalized" strikes use the
# standard weapon speed (dagger 1.7, other one-handers 2.4) for attack power.
# Base stats and the stat formulas are Classic 1.12 values.
name = "Rogue"
icon = "classicon_rogue"
resources = ["energy"]
can_parry = true
can_dual_wield = true
energy_gcd = true
source = "forever-70338"

base = [
  { level = 1, str = 18, agi = 23, sta = 21, int = 20, spi = 20, hp = 45, mana = 0 },
  { level = 40, str = 54, agi = 92, sta = 54, int = 29, spi = 38, hp = 868, mana = 0 },
  { level = 60, str = 80, agi = 130, sta = 75, int = 35, spi = 52, hp = 1523, mana = 0 },
]

[formulas]
ap = "str + agi + level * 2 - 20"
rap = "agi + level - 10"
melee_crit = "agi / interp(level, 1,4.6, 40,19, 60,29)"
ranged_crit = "agi / interp(level, 1,4.6, 40,19, 60,29)"
spell_crit = "0"
dodge = "agi / interp(level, 1,2, 40,10, 60,14.5)"
parry = "5"
hp_regen = "spi * 0.5 + 2"

