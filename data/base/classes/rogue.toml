# ------------------------------------------------------------------ rotations
[rotations.combat_swords]
desc = "Combat swords: Slice and Dice up, Sinister Strike to 5 points, Eviscerate, Blade Flurry and Adrenaline Rush on cooldown; Evasion when low against two or more or a player, Kidney Shot against players"
precombat = ["instant_poison_mh", "deadly_poison_oh", { cast = "instant_poison_oh", if = "!known.deadly_poison_oh" }, "stealth"]
opener = ["premeditation", "cheap_shot"]
actions = [
  { cast = "will_to_survive" },
  { cast = "evasion", if = "hp_pct < 0.5 && (target.is_player || enemies >= 2)" },
  { cast = "stoneform", if = "hp_pct < 0.5" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "elunes_light" },
  { cast = "eureka" },
  { cast = "adrenaline_rush" },
  { cast = "blade_flurry" },
  { cast = "riposte" },
  { cast = "kick" },
  { cast = "kidney_shot", if = "target.is_player && cp >= 4 && !target.stunned" },
  { cast = "slice_and_dice", if = "!aura.slice_and_dice.up && cp >= 2 && target.hp_pct > 0.35" },
  { cast = "cold_blood", if = "cp >= 4" },
  { cast = "eviscerate", if = "cp >= 5 || (cp >= 2 && target.hp_pct < 0.2)" },
  { cast = "sinister_strike" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "stealth" },
]
eat_below = 0.55

[rotations.daggers]
desc = "Daggers: Ambush/Garrote opener, Mutilate or Backstab (Sinister Strike when not behind), Rupture on long fights, Eviscerate; Evasion when low against two or more or a player"
precombat = ["instant_poison_mh", "deadly_poison_oh", { cast = "instant_poison_oh", if = "!known.deadly_poison_oh" }, "stealth"]
opener = ["premeditation", "ambush", "garrote", "cheap_shot"]
actions = [
  { cast = "will_to_survive" },
  { cast = "evasion", if = "hp_pct < 0.5 && (target.is_player || enemies >= 2)" },
  { cast = "stoneform", if = "hp_pct < 0.5" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "elunes_light" },
  { cast = "eureka" },
  { cast = "adrenaline_rush" },
  { cast = "riposte" },
  { cast = "kick" },
  { cast = "kidney_shot", if = "target.is_player && cp >= 4 && !target.stunned" },
  { cast = "slice_and_dice", if = "!aura.slice_and_dice.up && cp >= 2 && target.hp_pct > 0.35" },
  { cast = "venom", if = "!aura.venom.up && cp >= 3" },
  { cast = "rupture", if = "cp >= 5 && !target.aura.rupture.up && target.hp_pct > 0.5" },
  { cast = "cold_blood", if = "cp >= 4" },
  { cast = "eviscerate", if = "cp >= 5 || (cp >= 2 && target.hp_pct < 0.2)" },
  { cast = "ambush" },
  { cast = "ghostly_strike", if = "target.is_player || hp_pct < 0.6" },
  { cast = "mutilate" },
  { cast = "backstab" },
  { cast = "hemorrhage" },
  { cast = "sinister_strike", if = "!known.mutilate && !known.hemorrhage && !(behind && mh.dagger)" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "stealth" },
]
eat_below = 0.55

[rotations.subtlety]
desc = "Subtlety: Premeditation and Ambush from Stealth (Cheap Shot without a dagger), Ghostly Strike on cooldown, Hemorrhage as the builder (Backstab or Sinister Strike before 30), Slice and Dice, Rupture on long fights, Eviscerate; Evasion when low against two or more or a player"
precombat = ["instant_poison_mh", "deadly_poison_oh", { cast = "instant_poison_oh", if = "!known.deadly_poison_oh" }, "stealth"]
opener = ["premeditation", "ambush", "cheap_shot"]
actions = [
  { cast = "will_to_survive" },
  { cast = "evasion", if = "hp_pct < 0.5 && (target.is_player || enemies >= 2)" },
  { cast = "stoneform", if = "hp_pct < 0.5" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "elunes_light" },
  { cast = "eureka" },
  { cast = "riposte" },
  { cast = "kick" },
  { cast = "kidney_shot", if = "target.is_player && cp >= 4 && !target.stunned" },
  { cast = "slice_and_dice", if = "!aura.slice_and_dice.up && cp >= 2 && target.hp_pct > 0.35" },
  { cast = "rupture", if = "cp >= 5 && !target.aura.rupture.up && (target.boss ? target.hp_pct > 0.1 : target.hp_pct > 0.5)" },
  { cast = "eviscerate", if = "cp >= 5 || (cp >= 2 && target.hp_pct < 0.2)" },
  { cast = "ambush" },
  { cast = "ghostly_strike" },
  { cast = "hemorrhage", if = "!target.aura.hemorrhage.up" },
  { cast = "backstab" },
  { cast = "hemorrhage" },
  { cast = "sinister_strike", if = "!known.hemorrhage && !(behind && mh.dagger)" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "stealth" },
]
eat_below = 0.55
