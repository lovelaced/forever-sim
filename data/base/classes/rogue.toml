# ------------------------------------------------------------------ passives
[[passives]]
name = "Riposte window"
procs = [{ on = "parry", effects = [{ type = "aura", aura = "riposte_ready" }] }]

# ------------------------------------------------------------------ auras
[auras.stealth]
name = "Stealth"
text = "Removed by the first attack. Re-entered between pulls."
[auras.remorseless]
name = "Remorseless"
duration = 20
consume_on_cast = true
spell_mods = [{ spells = ["sinister_strike", "backstab", "ambush", "mutilate", "ghostly_strike"], prop = "crit", add = "20 * t.remorseless_attacks" }]
[auras.cold_blood]
name = "Cold Blood"
consume_on_cast = true
spell_mods = [{ spells = ["sinister_strike", "backstab", "ambush", "eviscerate", "mutilate"], prop = "crit", add = 100 }]
[auras.slice_and_dice]
name = "Slice and Dice"
duration = "(6 + 3 * cp) * (1 + 0.15 * t.improved_slice_and_dice)"
mods = [{ stat = "melee_haste", mul = "1 + r.haste" }]
[auras.rupture]
name = "Rupture"
debuff = true
refresh = "replace"
max_stacks = 5
duration = "6 + 2 * cp"
text = "Stacks hold the combo points the Rupture was cast with."
[auras.rupture.tick]
interval = 2
[[auras.rupture.tick.effects]]
type = "damage"
school = "physical"
periodic = true
tag = "Rupture"
amount = "(interp(stacks, 1,r.c1, 2,r.c2, 3,r.c3, 4,r.c4, 5,r.c5) + ap * interp(stacks, 1,0.04, 2,0.10, 3,0.18, 4,0.21, 5,0.24)) / (3 + stacks) * (1 + 0.1 * t.serrated_blades) * (target.aura.hemorrhage.up ? 1.15 : 1)"
[[auras.rupture.tick.effects]]
type = "if"
cond = "t.thousand_cuts > 0"
then = [{ type = "aura", aura = "thousand_cuts", target = "self" }]
[auras.garrote]
name = "Garrote"
debuff = true
duration = 18
tick = { interval = 3, effects = [{ type = "damage", school = "physical", periodic = true, tag = "Garrote", amount = "(r.total + 0.18 * ap) / 6" }] }
[auras.kidney_vulnerability]
name = "Improved Kidney Shot"
debuff = true
refresh = "replace"
max_stacks = 2
text = "Stacks = talent rank of the rogue who applied it."
mods = [{ stat = "dmg_taken", mul = "1 + 0.05 * stacks" }]
[auras.hemorrhage]
name = "Hemorrhage"
debuff = true
duration = 15
[auras.ghostly_strike]
name = "Ghostly Strike"
duration = 7
mods = [{ stat = "dodge", add = 15 }]
[auras.evasion]
name = "Evasion"
duration = 15
mods = [{ stat = "dodge", add = 50 }]
[auras.blade_flurry]
name = "Blade Flurry"
duration = 15
mods = [{ stat = "melee_haste", mul = 1.2 }]
[auras.adrenaline_rush]
name = "Adrenaline Rush"
duration = 15
mods = [{ stat = "energy_regen", mul = 2 }]
[auras.venom]
name = "Venom"
duration = "6 + 3 * cp"
[auras.cutthroat]
name = "Cutthroat"
duration = 10
[auras.riposte_ready]
name = "Riposte window"
duration = 5
[auras.thousand_cuts]
name = "Thousand Cuts"
duration = 10
max_stacks = 5
consume_on_cast = true
spell_mods = [{ spells = ["hemorrhage", "backstab"], prop = "cost", add = "-3 * stacks" }]

# Weapon poisons: one per hand (group), applied before combat.
[auras.instant_poison_mh]
name = "Instant Poison (main hand)"
group = "poison_mh"
procs = [{ on = "melee_landed", if = "event.mh", chance = "0.2 + 0.02 * t.improved_poisons + (aura.venom.up ? 0.1 : 0)", effects = [
  { type = "damage", school = "nature", hit = "spell", min = "r.lo", max = "r.hi", mult = "(1 + 0.04 * t.vile_poisons) * (aura.venom.up ? 1.3 : 1)", no_proc = true, tag = "Instant Poison" },
] }]
[auras.instant_poison_oh]
name = "Instant Poison (off hand)"
group = "poison_oh"
procs = [{ on = "melee_landed", if = "event.oh", chance = "0.2 + 0.02 * t.improved_poisons + (aura.venom.up ? 0.1 : 0)", effects = [
  { type = "damage", school = "nature", hit = "spell", min = "r.lo", max = "r.hi", mult = "(1 + 0.04 * t.vile_poisons) * (aura.venom.up ? 1.3 : 1)", no_proc = true, tag = "Instant Poison" },
] }]
[auras.deadly_poison_mh]
name = "Deadly Poison (main hand)"
group = "poison_mh"
procs = [{ on = "melee_landed", if = "event.mh", chance = "0.3 + 0.02 * t.improved_poisons + (aura.venom.up ? 0.1 : 0)", effects = [{ type = "aura", aura = "deadly_poison", target = "target" }] }]
[auras.deadly_poison_oh]
name = "Deadly Poison (off hand)"
group = "poison_oh"
procs = [{ on = "melee_landed", if = "event.oh", chance = "0.3 + 0.02 * t.improved_poisons + (aura.venom.up ? 0.1 : 0)", effects = [{ type = "aura", aura = "deadly_poison", target = "target" }] }]
[auras.deadly_poison]
name = "Deadly Poison"
debuff = true
duration = 12
max_stacks = 5
tick = { interval = 3, effects = [{ type = "damage", school = "nature", periodic = true, tag = "Deadly Poison", amount = "r.total / 4 * stacks * (1 + 0.04 * t.vile_poisons) * (aura.venom.up ? 1.3 : 1)" }] }

