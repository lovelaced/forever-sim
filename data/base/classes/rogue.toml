# ------------------------------------------------------------------ passives
[[passives]]
name = "Riposte window"
procs = [{ on = "parry", effects = [{ type = "aura", aura = "riposte_ready" }] }]

# ------------------------------------------------------------------ auras
[auras.stealth]
name = "Stealth"
text = "Removed by the first attack. Re-entered between pulls."
# any damage you deal or take ends it (stun openers remove it themselves;
# buffs on yourself, like racials, don't)
break_on_damage = true
procs = [{ on = "damage_dealt", effects = [{ type = "remove_self" }] }]
[auras.remorseless]
name = "Remorseless"
duration = 20
consume_on_cast = true
spell_mods = [{ spells = ["sinister_strike", "backstab", "ambush", "mutilate", "ghostly_strike"], prop = "crit", add = "20 * t.remorseless_attacks" }]
[auras.cold_blood]
name = "Cold Blood"
consume_on_cast = true
spell_mods = [{ spells = ["sinister_strike", "backstab", "ambush", "eviscerate", "mutilate"], prop = "crit", add = 100 }]
[auras.slice_and_dice]
name = "Slice and Dice"
duration = "(6 + 3 * cp) * (1 + 0.15 * t.improved_slice_and_dice)"
mods = [{ stat = "melee_haste", mul = "1 + r.haste" }]
[auras.rupture]
name = "Rupture"
debuff = true
refresh = "replace"
max_stacks = 5
duration = "6 + 2 * cp"
text = "Stacks hold the combo points the Rupture was cast with."
# Per tick: the game's base plus its per-combo-point amount (spell data), and
# an attack power share spread over the ticks (an assumption, see options).
[auras.rupture.tick]
interval = 2
[[auras.rupture.tick.effects]]
type = "damage"
school = "physical"
periodic = true
tag = "Rupture"
amount = "(r.tick + r.tick_cp * stacks + opt.rogue_rupture_ap * ap * interp(stacks, 1,0.04, 2,0.10, 3,0.18, 4,0.21, 5,0.24) / (3 + stacks)) * (target.aura.hemorrhage.up ? 1.15 : 1)"
mult = "1 + 0.1 * t.serrated_blades"
[[auras.rupture.tick.effects]]
type = "if"
cond = "t.thousand_cuts > 0"
then = [{ type = "aura", aura = "thousand_cuts", target = "self" }]
[auras.garrote]
name = "Garrote"
debuff = true
duration = 18
tick = { interval = 3, effects = [{ type = "damage", school = "physical", periodic = true, tag = "Garrote", amount = "r.tick + opt.rogue_garrote_ap * ap / 6" }] }
[auras.kidney_vulnerability]
name = "Improved Kidney Shot"
debuff = true
refresh = "replace"
max_stacks = 2
text = "Stacks = talent rank of the rogue who applied it."
# The game limits the bonus to the rogue's own damage. The sim raises all
# damage the target takes, which is the same thing where Kidney Shot is used
# (the rogue is the only one attacking that target).
mods = [{ stat = "dmg_taken", mul = "1 + 0.05 * stacks" }]
[auras.hemorrhage]
name = "Hemorrhage"
debuff = true
duration = 15
[auras.ghostly_strike]
name = "Ghostly Strike"
duration = 7
mods = [{ stat = "dodge", add = 15 }]
[auras.evasion]
name = "Evasion"
duration = 15
mods = [{ stat = "dodge", add = 50 }]
[auras.blade_flurry]
name = "Blade Flurry"
duration = 15
mods = [{ stat = "melee_haste", mul = 1.2 }]
# Each melee hit that lands on one enemy while another is alive is repeated
# on that other enemy for the damage the first hit dealt (as in the original
# game: the copy uses the first target's armor and cannot crit or miss on its
# own). The mark tells the copy which enemy to skip. Poisons are not copied.
procs = [{ on = "melee_landed", if = "enemies >= 2", effects = [
  { type = "aura", aura = "blade_flurry_mark", target = "target" },
  { type = "damage", school = "physical", hit = "auto", can_crit = false, fixed = true, no_proc = true, amount = "event.amount", mult = "target.aura.blade_flurry_mark.up ? 0 : 1", target = "enemies", max_targets = "target.alive ? 2 : 1", tag = "Blade Flurry" },
  { type = "remove_aura", aura = "blade_flurry_mark", target = "target" },
] }]
[auras.blade_flurry_mark]
name = "Blade Flurry target"
debuff = true
duration = 1
text = "Marks the enemy the hit came from, so the Blade Flurry copy goes to another one."
[auras.adrenaline_rush]
name = "Adrenaline Rush"
duration = 15
mods = [{ stat = "energy_regen", mul = 2 }]
[auras.venom]
name = "Venom"
duration = "6 + 3 * cp"
[auras.cutthroat]
name = "Cutthroat"
duration = 10
[auras.riposte_ready]
name = "Riposte window"
duration = 5
[auras.thousand_cuts]
name = "Thousand Cuts"
duration = 10
max_stacks = 5
consume_on_cast = true
spell_mods = [{ spells = ["hemorrhage", "backstab"], prop = "cost", add = "-3 * stacks" }]

# Weapon poisons: one per hand (group), applied before combat.
[auras.instant_poison_mh]
name = "Instant Poison (main hand)"
group = "poison_mh"
procs = [{ on = "melee_landed", if = "event.mh", chance = "0.2 + 0.02 * t.improved_poisons + (aura.venom.up ? 0.1 : 0)", effects = [
  { type = "damage", school = "nature", hit = "spell", min = "r.lo * (aura.venom.up ? 1.3 : 1)", max = "r.hi * (aura.venom.up ? 1.3 : 1)", mult = "1 + 0.04 * t.vile_poisons", no_proc = true, tag = "Instant Poison" },
] }]
[auras.instant_poison_oh]
name = "Instant Poison (off hand)"
group = "poison_oh"
procs = [{ on = "melee_landed", if = "event.oh", chance = "0.2 + 0.02 * t.improved_poisons + (aura.venom.up ? 0.1 : 0)", effects = [
  { type = "damage", school = "nature", hit = "spell", min = "r.lo * (aura.venom.up ? 1.3 : 1)", max = "r.hi * (aura.venom.up ? 1.3 : 1)", mult = "1 + 0.04 * t.vile_poisons", no_proc = true, tag = "Instant Poison" },
] }]
[auras.deadly_poison_mh]
name = "Deadly Poison (main hand)"
group = "poison_mh"
procs = [{ on = "melee_landed", if = "event.mh", chance = "0.3 + 0.02 * t.improved_poisons + (aura.venom.up ? 0.1 : 0)", effects = [{ type = "aura", aura = "deadly_poison", target = "target" }] }]
[auras.deadly_poison_oh]
name = "Deadly Poison (off hand)"
group = "poison_oh"
procs = [{ on = "melee_landed", if = "event.oh", chance = "0.3 + 0.02 * t.improved_poisons + (aura.venom.up ? 0.1 : 0)", effects = [{ type = "aura", aura = "deadly_poison", target = "target" }] }]
[auras.deadly_poison]
name = "Deadly Poison"
debuff = true
duration = 12
max_stacks = 5
tick = { interval = 3, effects = [{ type = "damage", school = "nature", periodic = true, tag = "Deadly Poison", amount = "r.tick * stacks * (aura.venom.up ? 1.3 : 1)", mult = "1 + 0.04 * t.vile_poisons" }] }

# ------------------------------------------------------------------ spells
[spells.stealth]
name = "Stealth"
