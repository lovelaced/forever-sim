# Priest. Talents and spell ranks: Forever client 1.60.1.70338
# (wowforevertalents.com/priest and /abilities/priest, checked 2026-10-15).
# Spell ranks, coefficients, periodic ticks, absorbs, proc chances and the
# spells each talent modifier reaches follow Forever's own spell data
# (data/reference/spellbook.json, build 70338; `fsim audit priest`).
# Deliberate differences are listed in data/reference/accepted/priest.toml.
# Per-rank talent values, points and prerequisites come from the client's
# talent tree (trait) tables, the "talents" section of spellbook.json. Forever
# keeps one spell per talent and that spell's number is often a rank-1
# leftover or the top rank's total; the trait values win, and agree with the
# tooltips. Nine talents sit in the first row (points 0 in the trait tables):
# Power in Light, Wand Specialization, Twin Disciplines, Twilight Focus,
# Improved Renew, Holy Specialization, Shadow Focus, Blackout, Spirit Tap.
name = "Priest"
icon = "classicon_priest"
resources = ["mana"]
source = "forever-70338"

base = [
  { level = 1, str = 20, agi = 20, sta = 20, int = 22, spi = 23, hp = 52, mana = 110 },
  { level = 40, str = 31, agi = 34, sta = 40, int = 92, spi = 97, hp = 800, mana = 850 },
  { level = 60, str = 37, agi = 42, sta = 52, int = 123, spi = 130, hp = 1397, mana = 1436 },
]

[formulas]
ap = "str - 10"
rap = "agi - 10"
melee_crit = "agi / 20"
ranged_crit = "agi / 20"
spell_crit = "0.8 + int / interp(level, 1,10, 40,40, 60,59.2)"
dodge = "agi / 20"
mana_regen = "13 + spi / 4"
hp_regen = "spi * 0.1 + 2"

# ------------------------------------------------------------------ talents
[talents.power_in_light]
icon = "spell_holy_searinglight"
tree = "Discipline"
points = 0
ranks = 5
text = "Smite and Penance deal 2% more per point (10% at 5/5) to targets with your Holy Fire. The talent tree's values and the tooltip agree; the talent spell's 15 is not used."
spell_mods = [{ spells = ["smite", "penance"], prop = "damage", mul = "target.aura.holy_fire.up ? 1 + 0.02 * rank : 1" }]
[talents.wand_specialization]
icon = "inv_wand_01"
tree = "Discipline"
points = 0
ranks = 2
text = "Wand damage +13/25%."
spell_mods = [{ spells = ["shoot"], prop = "damage", mul = "1 + (rank >= 2 ? 0.25 : 0.13)" }]
[talents.twin_disciplines]
icon = "spell_holy_sealofvengeance"
tree = "Discipline"
points = 0
ranks = 5
text = "Instant spells deal and heal 5% more. In the game data: Holy Nova, Shadowguard, Desperate Prayer, Prayer of Mending, Contingency Plan and the ticks of Shadow Word: Pain, Devouring Plague and Renew (not Power Word: Shield, Shadow Word: Death or Penance)."
spell_mods = [
  { spells = ["shadow_word_pain", "devouring_plague", "holy_nova", "shadowguard"], prop = "damage", mul = "1 + 0.01 * rank" },
  { spells = ["renew", "holy_nova", "prayer_of_mending", "desperate_prayer", "contingency_plan"], prop = "heal", mul = "1 + 0.01 * rank" },
]
[talents.silent_resolve]
icon = "spell_nature_manaregentotem"
tree = "Discipline"
points = 5
ranks = 3
text = "Stun, Fear and Silence effects on you are 5% shorter per point (the sim shortens stuns and fears; nothing here silences). Holy spell threat -10% per point is not simulated: the priest fights alone, so threat never changes who an enemy attacks."
mods = [{ stat = "stun_duration", mul = "1 - 0.05 * rank" }, { stat = "fear_duration", mul = "1 - 0.05 * rank" }]
[talents.holy_precision]
icon = "spell_holy_divineillumination"
tree = "Discipline"
points = 5
ranks = 3
text = "Holy spell hit +18% (Smite, Holy Fire, Holy Nova, Penance; the sim has one spell hit for every school, so it reaches Shadow spells too)."
mods = [{ stat = "spell_hit", add = "6 * rank" }]
[talents.improved_power_word_shield]
icon = "spell_holy_powerwordshield"
tree = "Discipline"
points = 5
ranks = 3
text = "Power Word: Shield absorbs 7%, 14% or 20% more."
[talents.martyrdom]
icon = "spell_nature_tranquility"
tree = "Discipline"
points = 5
ranks = 2
text = "50% chance per rank to gain Focused Casting (no pushback for 6 sec) after a melee or ranged critical hit against you. Its 20% interrupt resistance is not simulated."
procs = [{ on = "struck_crit", if = "!event.spell", chance = "0.5 * rank", effects = [{ type = "aura", aura = "focused_casting" }] }]
[talents.mental_agility]
icon = "ability_hibernation"
tree = "Discipline"
points = 10
ranks = 3
text = "Smite, Holy Fire and instant spells cost 3%, 7% or 10% less. In the game data that excludes Shadow Word: Death and Penance."
spell_mods = [{ spells = ["smite", "holy_fire", "shadow_word_pain", "devouring_plague", "power_word_shield", "renew", "holy_nova", "prayer_of_mending", "shadowguard", "inner_fire", "fortitude", "shadowform", "vampiric_embrace", "psychic_scream", "power_infusion", "contingency_plan"], prop = "cost", mul = "1 - interp(rank, 1,0.03, 2,0.07, 3,0.1)" }]
[talents.inner_focus]
