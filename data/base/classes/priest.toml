# ------------------------------------------------------------------ auras
[auras.inner_fire]
name = "Inner Fire"
mods = [{ stat = "armor", add = "r.armor * (1 + 0.15 * t.improved_inner_fire)" }]
[auras.fortitude]
name = "Power Word: Fortitude"
mods = [{ stat = "sta", add = "r.sta" }]
[auras.weakened_soul]
name = "Weakened Soul"
debuff = true
per_source = false
duration = "15 - t.renewed_hope"
[auras.power_word_shield]
name = "Power Word: Shield"
duration = 30
absorb = "(r.absorb + 0.1 * heal_power) * (1 + t.improved_power_word_shield / 15) * (aura.power_infusion.up ? 1.2 : 1)"
[auras.renew]
name = "Renew"
duration = 15
tick = { interval = 3, effects = [{ type = "heal", target = "target", amount = "r.total / 5", coef = 0.2, periodic = true, mult = "1 + 0.05 * t.improved_renew", tag = "Renew" }] }
[auras.shadow_word_pain]
name = "Shadow Word: Pain"
debuff = true
duration = "18 + 3 * t.improved_shadow_word_pain"
tick = { interval = 3, effects = [{ type = "damage", school = "shadow", periodic = true, tag = "Shadow Word: Pain", amount = "r.total / 6", coef = "1 / 6" }] }
[auras.devouring_plague]
name = "Devouring Plague"
debuff = true
duration = 24
tick = { interval = 3, effects = [{ type = "damage", school = "shadow", periodic = true, tag = "Devouring Plague", amount = "r.total / 8", coef = "0.8 / 8", lifesteal = 1 }] }
[auras.holy_fire]
name = "Holy Fire"
debuff = true
duration = 10
tick = { interval = 2, effects = [{ type = "damage", school = "holy", periodic = true, tag = "Holy Fire (burn)", amount = "r.dot / 5", coef = "0.165 / 5" }] }
[auras.inner_focus]
name = "Inner Focus"
consume_on_cast = true
spell_mods = [{ spells = ["smite", "holy_fire", "mind_blast", "heal", "flash_heal", "penance", "penance_heal", "shadow_word_death", "binding_heal", "mind_flay"], prop = "cost", mul = 0 }, { spells = ["smite", "holy_fire", "mind_blast", "heal", "flash_heal", "penance", "penance_heal", "shadow_word_death", "binding_heal", "mind_flay"], prop = "crit", add = 25 }]
[auras.power_infusion]
name = "Power Infusion"
duration = 15
mods = [{ stat = "spell_dmg_done", mul = 1.2 }, { stat = "heal_done", mul = 1.2 }]
[auras.divine_aegis]
name = "Divine Aegis"
duration = 12
max_stacks = 1000000
refresh = "replace"
absorb = "stacks"
[auras.blessed_recovery]
name = "Blessed Recovery"
duration = 6
max_stacks = 1000000
refresh = "replace"
tick = { interval = 2, effects = [{ type = "heal", target = "self", amount = "stacks / 3", tag = "Blessed Recovery" }] }
[auras.inspiration]
name = "Inspiration"
duration = 15
max_stacks = 3
refresh = "replace"
mods = [{ stat = "armor_mult", mul = "1 + (stacks == 3 ? 0.25 : 0.08 * stacks)" }]
[auras.spirit_tap]
name = "Spirit Tap"
duration = 15
mods = [{ stat = "spi_pct", add = 1.0 }]
[auras.vampiric_embrace]
name = "Vampiric Embrace"
duration = 30
procs = [{ on = "spell_landed", if = "!event.physical", effects = [{ type = "heal", target = "self", amount = "event.amount * 0.2", tag = "Vampiric Embrace" }] }]
[auras.shadow_weaving]
name = "Shadow Weaving"
debuff = true
per_source = false
duration = 15
max_stacks = 5
mods = [{ stat = "spell_dmg_taken", mul = "1 + 0.02 * stacks" }]
[auras.shadowform]
name = "Shadowform"
form = true
mods = [{ stat = "shadow_dmg_done", mul = 1.1 }, { stat = "phys_dmg_taken", mul = 0.85 }]
spell_mods = [{ school = "shadow", prop = "cost", mul = 0.5 }, { school = "shadow", prop = "crit_bonus", add = 1.0 }]
[auras.shadowguard]
name = "Shadowguard"
duration = 600
charges = 3
procs = [{ on = "struck_melee", effects = [{ type = "damage", school = "shadow", target = "target", hit = "auto", amount = "r.dmg", coef = 0.1, no_proc = true, tag = "Shadowguard" }, { type = "consume" }] }]
[auras.prayer_of_mending]
name = "Prayer of Mending"
duration = 30
charges = 1
procs = [{ on = "struck", effects = [{ type = "heal", target = "self", amount = "r.base", coef = 0.429, tag = "Prayer of Mending" }, { type = "consume" }] }]
[auras.dark_sacrifice]
name = "Dark Sacrifice"
duration = 15
tick = { interval = 3, effects = [{ type = "resource", res = "hp", amount = "-r.cost / 5" }, { type = "resource", res = "mana", amount = "(r.cost + spi) / 5" }] }
[auras.contingency_plan]
name = "Contingency Plan"
duration = 30
procs = [{ on = "struck", if = "hp_pct < 0.35", effects = [{ type = "aura", aura = "contingency_shield" }, { type = "aura", aura = "contingency_heal" }, { type = "remove_self" }] }]
[auras.contingency_shield]
name = "Contingency Plan (shield)"
duration = 15
absorb = "r.shield"
[auras.contingency_heal]
name = "Contingency Plan (heal)"
duration = 15
tick = { interval = 3, effects = [{ type = "heal", target = "self", amount = "r.hot / 5", periodic = true, tag = "Contingency Plan" }] }

