# ------------------------------------------------------------------ auras
[auras.inner_fire]
name = "Inner Fire"
duration = 600
charges = "20 + 4 * t.improved_inner_fire"
mods = [{ stat = "armor", add = "r.armor * (1 + 0.15 * t.improved_inner_fire)" }]
procs = [{ on = "struck", if = "!event.spell", effects = [{ type = "consume" }] }]
[auras.fortitude]
name = "Power Word: Fortitude"
mods = [{ stat = "sta", add = "r.sta" }]
[auras.weakened_soul]
name = "Weakened Soul"
debuff = true
per_source = false
duration = "15 - t.renewed_hope"
[auras.power_word_shield]
name = "Power Word: Shield"
duration = 30
absorb = "(r.absorb + 0.1 * heal_power) * (1 + interp(t.improved_power_word_shield, 0,0, 1,0.07, 2,0.14, 3,0.2))"
[auras.renew]
name = "Renew"
duration = 15
tick = { interval = 3, effects = [{ type = "heal", target = "target", amount = "r.tick", coef = 0.2, periodic = true, can_crit = true, tag = "Renew" }] }
[auras.shadow_word_pain]
name = "Shadow Word: Pain"
debuff = true
duration = "18 + 3 * t.improved_shadow_word_pain"
tick = { interval = 3, effects = [{ type = "damage", school = "shadow", periodic = true, tag = "Shadow Word: Pain", amount = "r.tick", coef = 0.2 }] }
[auras.devouring_plague]
name = "Devouring Plague"
debuff = true
duration = 24
tick = { interval = 3, effects = [{ type = "damage", school = "shadow", periodic = true, tag = "Devouring Plague", amount = "r.tick", coef = 0.1, lifesteal = 1 }] }
[auras.holy_fire]
name = "Holy Fire"
debuff = true
duration = 10
tick = { interval = 2, effects = [
  { type = "damage", school = "holy", periodic = true, tag = "Holy Fire (burn)", amount = "r.dot", coef = 0.05 },
  { type = "chance", p = "0.05 * t.searing_light", then = [{ type = "aura", aura = "holy_purpose", target = "self" }] },
] }
[auras.inner_focus]
name = "Inner Focus"
consume_on_cast = true
spell_mods = [
  { spells = ["smite", "holy_fire", "mind_blast", "mind_flay", "shadow_word_pain", "devouring_plague", "shadow_word_death", "penance", "penance_heal", "holy_nova", "lesser_heal", "heal", "greater_heal", "flash_heal", "binding_heal", "renew", "power_word_shield", "prayer_of_mending", "shadowguard", "inner_fire", "fortitude", "psychic_scream", "shadowform", "vampiric_embrace", "power_infusion", "contingency_plan"], prop = "cost", mul = 0 },
  { spells = ["smite", "holy_fire", "mind_blast", "mind_flay", "penance", "penance_heal", "holy_nova", "lesser_heal", "heal", "greater_heal", "flash_heal", "binding_heal", "desperate_prayer", "prayer_of_mending", "shadowguard"], prop = "crit", add = 25 },
]
[auras.power_infusion]
name = "Power Infusion"
duration = 15
mods = [{ stat = "spell_dmg_done", mul = 1.2 }, { stat = "heal_done", mul = 1.2 }]
[auras.divine_aegis]
name = "Divine Aegis"
duration = 12
max_stacks = 1000000
refresh = "replace"
absorb = "stacks"
[auras.blessed_recovery]
name = "Blessed Recovery"
duration = 6
max_stacks = 1000000
refresh = "replace"
tick = { interval = 2, effects = [{ type = "heal", target = "self", amount = "stacks / 3", tag = "Blessed Recovery" }] }
[auras.inspiration]
name = "Inspiration"
duration = 15
refresh = "replace"
mods = [{ stat = "armor_mult", mul = "1 + interp(t.inspiration, 0,0, 1,0.08, 2,0.17, 3,0.25)" }]
[auras.spirit_tap]
name = "Spirit Tap"
duration = 15
mods = [{ stat = "spi_pct", add = 1.0 }, { stat = "casting_regen", add = 0.5 }]
[auras.vampiric_embrace]
name = "Vampiric Embrace"
duration = 30
procs = [{ on = "spell_landed", if = "!event.physical && !(spell.smite || spell.holy_fire || spell.penance || spell.holy_nova)", effects = [{ type = "heal", target = "self", amount = "event.amount * 0.2", tag = "Vampiric Embrace" }] }]
[auras.shadow_weaving]
name = "Shadow Weaving"
debuff = true
per_source = false
duration = 15
max_stacks = 5
mods = [{ stat = "spell_dmg_taken", mul = "1 + 0.02 * stacks" }]
[auras.shadowform]
name = "Shadowform"
