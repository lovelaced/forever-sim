text = "Heals crit 2% more often per point on targets with Weakened Soul, and Weakened Soul lasts 1 sec less per point (10% and 5 sec at 5/5)."
spell_mods = [{ spells = ["lesser_heal", "heal", "greater_heal", "flash_heal", "binding_heal", "penance_heal", "renew", "desperate_prayer", "prayer_of_mending"], prop = "crit", add = "aura.weakened_soul.up ? 2 * rank : 0" }]
