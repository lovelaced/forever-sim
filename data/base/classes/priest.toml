# ------------------------------------------------------------------ rotations
[rotations.shadow]
desc = "Shadow: Shadowform, Shield, Vampiric Embrace, Pain and Plague, Mind Blast, Shadow Word: Death, Mind Flay"
auto_melee = false
precombat = ["inner_fire", "fortitude", "shadowguard", "shadowform", "power_word_shield"]
opener = []
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.25 && (target.boss || target.is_player)" },
  { cast = "desperate_prayer", if = "hp_pct < 0.35" },
  { cast = "power_word_shield", if = "!target.boss && (in_combat || hp_pct < 0.9)" },
  { cast = "psychic_scream", if = "hp_pct < 0.4" },
  { cast = "vampiric_embrace" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "power_infusion" },
  { cast = "shadow_word_pain", if = "target.hp_pct > 0.2 || target.boss" },
  { cast = "devouring_plague", if = "target.hp_pct > 0.3 || target.boss" },
  { cast = "inner_focus" },
  { cast = "mind_blast" },
  { cast = "shadow_word_death", if = "target.hp_pct < 0.2 || hp_pct > 0.6" },
  { cast = "mind_flay" },
  { cast = "smite", if = "!known.mind_flay" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "shadowguard" },
  { cast = "inner_fire" },
  { cast = "fortitude" },
  { cast = "shadowform" },
]
eat_below = 0.5
drink_below = 0.35

[rotations.smite]
desc = "Discipline/Holy damage: Shield, Holy Fire, Pain and Plague, Penance, Mind Blast, Smite; Renew and Flash Heal when hurt"
auto_melee = false
precombat = ["inner_fire", "fortitude", "shadowguard", "power_word_shield"]
opener = []
actions = [
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.25 && (target.boss || target.is_player)" },
  { cast = "desperate_prayer", if = "hp_pct < 0.35" },
  { cast = "power_word_shield", if = "!target.boss && (in_combat || hp_pct < 0.9)" },
  { cast = "penance_heal", if = "hp_pct < 0.45" },
  { cast = "flash_heal", if = "hp_pct < 0.4" },
  { cast = "renew", if = "hp_pct < 0.7" },
  { cast = "prayer_of_mending", if = "!target.boss" },
  { cast = "psychic_scream", if = "hp_pct < 0.4" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "power_infusion" },
  { cast = "holy_fire", if = "!target.aura.holy_fire.up && target.hp_pct > 0.3" },
  { cast = "shadow_word_pain", if = "target.hp_pct > 0.3 || target.boss" },
  { cast = "devouring_plague", if = "target.hp_pct > 0.4 || target.boss" },
  { cast = "inner_focus" },
  { cast = "penance" },
  { cast = "mind_blast" },
  { cast = "holy_nova", if = "enemies >= 3" },
  { cast = "smite" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "renew", if = "hp_pct < 0.8" },
  { cast = "shadowguard" },
  { cast = "inner_fire" },
  { cast = "fortitude" },
]
eat_below = 0.4
drink_below = 0.35
