# Priest. Talents and spell ranks: Forever client 1.60.1.70338
# (wowforevertalents.com/priest and /abilities/priest, checked 2026-10-15).
# Spell coefficients are Classic/TBC approximations (cast time / 3.5,
# duration / 15 for heal-over-time); the client tooltips do not show them.
# The site gives no row for nine first-tier talents; they are placed in the
# first row (Power in Light, Wand Specialization, Twin Disciplines, Twilight
# Focus, Improved Renew, Holy Specialization, Shadow Focus, Blackout, Spirit Tap).
name = "Priest"
icon = "classicon_priest"
resources = ["mana"]
source = "forever-70338"

base = [
  { level = 1, str = 20, agi = 20, sta = 20, int = 22, spi = 23, hp = 52, mana = 110 },
  { level = 40, str = 31, agi = 34, sta = 40, int = 92, spi = 97, hp = 800, mana = 850 },
  { level = 60, str = 37, agi = 42, sta = 52, int = 123, spi = 130, hp = 1397, mana = 1436 },
]

[formulas]
ap = "str - 10"
rap = "agi - 10"
melee_crit = "agi / 20"
ranged_crit = "agi / 20"
spell_crit = "0.8 + int / interp(level, 1,10, 40,40, 60,59.2)"
dodge = "agi / 20"
mana_regen = "13 + spi / 4"
hp_regen = "spi * 0.1 + 2"

