max_stacks = 4
text = "The spells listed in Forever's buff (spells 400573 and 1300176) hit 10% harder per stack and use it up; Arcane Blast itself, Arcane Missiles and Flamestrike are not among them."
spell_mods = [
  { spells = ["fireball", "frostbolt", "frostfire_bolt", "fire_blast", "scorch", "pyroblast", "blast_wave", "arcane_explosion", "frost_nova", "cone_of_cold", "ice_lance", "blizzard"], prop = "damage", mul = "1 + 0.1 * stacks" },
  { spells = ["arcane_blast"], prop = "cost", mul = "1 + 1.75 * stacks" },
]
