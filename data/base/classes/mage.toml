[auras.ignite]
name = "Ignite"
debuff = true
refresh = "replace"
duration = 4
max_stacks = 100000
text = "Stacks hold the burn's damage still to come; a new Ignite takes over the rest of the old one. The tick undoes every damage modifier (no double dipping)."
