# ------------------------------------------------------------------ rotations
[rotations.frost]
desc = "Frost: Ice Barrier, Frost Nova into Ice Lance/Frostbolt shatter, Frostbolt filler, Evocation when dry"
auto_melee = false
precombat = ["frost_armor", "arcane_intellect", "ice_barrier"]
opener = []
actions = [
  { cast = "counterspell" },
  { cast = "ice_barrier", if = "!aura.ice_barrier.up" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.3 && (target.boss || target.is_player)" },
  { cast = "evocation", if = "mana_pct < 0.12" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "presence_of_mind" },
  { cast = "arcane_power" },
  { cast = "frost_nova", if = "!target.frozen && !target.boss && target.hp_pct > 0.15" },
  { cast = "cone_of_cold", if = "enemies >= 2" },
  { cast = "ice_lance", if = "target.frozen || aura.fingers_of_frost.up" },
  { cast = "fire_blast", if = "target.hp_pct < 0.15" },
  { cast = "frostbolt" },
  { cast = "fireball", if = "!known.frostbolt" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "ice_barrier", if = "!aura.ice_barrier.up" },
  { cast = "frost_armor" },
  { cast = "arcane_intellect" },
]
eat_below = 0.5
drink_below = 0.45

[rotations.fire]
desc = "Fire: Scorch to five stacks on long fights, Fireball, Fire Blast, Pyroblast with three Heating Up stacks, Combustion"
auto_melee = false
precombat = ["frost_armor", "arcane_intellect", "ice_barrier"]
opener = []
actions = [
  { cast = "counterspell" },
  { cast = "ice_barrier", if = "!aura.ice_barrier.up" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.3 && (target.boss || target.is_player)" },
  { cast = "evocation", if = "mana_pct < 0.12" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "combustion" },
  { cast = "presence_of_mind" },
  { cast = "frost_nova", if = "!target.frozen && !target.boss && target.hp_pct > 0.15" },
  { cast = "blast_wave", if = "enemies >= 2" },
  { cast = "pyroblast", if = "aura.heating_up.stacks >= 3" },
  { cast = "scorch", if = "known.scorch && t.improved_scorch > 0 && target.max_hp > 20000 && (target.aura.fire_vulnerability.stacks < 5 || target.aura.fire_vulnerability.remains < 4)" },
  { cast = "fire_blast" },
  { cast = "fireball" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "ice_barrier", if = "!aura.ice_barrier.up" },
  { cast = "frost_armor" },
  { cast = "arcane_intellect" },
]
eat_below = 0.5
drink_below = 0.45

[rotations.arcane]
desc = "Arcane: Arcane Blast to three stacks, then Arcane Missiles (free with Missile Barrage)"
auto_melee = false
precombat = ["frost_armor", "arcane_intellect"]
opener = []
actions = [
  { cast = "counterspell" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.3 && (target.boss || target.is_player)" },
  { cast = "evocation", if = "mana_pct < 0.12" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "arcane_power" },
  { cast = "presence_of_mind" },
  { cast = "frost_nova", if = "!target.frozen && !target.boss && target.hp_pct > 0.15" },
  { cast = "arcane_missiles", if = "aura.missile_barrage.up" },
  { cast = "arcane_blast", if = "aura.arcane_blast.stacks < 3 && mana_pct > 0.25" },
  { cast = "arcane_missiles" },
  { cast = "fireball", if = "!known.arcane_missiles" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "frost_armor" },
  { cast = "arcane_intellect" },
]
eat_below = 0.5
drink_below = 0.45

[rotations.battlemage]
desc = "Battlemage: sword in melee plus instants (Frost Nova, Ice Lance on frozen, Fire Blast, Arcane Explosion, Cone of Cold), Ice Barrier"
auto_melee = true
precombat = ["frost_armor", "arcane_intellect", "ice_barrier"]
opener = []
actions = [
  { cast = "counterspell" },
  { cast = "ice_barrier", if = "!aura.ice_barrier.up" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "mana_potion", if = "mana_pct < 0.3 && (target.boss || target.is_player)" },
  { cast = "evocation", if = "mana_pct < 0.12" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "arcane_power" },
  { cast = "frost_nova", if = "!target.frozen && !target.boss" },
  { cast = "ice_lance", if = "target.frozen || aura.fingers_of_frost.up" },
  { cast = "fire_blast" },
  { cast = "cone_of_cold" },
  { cast = "arcane_explosion", if = "mana_pct > 0.3" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "ice_barrier", if = "!aura.ice_barrier.up" },
  { cast = "frost_armor" },
  { cast = "arcane_intellect" },
]
eat_below = 0.5
drink_below = 0.45
