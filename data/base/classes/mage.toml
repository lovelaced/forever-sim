# Mage. Talents and spell ranks: Forever client 1.60.1.70338
# (wowforevertalents.com/mage and /abilities/mage, checked 2026-10-15).
# The site gives no row for Arcane Focus and Improved Channeling; they are
# placed in the first row (otherwise the Arcane tree could not be entered).
# Spell numbers (damage and its growth with level, mana, cast times,
# coefficients, DoT and channel ticks, absorbs, buff and debuff lengths) are
# Forever's spell data (data/reference/spellbook.json, build 1.60.1.70338);
# `fsim audit mage` checks them and data/reference/accepted/mage.toml lists
# the deliberate differences. Talent rank values and prerequisites are the
# client's trait data (spellbook.json "talents"), which agree with the
# tooltips; a talent's own spell often holds a stale number, so it is not
# used. Base stats and stat formulas are Classic 1.12.
name = "Mage"
icon = "classicon_mage"
resources = ["mana"]
source = "forever-70338"

base = [
  { level = 1, str = 20, agi = 20, sta = 20, int = 23, spi = 22, hp = 32, mana = 100 },
  { level = 40, str = 28, agi = 31, sta = 37, int = 92, spi = 88, hp = 600, mana = 735 },
  { level = 60, str = 34, agi = 39, sta = 50, int = 125, spi = 120, hp = 986, mana = 1213 },
]

[formulas]
ap = "str - 10"
rap = "agi - 10"
melee_crit = "agi / 20"
ranged_crit = "agi / 20"
spell_crit = "0.2 + int / interp(level, 1,10, 40,40, 60,59.5)"
dodge = "agi / 20"
# Evocation: spirit-based regeneration +1500% (spell 12051)
mana_regen = "(13 + spi / 4) * (aura.evocation.up ? 16 : 1)"
hp_regen = "spi * 0.1 + 2"

