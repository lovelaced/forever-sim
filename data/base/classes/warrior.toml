# Warrior. Talents and spell ranks: Forever client 1.60.1.70338 (Fury and
# Protection rework included). Every spell rank carries the game's spell `id`;
# `fsim audit warrior` checks them against data/reference/spellbook.json, and
# deliberate differences are listed in data/reference/accepted/warrior.toml.
# Stances use the game's own stance passives (spells 7376, 7381, 21156).
name = "Warrior"
icon = "classicon_warrior"
resources = ["rage"]
can_parry = true
can_block = true
can_dual_wield = true
source = "forever-70338"

base = [
  { level = 1, str = 23, agi = 20, sta = 22, int = 20, spi = 20, hp = 20, mana = 0 },
  { level = 40, str = 86, agi = 58, sta = 80, int = 25, spi = 35, hp = 1029, mana = 0 },
  { level = 60, str = 119, agi = 78, sta = 110, int = 30, spi = 45, hp = 1689, mana = 0 },
]

[formulas]
ap = "str * 2 + level * 3 - 20"
rap = "agi + level - 10"
melee_crit = "agi / interp(level, 1,4, 40,14.5, 60,20)"
ranged_crit = "agi / interp(level, 1,4, 40,14.5, 60,20)"
spell_crit = "0"
dodge = "0.75 + agi / interp(level, 1,4, 40,14.5, 60,20)"
parry = "5"
block = "5"
mana_regen = "0"
hp_regen = "spi * 0.6"

# ------------------------------------------------------------------ talents
# Per-rank values follow the game's talent tree (the client's trait data in
# data/reference/spellbook.json, `talents`), which `fsim audit warrior` checks.
# A talent's single spell often holds only one rank's number (or a leftover
# from the original game); where they differ, the talent tree wins. Points
# needed and prerequisites (`requires`, at full rank) follow the tree too.
[talents.improved_heroic_strike]
icon = "ability_rogue_ambush"
tree = "Arms"
points = 0
ranks = 3
text = "Heroic Strike costs 3 less Rage."
spell_mods = [{ spells = ["heroic_strike"], prop = "cost", add = "-rank" }]
[talents.deflection]
icon = "ability_parry"
tree = "Arms"
points = 0
ranks = 5
text = "+5% parry."
mods = [{ stat = "parry", add = "rank" }]
[talents.improved_rend]
icon = "ability_gouge"
tree = "Arms"
points = 0
ranks = 3
text = "Rend bleed damage +12/23/35%."
# Per-rank values from the game's talent tree (trait data); spell 12286 still
# lists 15, a leftover from the original game's rank 1.
spell_mods = [{ spells = ["rend"], prop = "damage", mul = "1 + (rank == 1 ? 0.12 : (rank == 2 ? 0.23 : 0.35))" }]
[talents.improved_charge]
icon = "ability_warrior_charge"
tree = "Arms"
points = 5
ranks = 2
text = "Charge generates 6 more Rage."
[talents.improved_tactical_mastery]
icon = "spell_nature_enchantarmor"
tree = "Arms"
points = 5
ranks = 5
text = "Keep 3 more Rage per rank when changing stance (15 at rank 5), on top of Tactical Mastery's 10."
[talents.improved_overpower]
icon = "inv_sword_05"
tree = "Arms"
points = 5
ranks = 2
text = "Overpower crit chance +50%."
spell_mods = [{ spells = ["overpower"], prop = "crit", add = "25 * rank" }]
[talents.anger_management]
icon = "spell_holy_blessingofstamina"
tree = "Arms"
points = 10
ranks = 1
requires = "improved_tactical_mastery"
text = "1 Rage every 3 sec in combat."
procs = [{ on = "combat_start", effects = [{ type = "aura", aura = "anger_management" }] }]
[talents.deep_wounds]
icon = "ability_backstab"
tree = "Arms"
points = 10
ranks = 3
requires = "improved_rend"
text = "Crits make the target bleed for 20% per rank of your main-hand weapon damage (including attack power) over 12 sec."
procs = [{ on = "melee_crit", effects = [{ type = "aura", aura = "deep_wounds", target = "target" }] }]
[talents.spearing_strike]
icon = "inv_spear_01"
tree = "Arms"
points = 15
ranks = 1
text = "Spearing Strike: 40% weapon damage, 120% against Giants and Dragonkin (mounted targets are not simulated). 15 Rage, 20 sec cooldown, Battle Stance."
# Possible conflict: the tooltip adds 80% weapon damage against Giants,
# Dragonkin and mounted targets (120% in all); spell 1310222 has 40% weapon
# damage and an unexplained value of 2 (40% x 2 would be 80%). Tooltip kept.
# No current scenario has Giants or Dragonkin, so results don't depend on it.
[talents.two_handed_weapon_specialization]
icon = "inv_axe_09"
tree = "Arms"
points = 15
ranks = 3
text = "Two-handed damage +3%."
mods = [{ stat = "phys_dmg_done", mul = "two_hand ? 1 + 0.01 * rank : 1" }]
[talents.impale]
icon = "ability_searingarrow"
tree = "Arms"
points = 15
ranks = 2
requires = "deep_wounds"
text = "Ability crit damage bonus +20%."
spell_mods = [{ prop = "crit_bonus", add = "0.1 * rank" }]
[talents.bloodthrill]
icon = "inv_sword_01"
tree = "Arms"
points = 20
ranks = 5
text = "Main-hand hits on targets with your Rend have a 4% chance per rank to enable Overpower for 6 sec."
# 4/8/12/16/20% from the game's talent tree (trait data), as the tooltip says;
# the talent's spell (1289682) lists 15, which the talent tree does not use.
# The 6 sec window matches spell 1289681.
procs = [{ on = "melee_landed", if = "event.mh && target.aura.rend.up", chance = "0.04 * rank", effects = [{ type = "aura", aura = "bloodthrill" }] }]
[talents.sweeping_strikes]
icon = "ability_rogue_slicedice"
tree = "Arms"
points = 20
ranks = 1
text = "30 Rage, 30 sec cooldown, Battle Stance: your next 5 melee attacks within 20 sec also hit a second nearby enemy."
[talents.weaponmaster]
icon = "garrison_weaponupgrade"
tree = "Arms"
points = 20
ranks = 5
text = "Axes and polearms: +1% crit per rank. Maces and staves: ignore 3% of the target's armor per rank. Swords: 1% chance per rank of an extra attack. Your main-hand weapon decides the crit and armor bonus."
mods = [
  { stat = "melee_crit", add = "(mh.axe || mh.polearm) ? rank : 0" },
  { stat = "armor_pen_pct", add = "(mh.mace || mh.staff) ? 0.03 * rank : 0" },
]
procs = [{ on = "melee_landed", if = "!event.extra && ((event.mh && mh.sword) || (event.oh && oh.sword))", chance = "0.01 * rank", effects = [{ type = "extra_attack", hand = "mh" }] }]
[talents.improved_slam]
icon = "ability_warrior_decisivestrike"
tree = "Arms"
points = 25
ranks = 2
text = "Slam cast and global cooldown -0.5 sec, cooldown -3 sec."
spell_mods = [
  { spells = ["slam"], prop = "cast_time", add = "-0.25 * rank" },
  { spells = ["slam"], prop = "gcd", add = "-0.25 * rank" },
  { spells = ["slam"], prop = "cooldown", add = "-1.5 * rank" },
]
[talents.improved_hamstring]
icon = "ability_shockwave"
tree = "Arms"
points = 25
ranks = 3
text = "Hamstring has a 5% chance per rank to immobilize for 5 sec (movement is not simulated, so the root changes nothing yet)."
[talents.mortal_strike]
icon = "ability_warrior_savageblow"
tree = "Arms"
points = 30
ranks = 1
requires = "sweeping_strikes"
text = "Weapon damage +85..160, 50% healing reduction."

[talents.booming_voice]
icon = "spell_nature_purge"
tree = "Fury"
points = 0
ranks = 5
text = "Shout area +50%, shout Rage cost -25%."
# Spell 12321: effect 0 is the radius (+10% per rank, no positioning in the
# sim), effect 1 the Rage cost (-5% per rank).
spell_mods = [{ spells = ["battle_shout", "demoralizing_shout"], prop = "cost", mul = "1 - 0.05 * rank" }]
[talents.cruelty]
icon = "ability_rogue_eviscerate"
tree = "Fury"
points = 0
ranks = 5
text = "+5% melee crit."
mods = [{ stat = "melee_crit", add = "rank" }]
[talents.lingering_rage]
icon = "ability_warrior_secondwind"
tree = "Fury"
points = 5
ranks = 5
text = "Rage starts decaying 2 sec later per rank after combat (not simulated: the sim keeps all Rage between pulls)."
[talents.unbridled_wrath]
icon = "spell_nature_stoneclawtotem"
tree = "Fury"
points = 5
ranks = 5
text = "60% chance for 1 extra Rage on weapon hits."
procs = [{ on = "melee_landed", chance = "0.12 * rank", effects = [{ type = "resource", res = "rage", amount = 1 }] }]
[talents.furious_precision]
icon = "ability_warrior_incite"
tree = "Fury"
points = 10
ranks = 3
text = "Off-hand hit +4/7/10%."
mods = [{ stat = "offhand_hit", add = "rank == 1 ? 4 : (rank == 2 ? 7 : 10)" }]
[talents.piercing_howl]
icon = "spell_shadow_deathscream"
tree = "Fury"
points = 10
ranks = 1
text = "Piercing Howl: 10 Rage, nearby enemies move 50% slower for 6 sec (movement is not simulated)."
[talents.blood_craze]
icon = "spell_shadow_summonimp"
tree = "Fury"
points = 10
ranks = 3
text = "Regenerate 3% of max health over 6 sec after being crit or taking a hit over 20% of max health."
procs = [{ on = "struck", if = "event.crit || event.pct > 0.2", effects = [{ type = "aura", aura = "blood_craze" }] }]
[talents.dual_wield_specialization]
icon = "ability_dualwield"
tree = "Fury"
points = 15
ranks = 5
text = "Off-hand damage +25%."
# Conflict: Blizzard's beta notes (Oct 1) removed the off-hand Rage and
# off-hand hit. The game's talent tree (trait data) still lists +10% off-hand
# Rage per rank (as the calculator's tooltip does) and +2% off-hand hit per
# rank, but spell 23584 has only +5% off-hand damage per rank, an unexplained
# dummy (5) and no third effect for the hit. The notes win:
# opt.warrior_dws_offhand_rage = 0 (0.1 restores the trait data's Rage); the
# off-hand hit is not modelled.
mods = [{ stat = "offhand_mult", mul = "1 + 0.05 * rank" }, { stat = "offhand_rage", mul = "1 + opt.warrior_dws_offhand_rage * rank" }]
[talents.raging_blows]
icon = "ability_whirlwind"
tree = "Fury"
points = 15
ranks = 1
text = "Cleave and Whirlwind cost 3 less Rage."
spell_mods = [{ spells = ["cleave", "whirlwind"], prop = "cost", add = -3 }]
[talents.enrage]
