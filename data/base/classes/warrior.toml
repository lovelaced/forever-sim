[auras.sweeping_strikes]
name = "Sweeping Strikes"
duration = 20
charges = 5
text = "Your next 5 melee attacks also hit a second nearby enemy."
# Each melee hit that lands on one enemy while another is alive is repeated
# on that other enemy for the damage the first hit dealt (as in the original
# game: the copy uses the first target's armor and cannot crit or miss on its
# own) and uses a charge. The mark tells the copy which enemy to skip.
procs = [{ on = "melee_landed", if = "enemies >= 2", effects = [
  { type = "aura", aura = "sweeping_mark", target = "target" },
  { type = "damage", school = "physical", hit = "auto", can_crit = false, fixed = true, no_proc = true, amount = "event.amount", mult = "target.aura.sweeping_mark.up ? 0 : 1", target = "enemies", max_targets = "target.alive ? 2 : 1", tag = "Sweeping Strikes" },
  { type = "remove_aura", aura = "sweeping_mark", target = "target" },
  { type = "consume" },
] }]
[auras.sweeping_mark]
name = "Sweeping Strikes target"
hidden = true
debuff = true
duration = 1
text = "Marks the enemy the hit came from, so the Sweeping Strikes copy goes to another one."
