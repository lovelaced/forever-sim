# ------------------------------------------------------------------ rotations
[rotations.fury_dw]
# Same priority as the earlier Python sim.
desc = "Fury dual wield: Bloodthirst > Whirlwind > Heroic Strike, cooldowns on use"
precombat = ["battle_stance", "berserker_stance", "battle_shout"]
# Charge needs Battle Stance: switch in, charge, switch back (Tactical Mastery keeps 10 Rage)
opener = [
  { cast = "battle_stance", if = "!aura.battle_stance.up" },
  "charge",
  { cast = "berserker_stance", if = "!aura.berserker_stance.up" },
]
actions = [
  { cast = "victory_rush" },
  { cast = "last_stand", if = "hp_pct < 0.25" },
  { cast = "bloodrage", if = "rage < 40" },
  { cast = "berserker_rage", if = "rage < 80" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "death_wish" },
  { cast = "execute", if = "target.hp_pct < 0.2" },
  { cast = "bloodthirst" },
  { cast = "whirlwind", if = "!known.bloodthirst || cd.bloodthirst.remains > 1.5 || rage >= 55" },
  { cast = "heroic_strike", if = "rage >= 60 && target.hp_pct >= 0.2" },
  { cast = "battle_shout", if = "!aura.battle_shout.up" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
]

[rotations.fury]
desc = "Fury dual wield: Battle Stance with Rend, Overpower, Thunder Clap and Heroic Strike until Whirlwind at 36, then Berserker Stance with Bloodthirst > Whirlwind > Heroic Strike; Cleave on two or more"
# Berserker Stance comes at 30, but it has nothing to press until Whirlwind
# (36) and Bloodthirst (40), so the rotation stays in Battle Stance until then.
precombat = ["battle_stance", { cast = "berserker_stance", if = "known.whirlwind" }, "battle_shout"]
# Charge needs Battle Stance: switch in, charge, switch back (Tactical Mastery keeps 10 Rage)
opener = [
  { cast = "battle_stance", if = "!aura.battle_stance.up" },
  "charge",
  { cast = "berserker_stance", if = "known.whirlwind && !aura.berserker_stance.up" },
]
actions = [
  { cast = "will_to_survive" },
  { cast = "victory_rush" },
  { cast = "last_stand", if = "hp_pct < 0.25" },
  { cast = "stoneform", if = "hp_pct < 0.5" },
  { cast = "bloodrage", if = "rage < 40" },
  { cast = "berserker_rage", if = "rage < 80" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "elunes_light" },
  { cast = "eureka" },
  { cast = "death_wish" },
  { cast = "execute", if = "target.hp_pct < 0.2" },
  { cast = "bloodthirst" },
  { cast = "whirlwind", if = "!known.bloodthirst || cd.bloodthirst.remains > 1.5 || rage >= 55" },
  { cast = "overpower" },
  { cast = "rend", if = "!target.aura.rend.up && target.hp_pct > 0.5" },
  { cast = "thunder_clap", if = "enemies >= 2 && !target.aura.thunder_clap.up" },
  { cast = "cleave", if = "enemies >= 2 && rage >= 50" },
  { cast = "heroic_strike", if = "enemies < 2 && rage >= (known.whirlwind ? 60 : 40) && target.hp_pct >= 0.2" },
  { cast = "battle_shout", if = "!aura.battle_shout.up" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
]

[rotations.arms_2h]
desc = "Arms two-hander in Battle Stance: Mortal Strike > Overpower > Rend > Slam, Spearing Strike and Heroic Strike with spare Rage; Sweeping Strikes, Thunder Clap and Cleave on two or more"
precombat = ["battle_stance", "battle_shout"]
opener = ["charge"]
actions = [
  { cast = "will_to_survive" },
  { cast = "victory_rush" },
  { cast = "last_stand", if = "hp_pct < 0.25" },
  { cast = "stoneform", if = "hp_pct < 0.5" },
  { cast = "bloodrage", if = "rage < 40" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "elunes_light" },
  { cast = "eureka" },
  { cast = "death_wish" },
  { cast = "sweeping_strikes", if = "enemies >= 2" },
  { cast = "execute", if = "target.hp_pct < 0.2" },
  { cast = "mortal_strike" },
  { cast = "overpower" },
  { cast = "rend", if = "!target.aura.rend.up && (target.boss ? target.hp_pct > 0.2 : target.hp_pct > 0.5)" },
  { cast = "thunder_clap", if = "enemies >= 2 && !target.aura.thunder_clap.up && (!known.sweeping_strikes || !cd.sweeping_strikes.ready)" },
  { cast = "slam", if = "rage >= 30" },
  { cast = "spearing_strike", if = "enemies < 2 && rage >= 45" },
  { cast = "cleave", if = "enemies >= 2 && rage >= 40" },
  { cast = "heroic_strike", if = "enemies < 2 && rage >= 60 && target.hp_pct >= 0.2" },
  { cast = "battle_shout", if = "!aura.battle_shout.up" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
]

[rotations.prot_shield]
desc = "Protection with a shield in Defensive Stance: Shield Slam > Revenge > Sunder (two on trash, five on players) > Heroic Strike; Thunder Clap on players and on two or more, Cleave on two or more"
precombat = ["defensive_stance", "battle_shout"]
# In the boss scenario someone else tanks and has already put 5 Sunders on
# the boss, so the rotation neither blocks nor sunders there.
# Charge needs Battle Stance unless the build has Vanguard
opener = [
  { cast = "battle_stance", if = "t.vanguard == 0" },
  "charge",
  { cast = "defensive_stance", if = "!aura.defensive_stance.up" },
]
actions = [
  { cast = "will_to_survive" },
  { cast = "victory_rush" },
  { cast = "last_stand", if = "hp_pct < 0.25" },
  { cast = "stoneform", if = "hp_pct < 0.5" },
  { cast = "bloodrage", if = "rage < 30" },
  { cast = "elunes_light" },
  { cast = "eureka" },
  { cast = "shield_block", if = "rage >= 25 && !target.boss" },
  { cast = "concussion_blow", if = "target.is_player" },
  { cast = "disarm", if = "target.is_player" },
  { cast = "execute", if = "target.hp_pct < 0.2" },
  { cast = "shield_slam" },
  { cast = "revenge" },
  { cast = "thunder_clap", if = "(enemies >= 2 || target.is_player) && !target.aura.thunder_clap.up" },
  { cast = "sunder_armor", if = "!target.boss && target.aura.sunder_armor.stacks < (target.is_player ? 5 : 2)" },
  { cast = "cleave", if = "enemies >= 2 && rage >= 45" },
  { cast = "heroic_strike", if = "enemies < 2 && rage >= 45" },
  { cast = "battle_shout", if = "!aura.battle_shout.up" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
]
