# ------------------------------------------------------------------ passives
[[passives]]
name = "Victory"
procs = [{ on = "kill", effects = [{ type = "aura", aura = "victory_rush_ready" }] }]
[[passives]]
name = "Overpower window"
procs = [{ on = "attack_dodged", effects = [{ type = "aura", aura = "overpower_ready" }] }]
[[passives]]
name = "Revenge window"
procs = [
  { on = "dodge", effects = [{ type = "aura", aura = "revenge_ready" }] },
  { on = "parry", effects = [{ type = "aura", aura = "revenge_ready" }] },
  { on = "block", effects = [{ type = "aura", aura = "revenge_ready" }] },
]

# ------------------------------------------------------------------ auras
# Changing stance keeps up to 10 Rage (Tactical Mastery, baseline in Forever
# from level 14, spell 1310185) plus 3 per rank of Improved Tactical Mastery.
[auras.battle_stance]
name = "Battle Stance"
group = "stance"
mods = [{ stat = "threat", mul = 0.8 }]
on_apply = [{ type = "resource", res = "rage", amount = "min(rage, (level >= 14 ? 10 : 0) + 3 * t.improved_tactical_mastery)", set = true }]
[auras.defensive_stance]
name = "Defensive Stance"
group = "stance"
mods = [{ stat = "dmg_taken", mul = 0.9 }, { stat = "dmg_done", mul = 0.9 }, { stat = "threat", mul = 1.3 }]
on_apply = [{ type = "resource", res = "rage", amount = "min(rage, (level >= 14 ? 10 : 0) + 3 * t.improved_tactical_mastery)", set = true }]
[auras.berserker_stance]
name = "Berserker Stance"
group = "stance"
mods = [{ stat = "melee_crit", add = 3 }, { stat = "dmg_taken", mul = 1.1 }, { stat = "threat", mul = 0.8 }]
on_apply = [{ type = "resource", res = "rage", amount = "min(rage, (level >= 14 ? 10 : 0) + 3 * t.improved_tactical_mastery)", set = true }]
[auras.battle_shout]
name = "Battle Shout"
duration = 180
mods = [{ stat = "ap", add = "r.ap" }]
[auras.demoralizing_shout]
name = "Demoralizing Shout"
debuff = true
per_source = false
duration = 45
text = "Lowers attack power. Enemies in the sim deal fixed damage, so this changes nothing yet."
mods = [{ stat = "ap", add = "-r.ap" }]
[auras.victory_rush_ready]
name = "Victory Rush window"
hidden = true
duration = 20
[auras.overpower_ready]
name = "Overpower window"
hidden = true
duration = 5
[auras.bloodthrill]
name = "Bloodthrill"
duration = 6
text = "Overpower enabled by Bloodthrill."
[auras.revenge_ready]
name = "Revenge window"
hidden = true
duration = 5
[auras.anger_management]
name = "Anger Management"
tick = { interval = 3, effects = [{ type = "resource", res = "rage", amount = 1 }] }
[auras.deep_wounds]
name = "Deep Wounds"
debuff = true
duration = 12
# 20% per rank of the main-hand weapon's average damage including attack
# power (as in Classic; Forever no longer uses the off hand), over 4 ticks
tick = { interval = 3, effects = [{ type = "damage", school = "physical", periodic = true, amount = "0.2 * t.deep_wounds * ((mh.min + mh.max) / 2 + ap / 14 * mh.speed) / 4", tag = "Deep Wounds" }] }
[auras.rend]
name = "Rend"
debuff = true
duration = "r.dur"
tick = { interval = 3, effects = [{ type = "damage", school = "physical", periodic = true, amount = "r.tick", tag = "Rend" }] }
[auras.sunder_armor]
name = "Sunder Armor"
debuff = true
per_source = false
duration = 30
max_stacks = 5
mods = [{ stat = "armor", add = "-r.armor * stacks" }]
[auras.blood_craze]
name = "Blood Craze"
duration = 6
# 1/2/3% of max health by rank (trait data), in 3 ticks every 2 sec (spell 16488)
tick = { interval = 2, effects = [{ type = "heal", target = "self", amount = "0.01 * t.blood_craze * max_hp / 3", tag = "Blood Craze" }] }
[auras.enrage]
name = "Enrage"
duration = 12
mods = [{ stat = "phys_dmg_done", mul = "1 + 0.02 * t.enrage" }]
on_apply = [{ type = "emit", event = "gore_trigger" }]
on_refresh = [{ type = "if", cond = "opt.gore_refresh_rearms", then = [{ type = "emit", event = "gore_trigger" }] }]
[auras.flurry]
name = "Flurry"
duration = "opt.warrior_flurry_duration"
charges = 3
mods = [{ stat = "melee_haste", mul = "1 + 0.05 * t.flurry" }]
procs = [{ on = "melee_swing", effects = [{ type = "consume" }] }]
[auras.gore_drinker]
name = "Gore Drinker"
duration = 8
charges = 3
text = "Lasts 8 sec or 3 hits (Forever spell data, 1323969)."
procs = [{ on = "melee_landed", effects = [{ type = "heal", target = "self", amount = "0.005 * t.gore_drinker * max_hp", tag = "Gore Drinker" }, { type = "consume" }] }]
[auras.death_wish]
name = "Death Wish"
duration = 30
mods = [{ stat = "phys_dmg_done", mul = 1.2 }, { stat = "dmg_taken", mul = 1.05 }, { stat = "immune_fear", add = 1 }]
[auras.berserker_rage]
name = "Berserker Rage"
duration = 10
mods = [{ stat = "immune_fear", add = 1 }, { stat = "immune_incap", add = 1 }]
[auras.bloodrage]
name = "Bloodrage"
duration = 10
tick = { interval = 1, effects = [{ type = "resource", res = "rage", amount = "1 + 0.25 * t.improved_bloodrage" }] }
[auras.last_stand]
name = "Last Stand"
duration = 20
mods = [{ stat = "max_hp_mult", mul = 1.3 }]
on_apply = [{ type = "resource", res = "hp", amount = "0" }]
[auras.shield_block]
name = "Shield Block"
duration = 7
