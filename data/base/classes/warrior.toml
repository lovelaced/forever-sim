tree = "Fury"
points = 25
ranks = 2
requires = "enrage"
text = "Enrage, Berserker Rage, Bloodrage, Death Wish and Bloodthirst make your next 3 melee attacks restore 0.5/1% of max health."
procs = [{ on = "custom:gore_trigger", effects = [{ type = "aura", aura = "gore_drinker" }] }]
[talents.bloodthirst]
icon = "spell_nature_bloodlust"
tree = "Fury"
points = 30
ranks = 1
text = "45% of Attack Power + 30..48, +10% movement speed for 10 sec (movement is not simulated)."

[talents.improved_bloodrage]
