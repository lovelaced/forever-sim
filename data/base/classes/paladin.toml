# Paladin. Talents and spell ranks: Forever client 1.60.1.70338
# (wowforevertalents.com/paladin and /abilities/paladin, checked 2026-10-15).
# Seal proc rates and spell coefficients are Classic approximations; the
# client tooltips do not show them. Base stats are Classic 1.12.
name = "Paladin"
icon = "classicon_paladin"
resources = ["mana"]
can_parry = true
can_block = true
source = "forever-70338"

base = [
  { level = 1, str = 22, agi = 20, sta = 22, int = 20, spi = 21, hp = 28, mana = 60 },
  { level = 40, str = 74, agi = 50, sta = 70, int = 52, spi = 55, hp = 787, mana = 900 },
  { level = 60, str = 105, agi = 69, sta = 100, int = 74, spi = 77, hp = 1381, mana = 1512 },
]

[formulas]
ap = "str * 2 + level * 3 - 20"
rap = "agi - 10"
melee_crit = "agi / interp(level, 1,4, 40,14, 60,20)"
ranged_crit = "agi / interp(level, 1,4, 40,14, 60,20)"
spell_crit = "3.5 + int / interp(level, 1,10, 40,36, 60,54)"
dodge = "0.65 + agi / interp(level, 1,4, 40,14, 60,20)"
parry = "5"
block = "5"
mana_regen = "15 + spi / 5"
hp_regen = "spi * 0.25 + 3"

