# Paladin. Talents and spell ranks: Forever client 1.60.1.70338
# (wowforevertalents.com/paladin and /abilities/paladin, checked 2026-10-15).
# Spell ranks carry the game's spell id (`id`), damage and healing when the
# rank is learned plus their growth per level (`lo_per_level`, up to
# `max_level`) and the game's spell power coefficients, all from Forever's
# spell tables (data/reference/spellbook.json, checked by `fsim audit`).
# Talent spells in that table often hold one rank's value only, so talent
# numbers per rank come from the game's talent tree (the trait values in the
# spellbook's `talents` section, which the talent UI shows); prerequisites
# (`requires`) come from the same tree. Numbers no source gives (seal proc
# rates, ...) are options in options.toml. Base stats are Classic 1.12.
name = "Paladin"
icon = "classicon_paladin"
resources = ["mana"]
can_parry = true
can_block = true
source = "forever-70338"

base = [
  { level = 1, str = 22, agi = 20, sta = 22, int = 20, spi = 21, hp = 28, mana = 60 },
  { level = 40, str = 74, agi = 50, sta = 70, int = 52, spi = 55, hp = 787, mana = 900 },
  { level = 60, str = 105, agi = 69, sta = 100, int = 74, spi = 77, hp = 1381, mana = 1512 },
]

[formulas]
ap = "str * 2 + level * 3 - 20"
rap = "agi - 10"
melee_crit = "agi / interp(level, 1,4, 40,14, 60,20)"
ranged_crit = "agi / interp(level, 1,4, 40,14, 60,20)"
spell_crit = "3.5 + int / interp(level, 1,10, 40,36, 60,54)"
dodge = "0.65 + agi / interp(level, 1,4, 40,14, 60,20)"
parry = "5"
block = "5"
mana_regen = "15 + spi / 5"
hp_regen = "spi * 0.25 + 3"

# ------------------------------------------------------------------ talents
[talents.divine_strength]
icon = "ability_golemthunderclap"
tree = "Holy"
points = 0
ranks = 5
text = "Strength +10%."
mods = [{ stat = "str_pct", add = "0.02 * rank" }]
[talents.divine_intellect]
icon = "spell_nature_sleep"
tree = "Holy"
points = 0
ranks = 5
text = "Intellect +10%."
mods = [{ stat = "int_pct", add = "0.02 * rank" }]
[talents.healing_light]
icon = "spell_holy_holybolt"
tree = "Holy"
points = 5
ranks = 3
text = "Holy Light, Flash of Light and Holy Shock heal 12% more."
spell_mods = [{ spells = ["holy_light", "flash_of_light", "holy_shock_heal", "lights_vigil_heal"], prop = "heal", mul = "1 + 0.04 * rank" }]
[talents.spiritual_focus]
