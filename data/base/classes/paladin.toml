mods = [{ stat = "pushback_resist", add = "0.35 * rank" }]
[talents.improved_seals]
icon = "ability_thunderbolt"
tree = "Holy"
points = 5
ranks = 3
text = "Seal and Judgement damage +15%."
# Used in every seal and judgement formula: 5/10/15% (trait data and tooltip;
# the talent's spell, 20224, says 3%).
[talents.unyielding_faith]
icon = "spell_holy_unyieldingfaith"
tree = "Holy"
points = 5
ranks = 2
text = "Fear duration -30%."
mods = [{ stat = "fear_duration", mul = "1 - 0.15 * rank" }]
[talents.voice_of_truth]
icon = "inv_misc_horn_03"
tree = "Holy"
points = 10
ranks = 1
text = "Voice of Truth: immune to Silence and Interrupt effects for 6 sec, 3 min cooldown (interrupt immunity is not simulated)."
[talents.reverence]
icon = "spell_holy_divineillumination"
tree = "Holy"
points = 10
ranks = 3
text = "30% of mana regeneration continues while casting."
mods = [{ stat = "casting_regen", add = "0.1 * rank" }]
[talents.purifying_power]
icon = "spell_holy_purifyingpower"
tree = "Holy"
points = 10
ranks = 2
text = "Exorcism cooldown -33% (the Cleanse and Purify discount is not simulated)."
