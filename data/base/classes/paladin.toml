# ------------------------------------------------------------------ auras
[auras.devotion_aura]
name = "Devotion Aura"
group = "paladin_aura"
mods = [{ stat = "armor", add = "r.armor" }]
[auras.retribution_aura]
name = "Retribution Aura"
group = "paladin_aura"
# Forever: 6% of the paladin's spell power per hit (Blizzard's beta notes,
# Oct 8). Base damage per rank: see the spell.
procs = [{ on = "struck_melee", effects = [{ type = "damage", school = "holy", target = "target", hit = "auto", can_crit = false, no_proc = true, amount = "r.dmg", coef = 0.06, tag = "Retribution Aura" }] }]
[auras.blessing_of_might]
name = "Blessing of Might"
group = "blessing"
mods = [{ stat = "ap", add = "r.ap" }]
[auras.blessing_of_wisdom]
name = "Blessing of Wisdom"
group = "blessing"
mods = [{ stat = "mp5", add = "r.mp5" }]
[auras.blessing_of_kings]
name = "Blessing of Kings"
group = "blessing"
mods = [{ stat = "all_stats_pct", add = 0.1 }]
[auras.righteous_fury]
name = "Righteous Fury"
duration = 1800
# Game (25780): +60% threat from Holy damage only.
spell_mods = [{ school = "holy", prop = "threat", mul = 1.6 }]

[auras.seal_of_righteousness]
name = "Seal of Righteousness"
group = "seal"
duration = 30
# The rank's `sor` is the game's seal value (base plus growth per level). The
# tooltip's range per swing is sor / 87 (fastest weapon) to sor / 25 (slowest);
# which weapon speeds those ends stand for is an option. Spell power: the
# seal's coefficient per hit (0.1; rank 8 lists none, see the option) plus
# `hit_coef`, the coefficient on the per-hit damage spells (25713, 25735 to
# 25742: 0.1 each in 70338). Both applied in 70338, which is the "almost
# twice as much benefit from Spell Damage" Blizzard fixed on Oct 15.
procs = [{ on = "melee_landed", if = "event.mh", effects = [{ type = "damage", school = "holy", target = "target", hit = "auto", no_proc = true, tag = "Seal of Righteousness", amount = "r.sor * (1 / 87 + (1 / 25 - 1 / 87) * clamp((mh.speed - opt.paladin_sor_speed_fast) / (opt.paladin_sor_speed_slow - opt.paladin_sor_speed_fast), 0, 1))", coef = "(r.coef > 0 ? r.coef : opt.paladin_sor_rank8_coef) + r.hit_coef", mult = "1 + 0.05 * t.improved_seals" }] }]
[auras.seal_of_command]
name = "Seal of Command"
group = "seal"
duration = 30
# Game (20424): 70% weapon damage, coefficient 0.29; at most once per second
# (the seal's proc cooldown). The rate per minute is server-side: an option.
procs = [{ on = "melee_landed", if = "event.mh && !event.extra", ppm = "opt.paladin_soc_ppm", icd = 1, effects = [{ type = "damage", school = "holy", target = "target", weapon = "mh", weapon_mult = 0.7, hit = "auto", no_proc = true, tag = "Seal of Command", coef = 0.29, mult = "1 + 0.05 * t.improved_seals" }] }]
[auras.seal_of_light]
name = "Seal of Light"
group = "seal"
duration = 30
# Game (20167 ...): a flat heal with no spell power coefficient.
procs = [{ on = "melee_landed", if = "event.mh", chance = "opt.seal_on_hit_chance", effects = [{ type = "heal", target = "self", amount = "r.heal", tag = "Seal of Light" }] }]
[auras.seal_of_wisdom]
name = "Seal of Wisdom"
group = "seal"
duration = 30
procs = [{ on = "melee_landed", if = "event.mh", chance = "opt.seal_on_hit_chance", effects = [{ type = "resource", res = "mana", amount = "r.mana_back" }] }]
[auras.seal_of_fury]
name = "Seal of Fury"
group = "seal"
duration = 30
# Game: each hit casts the rank's damage spell (1311647 ...: flat damage,
# coefficient 0.1). The seal's shield is not on its tooltip and is not simulated.
procs = [{ on = "melee_landed", if = "event.mh", effects = [{ type = "damage", school = "holy", target = "target", hit = "auto", no_proc = true, can_crit = false, tag = "Seal of Fury", amount = "r.dmg", coef = 0.1, mult = "1 + 0.05 * t.improved_seals", threat = 1.5 }] }]
# Judgement debuffs last 40 sec in Forever (20185 ...). Each melee hit on the
# target has a chance (an option) to help the attacker.
[auras.judgement_of_light]
name = "Judgement of Light"
debuff = true
duration = 40
procs = [{ on = "struck_melee", chance = "opt.paladin_judgement_proc_chance", effects = [{ type = "heal", target = "target", amount = "r.jheal", tag = "Judgement of Light" }] }]
[auras.judgement_of_wisdom]
name = "Judgement of Wisdom"
debuff = true
duration = 40
procs = [{ on = "struck_melee", chance = "opt.paladin_judgement_proc_chance", effects = [{ type = "resource", res = "mana", target = "target", amount = "r.jmana" }] }]
# Game (1280345 ...): each second the first 4 enemies take both parts (the
# second gets 0.095 of spell power), everyone else only the first.
[auras.consecration]
name = "Consecration"
debuff = true
duration = 8
tick = { interval = 1, effects = [{ type = "damage", school = "holy", periodic = true, tag = "Consecration", amount = "(r.dot + r.bonus) / 8", coef = 0.095 }] }
[auras.consecration_outer]
name = "Consecration (beyond 4 targets)"
hidden = true
debuff = true
duration = 8
tick = { interval = 1, effects = [{ type = "if", cond = "!target.aura.consecration.up", then = [{ type = "damage", school = "holy", periodic = true, tag = "Consecration", amount = "r.dot / 8" }] }] }
[auras.redoubt]
name = "Redoubt"
duration = 10
charges = 5
mods = [{ stat = "block", add = "4 * t.redoubt" }]
procs = [{ on = "block", effects = [{ type = "consume" }] }]
[auras.holy_shield]
name = "Holy Shield"
duration = 10
charges = 4
mods = [{ stat = "block", add = 30 }]
# Game (20925 ...): coefficient 0.08 on the damage per block.
procs = [{ on = "block", effects = [{ type = "damage", school = "holy", target = "target", hit = "auto", no_proc = true, tag = "Holy Shield", amount = "r.dmg", coef = 0.08, threat = 1.2 }, { type = "consume" }] }]
[auras.iron_creed]
name = "Iron Creed"
duration = 6
mods = [{ stat = "dmg_taken", mul = "1 - 0.02 * t.iron_creed" }]
[auras.vengeance]
name = "Vengeance"
duration = 30
max_stacks = 3
mods = [{ stat = "phys_dmg_done", mul = "1 + 0.01 * t.vengeance * stacks" }, { stat = "holy_dmg_done", mul = "1 + 0.01 * t.vengeance * stacks" }]
[auras.infusion_of_light]
name = "Infusion of Light"
duration = 15
consume_on_cast = true
spell_mods = [{ spells = ["holy_light"], prop = "cast_time", add = "-0.5 * t.infusion_of_light" }]
[auras.divine_favor]
name = "Divine Favor"
consume_on_cast = true
spell_mods = [{ spells = ["holy_light", "flash_of_light", "holy_shock", "holy_shock_heal"], prop = "crit", add = 100 }]
[auras.swift_judgement]
name = "Swift Judgement"
consume_on_cast = true
spell_mods = [{ spells = ["judgement"], prop = "cost", mul = 0 }]
[auras.voice_of_truth]
name = "Voice of Truth"
duration = 6
mods = [{ stat = "immune_silence", add = 1 }]
# Spell 440667. `stacks` carries the talent rank (1-3); `target.level` is the
# paladin's level (the aura's source).
[auras.vindication]
name = "Vindication"
debuff = true
duration = 30
max_stacks = 3
refresh = "replace"
mods = [{ stat = "ap", add = "-stacks / 3 * max(0, 3.5 * (min(target.level, 60) - 1) - 6)" }, { stat = "rap", add = "-stacks / 3 * max(0, 3.5 * (min(target.level, 60) - 1) - 6)" }]
# Spell 440668: +1/2/3% attack power on the paladin.
[auras.vindication_power]
name = "Vindication"
duration = 30
mods = [{ stat = "ap_mult", mul = "1 + 0.01 * t.vindication" }]
[auras.forbearance]
name = "Forbearance"
debuff = true
per_source = false
duration = 60
# Game (498, 5573): immune to all damage, but you cannot attack (stood in for
# by no physical damage done).
[auras.divine_protection]
name = "Divine Protection"
duration = "r.dur"
mods = [{ stat = "dmg_taken", mul = 0 }, { stat = "phys_dmg_done", mul = 0 }]
# Forever: Divine Shield halves the damage you deal (642, 1020).
[auras.divine_shield]
name = "Divine Shield"
duration = "r.dur"
mods = [{ stat = "dmg_taken", mul = 0 }, { stat = "dmg_done", mul = 0.5 }, { stat = "immune_stun", add = 1 }, { stat = "immune_fear", add = 1 }, { stat = "immune_incap", add = 1 }]
[auras.templars_bulwark]
name = "Templar's Bulwark"
duration = 8
absorb = "max_hp"

