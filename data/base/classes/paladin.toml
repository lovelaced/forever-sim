tree = "Retribution"
points = 10
ranks = 3
text = "Melee hits may lower the target's attack power (about 67 per rank at level 60) and raise yours by 1% per rank, both for 30 sec. The attack power cut only matters against players: monsters here deal fixed damage."
# Forever's version (tooltip of 9452): the target loses rank/3 of spell
# 440667's attack power and ranged attack power (6 - 3.5 per level above 1,
# so 200 at level 60 for rank 3), and you gain 1/2/3% attack power (440668,
# 3% at full rank). Both last 30 sec (duration index 9). The chance per hit is
# an option: the tooltip says only "a chance".
procs = [{ on = "melee_landed", chance = "opt.paladin_vindication_chance", effects = [{ type = "aura", aura = "vindication", target = "target", stacks = "rank" }, { type = "aura", aura = "vindication_power", target = "self" }] }]
[talents.sanctified_judgement]
