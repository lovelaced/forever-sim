procs = [{ on = "struck_crit", effects = [{ type = "damage", school = "holy", target = "target", hit = "auto", can_crit = false, no_proc = true, amount = "min(event.amount * 0.05 * rank, 0.5 * max_hp)", tag = "Eye for an Eye" }] }]
