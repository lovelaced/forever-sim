# ------------------------------------------------------------------ rotations
# Racials: Will to Survive (Human) breaks a stun, Stoneform (Dwarf) below half
# health, Cannibalize (Undead) between pulls; other races skip those lines.
[rotations.retribution]
desc = "Retribution two-hander: Seal of Command (Righteousness before it), Judgement, Holy Strike, Consecration, Hammer of Wrath; Flash of Light when hurt"
precombat = ["devotion_aura", "blessing_of_might", "seal_of_command", { cast = "seal_of_righteousness", if = "!known.seal_of_command" }]
opener = []
actions = [
  { cast = "will_to_survive" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "stoneform", if = "hp_pct < 0.5" },
  { cast = "divine_shield", if = "hp_pct < 0.15" },
  { cast = "lay_on_hands", if = "hp_pct < 0.15" },
  { cast = "hammer_of_justice", if = "target.is_player && !target.stunned" },
  { cast = "repentance", if = "hp_pct < 0.4" },
  { cast = "flash_of_light", if = "hp_pct < 0.4 && !target.is_player" },
  { cast = "holy_light", if = "hp_pct < 0.4 && target.stunned" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "judgement", if = "target.stunned || !known.seal_of_command" },
  { cast = "seal_of_command", if = "!aura.seal_of_command.up" },
  { cast = "seal_of_righteousness", if = "!known.seal_of_command && !aura.seal_of_righteousness.up" },
  { cast = "judgement", if = "cd.holy_strike.remains > 1" },
  { cast = "hammer_of_wrath" },
  { cast = "holy_strike" },
  { cast = "exorcism" },
  { cast = "hammer_of_the_righteous", if = "enemies >= 2" },
  { cast = "consecration", if = "mana_pct > 0.5 || enemies >= 2" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "holy_light", if = "hp_pct < 0.6 && mana_pct > 0.5" },
  { cast = "devotion_aura" },
  { cast = "blessing_of_might" },
]
eat_below = 0.5
drink_below = 0.35

[rotations.protection]
desc = "Protection with a shield: Righteous Fury, Seal of Fury, Holy Shield, Judgement, Holy Strike, Hammer of the Righteous, Consecration"
precombat = ["devotion_aura", "blessing_of_kings", { cast = "blessing_of_wisdom", if = "!known.blessing_of_kings" }, "righteous_fury", "seal_of_fury"]
opener = []
actions = [
  { cast = "will_to_survive" },
  { cast = "healing_potion", if = "hp_pct < 0.2" },
  { cast = "stoneform", if = "hp_pct < 0.5" },
  { cast = "templars_bulwark", if = "hp_pct < 0.3" },
  { cast = "divine_shield", if = "hp_pct < 0.12" },
  { cast = "lay_on_hands", if = "hp_pct < 0.15" },
  { cast = "hammer_of_justice", if = "target.is_player && !target.stunned" },
  { cast = "flash_of_light", if = "hp_pct < 0.35 && !target.is_player" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "holy_shield", if = "!aura.holy_shield.up" },
  { cast = "seal_of_fury", if = "!aura.seal_of_fury.up" },
  { cast = "judgement" },
  { cast = "swift_judgement" },
  { cast = "holy_strike" },
  { cast = "hammer_of_the_righteous" },
  { cast = "hammer_of_wrath" },
  { cast = "exorcism" },
  { cast = "consecration", if = "mana_pct > 0.3" },
]
rest = [
  { cast = "cannibalize", if = "hp_pct < 0.75 || mana_pct < 0.75" },
  { cast = "rapid_regeneration", if = "hp_pct < 0.7" },
  { cast = "holy_light", if = "hp_pct < 0.6 && mana_pct > 0.5" },
  { cast = "devotion_aura" },
  { cast = "righteous_fury" },
]
eat_below = 0.5
drink_below = 0.35

