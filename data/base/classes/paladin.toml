tree = "Holy"
points = 20
ranks = 1
text = "Holy Shock: instant Holy damage or healing, 10 sec cooldown."
[talents.consecrated_ground]
icon = "spell_holy_innerfire"
tree = "Holy"
points = 20
ranks = 2
text = "Holy spells deal 10% more to enemies in your Consecration."
