spell_mods = [{ spells = ["judgement", "holy_strike", "consecration", "seal_of_righteousness", "seal_of_command", "seal_of_light", "seal_of_wisdom", "seal_of_fury", "exorcism", "holy_shock", "holy_shock_heal", "hammer_of_the_righteous", "hammer_of_justice", "holy_shield", "divine_shield", "divine_protection", "repentance", "blessing_of_might", "blessing_of_wisdom", "blessing_of_kings", "righteous_fury", "templars_bulwark", "divine_favor"], prop = "cost", mul = "1 - 0.02 * rank" }]
