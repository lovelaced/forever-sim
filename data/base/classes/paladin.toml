spell_mods = [{ spells = ["exorcism"], prop = "cooldown", mul = "rank == 1 ? 0.83 : 0.67" }]
[talents.infusion_of_light]
icon = "ability_paladin_infusionoflight"
tree = "Holy"
points = 15
ranks = 2
text = "Holy Shock and Flash of Light crits cut the next Holy Light by 1 sec."
procs = [{ on = "heal_crit", if = "spell.holy_shock_heal || spell.flash_of_light", effects = [{ type = "aura", aura = "infusion_of_light" }] }]
[talents.illumination]
icon = "spell_holy_greaterheal"
tree = "Holy"
points = 15
ranks = 5
requires = "reverence"
text = "Critical heals from Holy Light, Flash of Light, Holy Shock and Light's Vigil have a 20% chance per rank to refund 50% of the spell's base mana cost."
# The refund is in each heal's `on_crit` (it needs the rank's own mana cost).
# Game (20210): the chance is 20% per rank ($m1); the refund is $m3, 50% at
# every rank. The trait's per-rank 10-50% is on $m2, which the tooltip
# doesn't use.
[talents.divine_favor]
icon = "spell_holy_heal"
tree = "Holy"
points = 15
ranks = 1
text = "Next Flash of Light, Holy Light or Holy Shock is a guaranteed crit. 2 min cooldown."
[talents.divine_precision]
icon = "spell_holy_healingfocus"
tree = "Holy"
points = 20
ranks = 3
requires = "holy_shock"
text = "Holy spell hit +18% (applied to all spells here)."
mods = [{ stat = "spell_hit", add = "6 * rank" }]
[talents.holy_shock]
