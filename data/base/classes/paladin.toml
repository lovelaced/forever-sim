# spells below (also the seals and Retribution Aura, whose hits come from
# auras here and take no spell modifiers).
spell_mods = [
  { spells = ["holy_shock", "holy_shock_heal", "holy_strike"], prop = "crit", add = "3 * rank" },
  { spells = ["consecration", "exorcism", "flash_of_light", "hammer_of_wrath", "holy_light", "judgement_of_command", "judgement_of_fury", "judgement_of_righteousness", "lay_on_hands", "lights_vigil", "lights_vigil_heal"], prop = "crit", add = "rank" },
]
