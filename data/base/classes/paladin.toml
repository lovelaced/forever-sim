# Holy hits (Seal of Command, judgements, Holy Strike) don't gain it.
mods = [{ stat = "phys_dmg_done", mul = "two_hand ? 1 + 0.02 * rank : 1" }]
[talents.vengeance]
icon = "ability_racial_avatar"
tree = "Retribution"
points = 20
ranks = 3
requires = "sanctified_judgement"
text = "After a non-periodic crit: Physical and Holy damage +3% per stack, 3 stacks, 30 sec."
procs = [
  { on = "melee_crit", effects = [{ type = "aura", aura = "vengeance" }] },
  { on = "spell_crit", if = "!event.periodic", effects = [{ type = "aura", aura = "vengeance" }] },
]
[talents.repentance]
