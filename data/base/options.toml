# Assumptions: numbers the game has not published (or that can't be tested
# on the beta yet). Formulas read them as `opt.<name>`. Override per run
# with `--opt name=value`, per build under [opts], or per scenario.
#
# Each one says where its default comes from:
#   source = "game"       Forever's own data or tooltip
#            "community"  players' measurements or reports
#            "classic"    the original game's value, not confirmed for Forever
#            "estimate"   our best guess
#            "choice"     how you play, not a game number
# and `cite` says exactly where. `label`, `help`, `kind` (toggle | pct | num)
# and `unit` are how the website shows it; `applies` lists the classes and
# races it matters to (leave it out for everyone).

# How you play: reactions and mistakes. The engine reads these itself (not
# through formulas); mobs, pets and buffing up never wait or slip.

[options.play_like]
default = 0
kind = "choice"
choices = ["Typical", "Expert"]
group = "play"
label = "Play like"
help = "A typical player takes about half a second to react to a proc, an interrupt chance or a new target, and makes the odd mistake (the settings below). An expert reacts in about 0.2 seconds and makes none."
desc = "0 = typical player, 1 = expert"
source = "choice"

[options.react_typical]
default = 0.5
unit = "sec"
group = "play"
label = "Typical reaction time"
help = "Each reaction varies by up to 30% either way."
desc = "Seconds a typical player takes to react"
source = "estimate"
cite = "Simple visual reaction times are around 0.25 sec; spotting a proc in a busy fight and pressing the right key takes longer"

[options.react_expert]
default = 0.2
unit = "sec"
group = "play"
label = "Expert reaction time"
desc = "Seconds an expert takes to react"
source = "estimate"
cite = "Near the floor of human visual reaction times"

[options.react_spread]
default = 0.3
kind = "pct"
group = "play"
label = "How much reactions vary"
desc = "Each reaction is drawn within this share either side of the average"
source = "estimate"

[options.slip_typical]
default = 0.05
kind = "pct"
group = "play"
label = "Typical: chance to press the wrong ability"
help = "Now and then a typical player presses the next ability down the list instead of the best one."
desc = "Share of a typical player's choices that take the next usable ability instead of the best"
source = "estimate"

[options.miss_proc_typical]
default = 0.10
kind = "pct"
group = "play"
label = "Typical: procs missed"
help = "A share of proc windows (Overpower, Riposte, Clearcasting, Nightfall) a typical player never notices."
desc = "Share of proc windows a typical player misses"
source = "estimate"

[options.late_cd_typical]
default = 1.0
unit = "sec"
group = "play"
label = "Typical: cooldowns used late"
help = "Moves with a cooldown of a minute or more, offensive or defensive, go out about this long after they're first usable and wanted."
desc = "Seconds a typical player is late with long cooldowns"
source = "estimate"

[options.lapse_typical]
default = 1.0
unit = "sec"
group = "play"
label = "Typical: upkeep reapplied late"
help = "DoTs, debuffs and short buffs fall off for about this long before a typical player puts them back."
