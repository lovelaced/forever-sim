[options.totem_carry]
default = 0.3
kind = "pct"
group = "world"
label = "How often your totems are still up for the next fight"
help = "Leveling: the next mob is often close enough to fight beside the totems you just put down. Otherwise you put them down again."
desc = "Share of leveling pulls fought beside the last pull's totems"
source = "estimate"
applies = ["shaman"]

[options.root_break]
default = 0.25
kind = "pct"
label = "Damage that breaks a root"
help = "Entangling Roots and other roots break once the rooted target has taken this much damage, as a share of its health. The game doesn't publish the number."
desc = "Damage that breaks a root, as a share of the target's health"
source = "estimate"
cite = "The original game's roots could break on damage; Forever's Improved Entangling Roots talks of the damage a root takes before breaking. A quarter of its health, like Frost Nova's freeze here"

[options.pushback]
default = 0
kind = "choice"
choices = ["Original game", "Later, gentler rules"]
label = "Spell pushback"
help = "How much a hit slows a spell you're casting. The original game pushes a cast back 1, 0.8, 0.6, 0.4 and then 0.2 seconds per hit, never past its full length, and shortens a channel by the same. The later rules (from Wrath of the Lich King) add half a second for each of the first two hits only and take a quarter off a channel per hit. Forever hasn't said which it uses."
desc = "0 = the original game's pushback, 1 = the later, gentler rules"
source = "classic"
cite = "vmangos (a 1.12 server) for the original; patch 3.0.2's notes for the later rules"

[options.first_aid]
default = 1
kind = "toggle"
group = "world"
label = "Bandage between pulls"
help = "When you'd eat anyway, you put on a bandage first: it heals over 6 to 8 sec and saves some time eating. Casters low on mana skip it, since they sit to drink anyway. Assumes you kept First Aid up with the cloth you find, from Linen at level 1 to Heavy Runecloth at 54. Any damage stops a bandage, and you can use one a minute."
desc = "1 = a bandage before eating, when the rotation would eat"
source = "classic"
cite = "First Aid bandages: Linen 66 health over 6 sec up to Heavy Runecloth 2000 over 8 sec; Recently Bandaged lasts 60 sec"

[options.spell_resists]
default = 1
kind = "toggle"
label = "Higher-level targets resist some spell damage"
help = "In the original game a target above your level shrugs off part of your direct spell damage: about 4% two levels up and 6% three levels up, on average. Spells that also slow or hold their target land whole or miss instead."
desc = "1 = level-based partial resists on direct spell damage"
source = "classic"
cite = "8 resistance per level above you, 0.75 x resistance / (5 x your level) on average"

[options.skirmish_notice]
default = 20
kind = "num"
unit = "yd"
label = "How close a player gets before you notice them"
help = "In the open-world PvP tests, the side that's about to be jumped sees the other one coming once it's this close, and starts to react. Until then it waits for the first move."
