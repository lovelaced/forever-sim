help = "The tooltip only says “a chance”. Each hit that triggers it gives you 1% attack power per rank for 30 sec, and lowers the target's attack power, which only matters against players: monsters here deal fixed damage."
desc = "Chance per melee hit for Vindication to trigger (target loses attack power, you gain 1-3% attack power)"
source = "estimate"
cite = "Forever tooltip: “a chance”"
applies = ["paladin"]

[options.warrior_dws_offhand_rage]
default = 0
kind = "pct"
label = "Extra off-hand Rage per rank of Dual Wield Specialization"
help = "Blizzard’s beta notes say the talent no longer gives off-hand Rage, and the talent’s spell shows none. The game’s talent tree data and the talent calculator’s tooltip still say 10% per rank."
desc = "Off-hand Rage bonus per rank of Dual Wield Specialization (0.1 = the talent tree's 10% per rank)"
source = "game"
cite = "Blizzard beta notes (Oct 1) and spell 23584: none; trait data and tooltip: +10% per rank (trait data also lists +2% off-hand hit per rank, which the notes removed too)"
applies = ["warrior"]

[options.warlock_fire_and_brimstone]
default = 10
unit = "%"
label = "Fire and Brimstone Incinerate bonus at 3 points"
help = "Extra Incinerate damage on targets with your Immolate. The talent tooltip only mentions Conflagrate’s crit chance, but the talent’s data in the game files also scales a hidden value to 3%, 7% and 10% by rank: the bonus the rune this spell comes from gave Incinerate. Set it to 0 if the game turns out to ignore it."
desc = "Fire and Brimstone: % more Incinerate damage on targets with your Immolate, at 3/3 (3, 7, 10 by rank)"
source = "game"
cite = "Trait data (talent spell 412751, effect 0): 3, 7, 10 by rank; the talent tooltip (wowforevertalents.com) mentions only Conflagrate's crit"
applies = ["warlock"]

[options.mage_ice_lance_coef]
default = 0
kind = "num"
label = "Ice Lance: spell power coefficient"
help = "Forever’s Ice Lance ranks list no spell power coefficient, so by default Ice Lance does not grow with spell power. The Burning Crusade gave it 0.143. To check on the beta, cast Ice Lance with and without spell power gear."
desc = "Share of spell power added to Ice Lance (before its 4x against frozen targets)"
source = "game"
cite = "Ice Lance spells 1312002, 400640 and 1240044 to 1240047 (build 70338) have no coefficient; Frostbolt and Frostfire Bolt in the same data have 0.814"
applies = ["mage"]

[options.rage_taken_mult]
default = 1.0
unit = "x"
label = "Rage from taking damage, compared with the original game"
help = "Forever rebalanced it to values “in the 20% to 40% range, varying by level” without publishing them; 1 keeps the original game’s formula."
desc = "Multiplier on rage gained from damage taken"
source = "estimate"
cite = "Beta notes, Oct 8: “We have rebalanced Rage gains based on appropriate values per level in the 20% to 40% range, varying by level”"
applies = ["warrior", "druid"]

[options.wand_spell_crit]
default = 0
kind = "toggle"
label = "Wands crit with spell critical strike chance"
help = "Players report Agility raising wand crits, so by default a wand shot uses your ranged critical strike chance. Turn this on to use your spell critical strike chance instead."
desc = "1 = wand shots use spell crit chance instead of ranged crit chance"
source = "community"
cite = "Blizzard forum threads on wand crits (us.forums.blizzard.com/en/wow/t/2016150, eu.forums.blizzard.com/en/wow/t/110741); vmangos uses ranged crit for Shoot"
applies = ["priest", "mage", "warlock"]

[options.wand_melee_crit]
default = 0
kind = "toggle"
label = "Wand crits deal double damage"
help = "Wand shots are magic attacks, so their critical strikes most likely deal 150% damage, like spells. Turn this on for 200%, like weapon attacks."
desc = "1 = wand crits deal 200% instead of 150%"
source = "estimate"
cite = "vmangos gives magic attacks, wands included, the spell crit bonus; no test from the original game found"
applies = ["priest", "mage", "warlock"]

[options.potions]
default = 0
kind = "toggle"
label = "Drink health and mana potions"
help = "Classic potions for your level, two minutes apart: a health potion when low, a mana potion on bosses and players."
desc = "1 = rotations drink health and mana potions"
source = "choice"
cite = "Potions cost gold, so they're off unless you turn them on"
