choices = ["Never", "In group fights", "Always"]
label = "Drink health and mana potions"
help = "Classic potions for your level, two minutes apart: a health potion when low, a mana potion on bosses and players. In group fights means the boss and healing tests, where a group expects them; leveling and PvP use them only with Always."
desc = "0 = never, 1 = in the boss and healing tests, 2 = in every fight"
source = "choice"
cite = "Potions cost gold, so they're kept for group fights unless you choose otherwise"
