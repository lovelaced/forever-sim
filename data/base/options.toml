# Assumptions: numbers the game has not published (or that can't be tested
# on the beta yet). Formulas read them as `opt.<name>`. Override per run
# with `--opt name=value`, per build under [opts], or per scenario.
#
# Each one says where its default comes from:
#   source = "game"       Forever's own data or tooltip
#            "community"  players' measurements or reports
#            "classic"    the original game's value, not confirmed for Forever
#            "estimate"   our best guess
#            "choice"     how you play, not a game number
# and `cite` says exactly where. `label`, `help`, `kind` (toggle | pct | num)
# and `unit` are how the website shows it; `applies` lists the classes and
# races it matters to (leave it out for everyone).

[options.gore_refresh_rearms]
default = 1
kind = "toggle"
label = "Refreshing Enrage re-arms Gore Drinker"
help = "Untested in the game beyond level 30."
desc = "1 = a refreshed Enrage re-arms Gore Drinker"
source = "estimate"
cite = "Talent tooltip is ambiguous; beta is capped at level 30"
applies = ["warrior"]

