  { type = "heal", min = "interp(level, 1,70, 12,140, 21,280, 35,455, 45,700, 55,1050)", max = "interp(level, 1,90, 12,180, 21,360, 35,585, 45,900, 55,1750)", can_crit = false, tag = "Healing Potion" },
]

