# Rogue: deliberate differences from Forever's spell data (build 1.60.1.70338).
# Format: data/reference/accepted/README.md. `fsim audit rogue` uses the
# entries keyed by an audited field (`match`, `targets`, ...); the others
# document simplifications the audit can't see, so they live next to the rest.

# ---------------------------------------------------------------- poisons
# The game has one poison item per weapon (its enchant spell procs a separate
# damage spell). The sim keeps one poison per hand, so these four spells are
# its own. Their numbers are the game's and are listed in rogue.toml.

[rogue.instant_poison_mh]
match = "Internal: Instant Poison I-VI on the main hand (enchant procs 8679/8686/8688/11338/11339/11340, 20% per hit; damage spells 8680/8685/8689/11335/11336/11337, whose ranges the ranks copy)"

[rogue.instant_poison_oh]
match = "Internal: Instant Poison I-VI on the off hand (enchant procs 8679/8686/8688/11338/11339/11340, 20% per hit; damage spells 8680/8685/8689/11335/11336/11337, whose ranges the ranks copy)"

[rogue.deadly_poison_mh]
match = "Internal: Deadly Poison I-V on the main hand (enchant procs 2823/2824/11355/11356/25351, 30% per hit; ticks 2818/2819/11353/11354/25349 every 3 sec for 12 sec, 5 stacks, whose tick values the ranks copy)"

[rogue.deadly_poison_oh]
match = "Internal: Deadly Poison I-V on the off hand (enchant procs 2823/2824/11355/11356/25351, 30% per hit; ticks 2818/2819/11353/11354/25349 every 3 sec for 12 sec, 5 stacks, whose tick values the ranks copy)"

# ---------------------------------------------------------------- waiting for engine work

[rogue.blade_flurry]
targets = "The game repeats each melee attack on a second nearby enemy. The sim repeats each melee hit that lands for the damage it dealt (the first target's armor, no second roll), on the next enemy in the fight; poisons are not repeated. Choosing which enemy waits for positioning."

[rogue.ambush]
positioning = "The game requires Stealth and being behind the target. The sim drops the facing check for Ambush, since a stealthed rogue chooses where to open: a mob that hasn't noticed you counts as facing away anyway, but a duel opponent faces you from the start, which would rule Ambush out there."

[rogue.garrote]
positioning = "Keeps the game's rule (behind the target unless you have Dirty Deeds). A mob that hasn't noticed you counts as facing away, so it opens from Stealth while levelling; a duel opponent faces you. Unlike Ambush."

[rogue.kidney_shot]
damage_taken = "Improved Kidney Shot raises only the rogue's damage on the stunned target; the sim raises all damage it takes. Same result in every scenario that uses Kidney Shot (against players, where the rogue is the only attacker); a per-attacker bonus waits for engine support."

# ---------------------------------------------------------------- talent values
# `value.N` entries: the game's per-rank talent values (trait tree 1111) that
# `fsim audit` can't find among the numbers a talent drives, either because
# the sim folds them into a formula that also reads combo points, an aura or
# the target's health, or because the sim has nothing for them to act on
# (stealth detection, movement, dispels, Expose Armor, Vanish, Sap, Blind,
# Distract). Every modelled value below matches the game's per-rank value.

[rogue.talent_improved_gouge]
"value.0" = "Modelled: Gouge lasts 0.5/1/1.5 sec longer (the game's 500/1000/1500 ms), inside Gouge's incapacitate duration `4 + 0.5 * t.improved_gouge`, so the audit only sees the totals (4.5/5/5.5 sec)."

[rogue.talent_improved_slice_and_dice]
"value.0" = "Modelled: Slice and Dice lasts 15/30/45% longer, as `(6 + 3 * cp) * (1 + 0.15 * t.improved_slice_and_dice)` in the aura's duration, which the audit can't evaluate because it reads combo points."

[rogue.talent_improved_expose_armor]
"value.0" = "Not modelled: Expose Armor costs 5/10 less Energy. The sim has no Expose Armor."
"value.1" = "Not modelled: Expose Armor at 5 combo points refunds 1/2 of them. The sim has no Expose Armor."

[rogue.talent_vile_poisons]
"value.2" = "Not modelled: poisons are 8-40% harder to dispel. Nothing in the sim dispels poisons. Effects 0 and 1 (+4-20% poison damage) are modelled and match."

[rogue.talent_improved_poisons]
"value.0" = "Modelled: +2/4/6/8/10% chance to apply poisons, inside each poison's proc chance (`0.2` or `0.3` + `0.02 * t.improved_poisons`, plus 0.1 with Venom), which the audit can't evaluate because it also reads the Venom aura."
"value.1" = "Not modelled: a 10-50% chance that a poison application doesn't use up a charge. The sim's poisons have no charges."

[rogue.talent_improved_kidney_shot]
"value.0" = "Modelled: +5/10% damage taken while stunned by Kidney Shot. Kidney Shot gives the target one stack of the Improved Kidney Shot debuff per rank and each stack adds 5% (`1 + 0.05 * stacks`), so the audit sees the stack counts (1/2) rather than the percentages."



[rogue.talent_master_of_deception]
"value.0" = "Not modelled: harder to detect in Stealth (as if 1/2/3 levels higher; the game's 5/10/15). The sim has no stealth detection."

[rogue.talent_elusiveness]
"value.0" = "Not modelled: Vanish and Blind cooldowns 45/90 sec shorter. The sim has neither ability."

[rogue.talent_dirty_tricks]
"value.0" = "Not modelled: Sap and Blind cost 25/50% less Energy. The sim has neither ability."

[rogue.talent_improved_distract]
"value.1" = "Not modelled: distracted enemies detect stealth as if 1/2 levels lower (the game's -5/-10). The sim has no Distract and no stealth detection."

[rogue.talent_heightened_senses]
"value.0" = "Not modelled: stealth detection as if 1/3 levels higher (the game's 5/15). The sim has no stealth detection."
"value.1" = "Not modelled: 2/4% less chance to be hit by ranged attacks (aura 185). The sim has no stat that lowers an attacker's ranged hit chance."
"value.2" = "Not modelled: 2/4% less chance to be hit by spells (aura 186). The sim has no stat that lowers an attacker's spell hit chance."

[rogue.talent_quietus]
"value.0" = "Modelled: Sinister Strike, Ghostly Strike and Hemorrhage deal 2/4/6/8/10% more below 35% health, as `target.hp_pct < 0.35 ? 1 + 0.02 * rank : 1`, which the audit can't evaluate because it reads the target's health."

[rogue.talent_camouflage]
"value.0" = "Modelled: Stealth slows you 3% less a rank, written as `0.3 - 0.03 * t.camouflage` in the stealth aura's slow, which the check can't see from the talent. Effect 1, Stealth's cooldown 2-6 sec shorter, is modelled and matches."
