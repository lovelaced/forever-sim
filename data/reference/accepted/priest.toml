# Deliberate differences between data/base/classes/priest.toml and Forever's
# spell data (see README.md in this folder for the format).

[priest.penance]
channel = "The cast spell (402174, 1240720, 1240721, 1316995) is an instant dummy; the 2 sec channel is the aura it applies (402261 on an enemy, 402277 on an ally: duration 2, a bolt every 1 sec). The sim channels the cast spell for those 2 sec, with the first bolt on cast."

[priest.penance_heal]
channel = "Penance cast on yourself, the same game spell as `penance`: the 2 sec channel is the ally aura 402277 (and its rank copies), not the instant cast spell."

[priest.vampiric_embrace]
level = "The spell row keeps the original game's level 30 (its old 20-point tier). Forever moved the talent to 15 points, so it can be learned at 25, and a learned talent spell is castable at once."

# Talents (rows `talent_<id>`). The per-rank values are in the class file;
# these rows are ones the audit can't see: the number depends on a stat, a
# rank's own value or the damage or heal that triggers it, it is folded into
# a total, or the talent changes something the sim does not model.

[priest.talent_holyspecialization]
talent = "A parked duplicate. The trait tables hold two Holy Specialization nodes on the same spell (14889): node 110855 in the Holy tree's first row (x 6220, y 2130, with the tree's tier groups) and the original node 105865 moved off the grid (y 21300, outside every tier group, listing an effect 1 the spell no longer has). The visible tree has one Holy Specialization, which `holy_specialization` models (5 ranks, points 0, 1-5% Holy crit); the audit pairs it with the first node of that name, leaving the parked one."


[priest.talent_silent_resolve]
"value.0" = "Spell threat -10/20/30% (Holy and Shadow since build 70425) is not simulated: the priest fights alone in every scenario, so threat never changes who an enemy attacks. Effects 1-3 (stun, fear and silence durations) are modelled."

[priest.talent_improved_power_word_shield]
"value.0" = "Modelled in the Power Word: Shield aura's absorb, (rank absorb + 0.1 healing power) * (1 + 0.07/0.14/0.2); the audit can't evaluate a formula that needs the spell rank and healing power."

[priest.talent_improved_inner_fire]
"value.0" = "Modelled in the Inner Fire aura's armor, rank armor * (1 + 0.15 per point); the audit can't evaluate a formula that needs the spell rank's armor."
"value.1" = "Modelled as Inner Fire's charges, 20 + 4 per point (24/28/32); the audit sees the total, not the 4/8/12."

[priest.talent_improved_mana_burn]
"value.0" = "Not simulated: the sim has no Mana Burn, and no enemy here uses mana."

[priest.talent_renewed_hope]
"value.1" = "Modelled as Weakened Soul's duration, 15 sec minus 1 per point (14 down to 10); the audit sees the total, not the -1 to -5 sec."

[priest.talent_divine_aegis]
"value.0" = "The shield is 5/10/15% of the critical heal (event.amount * 0.05 * rank); the audit can't evaluate a formula that needs the heal."

[priest.talent_blessed_recovery]
"value.0" = "The heal is 8/17/25% of the damage taken (event.amount * interp(rank, ...)); the audit can't evaluate a formula that needs the hit."

[priest.talent_holy_reach]
"value.0" = "Not simulated: no range or positioning."
"value.1" = "Not simulated: no range or positioning (Holy Nova's radius)."

[priest.talent_litany_of_light]
"value.0" = "Not simulated: returning 5/10% of a heal's base cost when it follows a different heal needs a healer rotation on allies."

[priest.talent_spiritual_guidance]
"value.0" = "Spell damage from 1/3/5/6/8% of Spirit (interp(rank, ...) * spi); the audit can't evaluate a formula that needs Spirit."
"value.1" = "Healing power from 5% of Spirit per point (0.05 * rank * spi); the audit can't evaluate a formula that needs Spirit."

[priest.talent_improved_shadow_word_pain]
"value.0" = "Modelled as the Shadow Word: Pain aura's duration, 18 sec plus 3 per point (21/24); the audit sees the total, not the 3/6 sec."

[priest.talent_shadow_reach]
"value.0" = "Not simulated: no range or positioning."

[priest.talent_improved_mind_flay]
"value.0" = "Each Mind Flay tick deals 10/20% more than the one before (build 70425): modelled in Mind Flay's channel as pow(1 + 0.1 * rank, ticks so far), or 1 + 0.1 * rank * ticks so far with priest_mind_flay_compound = 0; the audit can't evaluate a formula that needs the tick count."

[priest.talent_devouring_contagion]
"value.1" = "Not simulated: spreading Devouring Plague to 2 enemies (build 70425) within 5/10 yards when its target dies needs a way to move a DoT and its rank to other enemies. Effect 0 (the cost) is modelled."
