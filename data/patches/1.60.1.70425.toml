[classes.priest.talents.improved_mind_blast]
# Oct 15 notes: moved to row 2 (was row 3). 70425 trait data: node 105831
# (Shadow Affinity's spot) now holds Improved Mind Blast at points 5; the old
# row 3 node (105827) is gone.
points = 5

[classes.priest.talents.shadow_affinity]
# Oct 15 notes: "Shadow Infinity removed" (they mean Shadow Affinity). 70425
