[classes.mage.talents.wake_of_fire]
# Oct 15 notes: reverted to Improved Fire Blast (renamed below)
__delete = true

[classes.mage.talents.improved_fire_blast]
# Oct 15 notes: Wake of Fire reverted to Improved Fire Blast; no bonus after
# a kill any more, and Fire Blast range +8/15 yd. 70425 data: trait Improved
# Fire Blast (spell 11078), effect 0 = -1000/-2000 ms cooldown, effect 1 =
# +8/15 yd range.
icon = "spell_fire_fireball"
tree = "Fire"
points = 0
ranks = 2
text = "Fire Blast cooldown -1/2 sec, and it reaches 8/15 yards farther."
spell_mods = [{ spells = ["fire_blast"], prop = "cooldown", add = "-rank" }, { spells = ["fire_blast"], prop = "range", add = "rank == 2 ? 15 : 8 * rank" }]

[classes.mage.talents.impact]
# Fire Power (below) counts the mage's own Impact stun, so the stun is the
# mage's `impact` aura (same mechanic and length as the shared stun)
procs = [{ on = "spell_landed", if = "!event.periodic && (spell.fireball || spell.fire_blast || spell.scorch || spell.pyroblast || spell.blast_wave || spell.frostfire_bolt)", chance = "rank == 1 ? 0.03 : rank == 2 ? 0.07 : 0.1", effects = [{ type = "aura", aura = "impact", target = "target" }] }]

[classes.mage.talents.heating_up]
# Oct 15 notes: Heating Up always gains an extra stack each time Fire Blast
# is cast, so a Fire Blast crit gives 2. The 70425 tooltip (spell 400624)
# says "every time it deals damage", so it counts on a landed Fire Blast.
text = "Non-periodic crits from Fireball, Frostfire Bolt, Fire Blast and Scorch, and every Fire Blast that lands, cut the next Pyroblast's cast by 25% per stack (3 stacks, 20 sec). A Fire Blast crit gives 2 stacks."
procs = [
  { on = "spell_landed", if = "!event.periodic && spell.fire_blast", effects = [{ type = "aura", aura = "heating_up" }] },
  { on = "spell_crit", if = "!event.periodic && (spell.fireball || spell.frostfire_bolt || spell.fire_blast || spell.scorch)", effects = [{ type = "aura", aura = "heating_up" }] },
]

[classes.mage.talents.critical_mass]
# Oct 15 notes and 70425 data: 5 ranks (was 3), 2/4/6/8/10%
ranks = 5
text = "Fire spell crit +10%."

[classes.mage.talents.fire_power]
# Oct 15 notes: redesigned, 3 ranks (70425 data: was 5, effect 0 = 1/2/3).
# Fire spells deal 1/2/3% more per Fire effect of the mage's on the target,
# at most 4 effects (12%). The developers' note names the effects that count:
# Ignite, Improved Scorch (Fire Vulnerability), Fireball and Pyroblast (their
# burns) and Impact (its stun). Frostfire Bolt's burn does not count, but
# Frostfire Bolt (Fire in the sim) gets the bonus. The tooltip's cap is
# ${$s1*4}%, so 4 effects.
ranks = 3
text = "Fire spells deal 1/2/3% more damage per Fire effect of yours on the target (Ignite, Fire Vulnerability, Fireball's and Pyroblast's burns, Impact's stun), up to 4 effects."
mods = []
spell_mods = [{ school = "fire", prop = "damage", mul = "1 + 0.01 * rank * min(4, (target.aura.ignite.up > 0) + (target.aura.fire_vulnerability.up > 0) + (target.aura.fireball_burn.up > 0) + (target.aura.pyroblast_burn.up > 0) + (target.aura.impact.up > 0))" }]

