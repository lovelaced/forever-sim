[classes.mage.talents.fingers_of_frost]
text = "Chill effects have a 15% chance to make your next 1/2 spells treat the target as frozen (Shatter's crit and Ice Lance's 3x)."

[classes.mage.talents.winters_chill]
# Oct 15 notes describe the redesign twice. The tables decide the numbers:
# 70425 data, spell 12579 effect 0 is now aura 271 (damage taken from the
# caster) at 40% per stack on Cone of Cold only (was +2% crit for Frostbolt
# and Ice Lance), max 5 stacks; trait effect 0 is 5 stacks at every rank (was
# 1-5), effect 1 the 20-100% chance. The notes' second, more specific version
# decides the proc rules: Frostbolt, Frost Blast and Ice Lance with Fingers
# of Frost apply it, and the next Cone of Cold uses it up (Cone of Cold
# below). That version's numbers (+5% and 7% of spell damage per stack)
# disagree with the tables; option mage_winters_chill_notes switches to them.
text = "Frostbolt, Frost Blast and Fingers of Frost Ice Lances have a 20% per rank chance to apply Winter's Chill: your next Cone of Cold deals 40% more damage to the target per stack, up to 5 stacks, 15 sec."
procs = [{ on = "spell_landed", if = "spell.frostbolt || spell.frost_blast || (spell.ice_lance && aura.fingers_of_frost.up)", chance = "0.2 * rank", effects = [{ type = "aura", aura = "winters_chill", target = "target" }] }]
spell_mods = []

