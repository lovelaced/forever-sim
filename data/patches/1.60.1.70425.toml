# a dead target) never reaches its third tick.
text = "One hit roll when cast (a miss ends the channel), then a periodic tick every second for 3 sec that cannot crit, as in the game's periodic aura. With Improved Mind Flay each tick deals more than the one before. Slows the target 50% while it lasts."
