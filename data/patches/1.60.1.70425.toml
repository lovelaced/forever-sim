[classes.mage.spells.cone_of_cold]
# Winter's Chill (Oct 15 notes and 70425 data, spell 12579): +40% damage per
# stack on the target, used up by this Cone of Cold. With the option
# mage_winters_chill_notes, the notes' second description instead: +5% and
# 7% of spell damage per stack. Oct 15 notes: the first 4 targets are slowed
# 10% more for 3 sec longer (70425 data: rank 10161 effects 2-4), in the
# chill's rank fields.
text = "Slows by 40% for 6 sec (50% for 9 sec at the top rank), a Chill effect. Winter's Chill stacks on a target add to its damage there and are used up."
effects = [{ type = "damage", school = "frost", min = "r.lo", max = "r.hi", coef = "r.coef + (opt.mage_winters_chill_notes > 0 ? 0.07 * target.aura.winters_chill.stacks : 0)", mult = "1 + (opt.mage_winters_chill_notes > 0 ? 0.05 : 0.4) * target.aura.winters_chill.stacks", target = "enemies", on_hit = [{ type = "remove_aura", aura = "winters_chill", target = "target" }, { type = "aura", aura = "cone_of_cold_chill", target = "target" }, { type = "emit", event = "mage_chill" }], on_crit = [{ type = "if", cond = "!aura.master_of_elements.up", then = [{ type = "resource", res = "mana", amount = "0.1 * t.master_of_elements * r.mana" }, { type = "aura", aura = "master_of_elements" }] }] }]

# ======================================================================
# Assumptions
# ======================================================================

[options.mage_winters_chill_notes]
default = 0
kind = "toggle"
label = "Winter's Chill works as the patch notes' second description says"
help = "The Oct 15 notes describe Winter's Chill twice. The game's tables give Cone of Cold 40% more damage per stack, which is the default. Turn this on for the notes' second version instead: 5% more damage and 7% of your spell damage per stack."
desc = "1 = Winter's Chill gives Cone of Cold +5% and 7% of spell damage per stack (notes) instead of +40% (tables)"
source = "game"
cite = "Spell 12579 effect 0 (build 70425): 40% per stack on Cone of Cold; the Oct 15 notes' second description: 5% plus 7% of spell damage"
applies = ["mage"]

# ======================================================================
# Rotations (tested with fsim run on boss, solo_1, solo_2 and pressure)
# ======================================================================

[classes.mage.rotations.frost]
# Winter's Chill now feeds Cone of Cold (+40% a stack, used up), and
# Frostbolt applies it at 100% with 5/5. A frost mage now spends Cone of Cold
# on one target once the stacks are up: 3 when the target is hitting back,
# 5 on a boss (the tank holds it, so there is time to build them). Frost
# Blast (1 sec cast with Improved Frostbolt) adds the last stack in the
# 1.5 sec before Cone of Cold is ready, instead of a 2.5 sec Frostbolt that
# would delay it. Its slow is its main purpose (it replaces rank 1
# Frostbolt). Tested against Cone of Cold at 2-5 stacks and
# other Frost Blast rules: best or tied in every scenario.
# Gnomes use Eureka! on cooldown, like the other racials (other races skip
# the line, so no existing build changes).
desc = "Frost: Ice Barrier, Frost Nova into Ice Lance/Frostbolt shatter, Frostbolt filler that stacks Winter's Chill, Cone of Cold at 3 stacks (5 on a boss) with Frost Blast adding the last one, Evocation when dry"
actions = [
  { cast = "counterspell" },
  { cast = "ice_barrier", if = "!aura.ice_barrier.up" },
  { cast = "ice_block", if = "hp_pct < 0.15 && !target.boss" },   # escape
  { cast = "blink", if = "(stunned || rooted) && !aura.ice_block.up && (target.is_player || hp_pct < 0.5)" },   # out of a stun or root
  { cast = "fire_ward", if = "target.casting && !target.is_player && !aura.fire_ward.up" },   # caster mobs throw fire
  { cast = "cold_snap", if = "cd.ice_barrier.remains > 10 && cd.frost_nova.remains > 10 && (target.is_player || enemies_active >= 2)" },
  { cast = "healing_potion", if = "opt.potions && (hp_pct < 0.2)" },
  { cast = "mana_potion", if = "opt.potions && (mana_pct < 0.3 && (target.boss || target.is_player))" },
  { cast = "evocation", if = "mana_pct < 0.12" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "eureka" },
  { cast = "presence_of_mind" },
  { cast = "polymorph", target = "other_enemy", pick = "nearest", if = "enemies_active >= 2 && !target.incapacitated && hp_pct < 0.7" },   # sheep the add when it gets rough
  { cast = "arcane_power" },
  { cast = "frost_nova", if = "target.fleeing && !aura.polymorph_out.up" },   # stop a runner
  { cast = "frost_nova", if = "!target.frozen && !target.boss && target.hp_pct > 0.15 && !aura.polymorph_out.up && target.dist < 8" },   # once it's on you
  { cast = "step_back", if = "(target.frozen || target.rooted) && target.dist < 10" },   # kite: out of reach while it's held
  { cast = "blizzard", if = "enemies_active >= 3 && !aura.polymorph_out.up" },
  { cast = "arcane_explosion", if = "enemies_within_10 >= 3 && !aura.polymorph_out.up && mana_pct > 0.3" },
  { cast = "cone_of_cold", if = "!aura.polymorph_out.up && (enemies >= 2 || target.aura.winters_chill.stacks >= (target.boss ? 5 : 3))" },
  { cast = "ice_lance", if = "target.frozen || aura.fingers_of_frost.up" },
  { cast = "fire_blast", if = "target.hp_pct < 0.15" },
  { cast = "frost_blast", if = "t.winters_chill > 0 && !target.boss && cd.cone_of_cold.remains < 1.5 && target.aura.winters_chill.stacks >= 1" },
  { cast = "shoot", if = "gcd_remains <= 0 && !target.boss && !target.is_player && (target.hp_pct < 0.3 || mana_pct < 0.3)" },   # leveling: a few casts, then wand to finish
  { cast = "frostbolt" },
  { cast = "fireball", if = "!known.frostbolt" },
  { cast = "shoot", if = "gcd_remains <= 0" },   # out of mana: the wand is free
]

[classes.mage.rotations.fire]
# Heating Up is no longer used up by a Pyroblast that Presence of Mind made
# instant, so Presence of Mind goes into Pyroblast (only builds with both
# talents). Pyroblast at 2 stacks instead of 3 was tested: no better on a
# boss, worse in pressure. Gnomes use Eureka! on cooldown (other races skip
# the line).
# The standard Fire build (builds/mage/fire.toml, 0/29/22, the most planned
# Fire build on talentsforever.com) takes Ice Shards, Shatter and Fingers of
# Frost. With Fingers of Frost (level 58 in its order) it fills with
# Frostfire Bolt, whose chill feeds Fingers of Frost and whose crits Ice
# Shards boosts, and spends a Fingers of Frost charge on Ice Lance (3x)
# against monsters. At 60 against Fireball filler: boss 357 DPS against 322,
# solo_2_hard 90 kills/h against 77. Frostfire Bolt before 60 (rank 1 at 40,
# rank 2 at 50) lost to Fireball at 40, 50 and 55; Ice Lance on a boss lost
# 14 DPS to Frostfire Bolt; Ice Lance on a Frost Nova'd target lost kills.
# Builds without Fingers of Frost play as before.
desc = "Fire: Scorch to five stacks on long fights, Fireball (Frostfire Bolt once Fingers of Frost is taken), Fire Blast, Pyroblast with three Heating Up stacks or Presence of Mind, Ice Lance on Fingers of Frost against monsters, Combustion"
actions = [
  { cast = "counterspell" },
  { cast = "ice_barrier", if = "!aura.ice_barrier.up" },
  { cast = "ice_block", if = "hp_pct < 0.15 && !target.boss" },   # escape
  { cast = "blink", if = "(stunned || rooted) && !aura.ice_block.up && (target.is_player || hp_pct < 0.5)" },   # out of a stun or root
  { cast = "fire_ward", if = "target.casting && !target.is_player && !aura.fire_ward.up" },   # caster mobs throw fire
  { cast = "mana_shield", if = "!aura.mana_shield.up && !aura.ice_barrier.up && enemies_within_5 >= 1 && hp_pct < 0.5 && mana_pct > 0.3" },
  { cast = "healing_potion", if = "opt.potions && (hp_pct < 0.2)" },
  { cast = "mana_potion", if = "opt.potions && (mana_pct < 0.3 && (target.boss || target.is_player))" },
  { cast = "evocation", if = "mana_pct < 0.12" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "eureka" },
  { cast = "combustion" },
  { cast = "presence_of_mind" },
  { cast = "polymorph", target = "other_enemy", pick = "nearest", if = "enemies_active >= 2 && !target.incapacitated" },   # sheep the add
  { cast = "frost_nova", if = "target.fleeing && !aura.polymorph_out.up" },   # stop a runner
  { cast = "frost_nova", if = "!target.frozen && !target.boss && target.hp_pct > 0.15 && !aura.polymorph_out.up && target.dist < 8" },   # once it's on you
  { cast = "blast_wave", if = "enemies_active >= 2 && !aura.polymorph_out.up" },
  { cast = "flamestrike", if = "enemies_active >= 3 && !aura.polymorph_out.up" },
  { cast = "arcane_explosion", if = "enemies_within_10 >= 3 && !aura.polymorph_out.up && mana_pct > 0.3" },
  { cast = "pyroblast", if = "aura.presence_of_mind.up || aura.heating_up.stacks >= 3" },
  { cast = "ice_lance", if = "aura.fingers_of_frost.up && !target.frozen && !target.boss" },
  { cast = "scorch", if = "known.scorch && t.improved_scorch > 0 && target.max_hp > 20000 && (target.aura.fire_vulnerability.stacks < 5 || target.aura.fire_vulnerability.remains < 4)" },
  { cast = "fire_blast" },
  { cast = "shoot", if = "gcd_remains <= 0 && !target.boss && !target.is_player && (target.hp_pct < 0.3 || mana_pct < 0.3)" },   # leveling: a few casts, then wand to finish
  { cast = "frostfire_bolt", if = "t.fingers_of_frost > 0" },
  { cast = "fireball" },
  { cast = "shoot", if = "gcd_remains <= 0" },   # out of mana: the wand is free
]

[classes.mage.rotations.arcane]
# Arcane Blast's stacks now last 15 sec from the first cast and are not used
# up, while each one makes Arcane Blast cost 175% more: two casts per window,
# then Arcane Missiles. Arcane Wrath (3.5 sec cast, 6 sec cooldown) when the
# target is not hitting the mage (a tanked boss, or stunned): there it
# matches Arcane Missiles' damage for less mana; under melee pushback it
# lost 10-20% (solo_2, pressure). Tested with a 34/0/17 scratch build: Arcane
# Blast to 1-4 stacks, Arcane Wrath always / on boss / on frozen targets.
# Gnomes use Eureka! on cooldown (other races skip the line). Arcane Wrath
# into a Frost Nova was tested again with the standard Arcane build
# (builds/mage/arcane.toml, 47/4/0): 2-4% worse in solo_2 and pressure.
desc = "Arcane: Arcane Blast to two stacks (they last 15 sec), Arcane Wrath on a tanked boss, Arcane Missiles (free with Missile Barrage)"
actions = [
  { cast = "counterspell" },
  { cast = "ice_block", if = "hp_pct < 0.15 && !target.boss" },   # escape
  { cast = "blink", if = "(stunned || rooted) && !aura.ice_block.up && (target.is_player || hp_pct < 0.5)" },   # out of a stun or root
  { cast = "fire_ward", if = "target.casting && !target.is_player && !aura.fire_ward.up" },   # caster mobs throw fire
  { cast = "mana_shield", if = "!aura.mana_shield.up && !aura.ice_barrier.up && enemies_within_5 >= 1 && hp_pct < 0.5 && mana_pct > 0.3" },
  { cast = "healing_potion", if = "opt.potions && (hp_pct < 0.2)" },
  { cast = "mana_potion", if = "opt.potions && (mana_pct < 0.3 && (target.boss || target.is_player))" },
  { cast = "evocation", if = "mana_pct < 0.12" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "eureka" },
  { cast = "arcane_power" },
  { cast = "presence_of_mind" },
  { cast = "polymorph", target = "other_enemy", pick = "nearest", if = "enemies_active >= 2 && !target.incapacitated" },   # sheep the add
  { cast = "arcane_explosion", if = "enemies_within_10 >= 3 && !aura.polymorph_out.up && mana_pct > 0.3" },
  { cast = "frost_nova", if = "target.fleeing && !aura.polymorph_out.up" },   # stop a runner
  { cast = "frost_nova", if = "!target.frozen && !target.boss && target.hp_pct > 0.15 && !aura.polymorph_out.up && target.dist < 8" },   # once it's on you
  { cast = "arcane_missiles", if = "aura.missile_barrage.up" },
  { cast = "arcane_wrath", if = "target.boss || target.stunned" },
  { cast = "arcane_blast", if = "aura.arcane_blast.stacks < 2 && mana_pct > 0.25" },
  { cast = "shoot", if = "gcd_remains <= 0 && !target.boss && !target.is_player && (target.hp_pct < 0.3 || mana_pct < 0.3)" },   # leveling: a few casts, then wand to finish
  { cast = "arcane_missiles" },
  { cast = "fireball", if = "!known.arcane_missiles" },
  { cast = "shoot", if = "gcd_remains <= 0" },   # out of mana: the wand is free
]

[classes.mage.rotations.battlemage]
# With Winter's Chill, a 1 sec Frost Blast (Improved Frostbolt) is a better
# single-target filler than Arcane Explosion: it stacks Winter's Chill for
# Cone of Cold and its chill feeds Fingers of Frost (Ice Lance 3x). Melee
# waits while it casts. Against players (pressure, duel) the cast loses to
# instants (duel vs Frost: 81% wins with it, 93% without), so there Arcane
# Explosion stays the filler, as it does on two or more targets and when
# Winter's Chill is not taken. (Erin's call: play it this way.)
desc = "Battlemage: sword in melee plus instants (Frost Nova, Ice Lance on frozen, Fire Blast, Cone of Cold), Frost Blast to stack Winter's Chill on one monster, Arcane Explosion otherwise, Ice Barrier"
actions = [
  { cast = "counterspell" },
  { cast = "ice_barrier", if = "!aura.ice_barrier.up" },
  { cast = "ice_block", if = "hp_pct < 0.15 && !target.boss" },   # escape
  { cast = "blink", if = "(stunned || rooted) && !aura.ice_block.up && (target.is_player || hp_pct < 0.5)" },   # out of a stun or root
  { cast = "fire_ward", if = "target.casting && !target.is_player && !aura.fire_ward.up" },   # caster mobs throw fire
  { cast = "healing_potion", if = "opt.potions && (hp_pct < 0.2)" },
  { cast = "mana_potion", if = "opt.potions && (mana_pct < 0.3 && (target.boss || target.is_player))" },
  { cast = "evocation", if = "mana_pct < 0.12" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "arcane_power" },
  { cast = "frost_nova", if = "!target.frozen && !target.boss && !aura.polymorph_out.up && target.dist < 8" },   # once it's on you
  { cast = "ice_lance", if = "target.frozen || aura.fingers_of_frost.up" },
  { cast = "fire_blast" },
  { cast = "cone_of_cold", if = "!aura.polymorph_out.up" },
  { cast = "arcane_explosion", if = "mana_pct > 0.3 && enemies >= 2 && !aura.polymorph_out.up" },
  { cast = "frost_blast", if = "t.winters_chill > 0 && !target.is_player" },
  { cast = "arcane_explosion", if = "mana_pct > 0.3 && !aura.polymorph_out.up" },
]

[options.mage_ice_lance_coef]
# Oct 15 notes: frozen targets take 3x from Ice Lance now (was 4x). 70425
# data: the ranks still list no coefficient.
desc = "Share of spell power added to Ice Lance (before its 3x against frozen targets)"
cite = "Ice Lance spells 1312002, 400640 and 1240044 to 1240047 (builds 70338 and 70425) have no coefficient; Frostbolt and Frostfire Bolt in the same data have 0.814"

# ======================================================================
# priest, warlock
# ======================================================================

# Priest and warlock changes in WoW: Forever build 1.60.1.70425 (Oct 15 beta
# patch). Sources: Blizzard's Oct 15 notes and the game's tables (70425 data,
# compared with 70338).

# ======================================================================= priest

# ----------------------------------------------------------- priest: talents

[classes.priest.talents.power_in_light]
# Oct 15 notes: also works on targets with Shadow Word: Pain (was Holy Fire
# only). 70425 tooltip (spell 1309969): "afflicted with your Holy Fire or
# Shadow Word: Pain". The talent spell's 15 is still not used (trait data
# 2/4/6/8/10).
text = "Smite and Penance deal 2% more per point (10% at 5/5) to targets with your Holy Fire or Shadow Word: Pain."
spell_mods = [{ spells = ["smite", "penance"], prop = "damage", mul = "(target.aura.holy_fire.up || target.aura.shadow_word_pain.up) ? 1 + 0.02 * rank : 1" }]

[classes.priest.talents.twin_disciplines]
# Oct 15 notes: now benefits Shadow Word: Death, Mind Flay, Starshards and
# Penance. 70425 data: spell 1225132 effect 0 (damage and healing) adds family
# flags 1:2 (Shadow Word: Death) and 1:32768, 1:65536 (Penance's damage and
# healing bolts); effect 1 (periodic damage) adds 0:8388608 (Mind Flay) and
# 0:2097152 (Starshards, not in the sim).
text = "Instant spells deal and heal 5% more. In the game data: Holy Nova, Shadowguard, Desperate Prayer, Prayer of Mending, Contingency Plan, Shadow Word: Death, both kinds of Penance bolt, and the ticks of Shadow Word: Pain, Devouring Plague, Renew and Mind Flay (not Power Word: Shield)."
spell_mods = [
  { spells = ["shadow_word_pain", "devouring_plague", "holy_nova", "shadowguard", "shadow_word_death", "mind_flay", "penance"], prop = "damage", mul = "1 + 0.01 * rank" },
  { spells = ["renew", "holy_nova", "prayer_of_mending", "desperate_prayer", "contingency_plan", "penance_heal"], prop = "heal", mul = "1 + 0.01 * rank" },
]

[classes.priest.talents.silent_resolve]
# Oct 15 notes: the threat reduction now applies to all spells. 70425 data:
# spell 14523 effect 0 school mask 2 (Holy) -> 34 (Holy and Shadow).
text = "Stun, Fear and Silence effects on you are 5% shorter per point (the sim shortens stuns and fears; nothing here silences). Holy and Shadow spells cause 10% less threat per point."
spell_mods = [{ school = "holy", prop = "threat", mul = "1 - 0.1 * rank" }, { school = "shadow", prop = "threat", mul = "1 - 0.1 * rank" }]

[classes.priest.talents.mental_strength]
# Oct 15 notes: moved to row 2 (was row 4), Intellect +2/4/6/8/10% (was
