[classes.mage.talents.missile_barrage]
# 70425 data: trait Missile Barrage moved to the first row (points 15 -> 0)
# and has 2 ranks (was 1), effect 0 = 20/40 per rank. Oct 15 notes: Arcane
# Missiles hits can now trigger it too. Tooltip (spell 400588): Arcane Blast
# $m1% (20/40), each Arcane Missiles hit $m1/4% (5/10), Arcane Wrath,
# Fireball, Frostbolt and Frostfire Bolt $m1/2% (10/20). The proc spell's
# own chance is now 100% (was 50%), so the tooltip's numbers are the chances.
# Frost Blast is not in the tooltip, so it does not trigger it here.
points = 0
ranks = 2
text = "Arcane Blast (20/40%), each Arcane Missiles hit (5/10%), and Arcane Wrath, Fireball, Frostbolt and Frostfire Bolt (10/20%) make the next Arcane Missiles twice as fast and free."
procs = [
  { on = "cast:arcane_blast", chance = "0.2 * rank", effects = [{ type = "aura", aura = "missile_barrage" }] },
  { on = "spell_landed", if = "spell.arcane_missiles", chance = "0.05 * rank", effects = [{ type = "aura", aura = "missile_barrage" }] },
  { on = "cast:arcane_wrath", chance = "0.1 * rank", effects = [{ type = "aura", aura = "missile_barrage" }] },
  { on = "cast:fireball", chance = "0.1 * rank", effects = [{ type = "aura", aura = "missile_barrage" }] },
  { on = "cast:frostbolt", chance = "0.1 * rank", effects = [{ type = "aura", aura = "missile_barrage" }] },
  { on = "cast:frostfire_bolt", chance = "0.1 * rank", effects = [{ type = "aura", aura = "missile_barrage" }] },
]

[classes.mage.talents.arcane_blast]
# Oct 15 notes: Arcane Blast redesigned (see the spell and its buff below)
text = "Arcane Blast: 1.5 sec Arcane nuke. Each cast adds 15% of your Intellect as spell damage and makes Arcane Blast cost 175% more, up to 4 times, for 15 sec from the first cast."

[classes.mage.talents.arcane_wrath]
# Oct 15 notes: new "16-point gold medal talent". 70425 data: trait node
# Arcane Wrath (spell 1326079), 1 rank, no points needed in the tree, linked
# from Arcane Blast (the spellbook lists that edge under `linked`). The sim
# requires Arcane Blast; the notes' 16 points is an open question.
icon = "spell_arcane_arcane04"
tree = "Arcane"
points = 0
ranks = 1
requires = "arcane_blast"
text = "Arcane Wrath: 3.5 sec Arcane nuke, 6 sec cooldown, with extra spell damage equal to 5% of your maximum mana."

[classes.mage.talents.arcane_concentration]
# Oct 15 notes: Clearcasting no longer rolls for every target a spell hits.
# One roll per cast: the first target's hit rolls, and a 9 ms marker
# (clearcasting_roll) set by the area spells stops the other targets of the
# same cast (or Blizzard tick) from rolling.
text = "2% per rank chance on damage spell hits to make the next damage spell free (Clearcasting), at most once a second and one roll per cast however many targets it hits."
procs = [
  { on = "spell_landed", if = "!event.periodic && !aura.clearcasting_roll.up", chance = "0.02 * rank", icd = 1, effects = [{ type = "aura", aura = "clearcasting" }] },
  { on = "spell_landed", if = "!event.periodic && (spell.arcane_explosion || spell.cone_of_cold || spell.frost_nova || spell.blast_wave || spell.flamestrike || spell.blizzard)", effects = [{ type = "aura", aura = "clearcasting_roll" }] },
]

[classes.mage.talents.improved_channeling]
# 70425 data: spell 11237 effect 1 now also lists Arcane Wrath
text = "20% per rank chance that damage does not push back Arcane Missiles, 14% per rank for Arcane Blast and Arcane Wrath (pushback resistance for single spells is not simulated)."

