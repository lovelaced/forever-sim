[classes.priest.talents.dark_inspiration]
# Oct 15 notes: new row 4 talent. 70425 trait data: node 105823, spell
# 1326159, points 15, 5 ranks, 3/6/9/12/15%. The buff is spell 1326168
# (Spirit +15% at 5/5, 10 sec, party aura). Icon: a guess; the game's icon
