# WoW: Forever beta build 1.60.1.70425 (Blizzard's October 15 beta update).
# Sources: the beta development notes (us.forums.blizzard.com/en/wow/t/2360696,
# the October 15 post) and the game's spell tables for this build, compared
# with 1.60.1.70338 by tools/spellbook_diff.py. Each change says which.
# `fsim --at-build 1.60.1.70338 ...` runs without this file.

[meta]
build = "1.60.1.70425"
notes = "October 15 beta update: racials reworked, class changes for every class"

# ======================================================================
# races
# ======================================================================

# ------------------------------------------------------------------ racials
# Oct 15 notes ("Racial abilities have been updated") and the 70425 data.
# Not simulated: movement speed (Plainsrunning, Quickness stacking), Walk on
# Air, Cultivation, Find Treasure, Read Leyline, Skysight.

[races.human]
source = "forever-70425"
passives = [
  # Sword Specialization replaced with Ruthless: +2% crit with all spells and
  # attacks, any weapon (70425 data: spell 20597)
  { name = "Ruthless", mods = [{ stat = "crit", add = 2 }] },
  { name = "The Human Spirit", mods = [{ stat = "spi_pct", add = 0.05 }] },
]

[races.dwarf]
source = "forever-70425"
passives = [
  # Mace Specialization replaced with Earth Fury: critical strike bonus to
  # damage and healing +2% (70425 data: spell 1259719, auras 163 and 50)
  { name = "Earth Fury", mods = [{ stat = "crit_bonus_melee", add = 0.02 }, { stat = "crit_bonus_spell", add = 0.02 }, { stat = "crit_bonus_heal", add = 0.02 }] },
  { name = "Big Game Hunter", mods = [{ stat = "dmg_vs_beast", mul = 1.05 }] },
]

[races.gnome]
source = "forever-70425"
# Eureka! is now an 8 sec buff with no charges, same cost and damage effect
# (70425 data: spell 1259812 and its class versions). The notes add Power
# Word: Shield, which the sim's absorb doesn't read yet.
[races.gnome.spells.eureka]
effects = [{ type = "aura", aura = "eureka_buff" }]
[races.gnome.auras.eureka]
__delete = true
[races.gnome.auras.eureka_buff]
name = "Eureka!"
duration = 8
spell_mods = [{ prop = "cost", mul = 0.9 }, { prop = "damage", mul = 1.1 }, { prop = "heal", mul = 1.1 }]

[races.high_order]
source = "forever-70425 (stat offsets assumed)"
passives = [
  # Wind Blessed haste 3% (was 1%) (70425 data: spell 1259710)
  { name = "Wind Blessed", mods = [{ stat = "haste", mul = 1.03 }] },
  { name = "Elemental Insight", mods = [{ stat = "dmg_vs_elemental", mul = 1.05 }] },
]

[races.windshaper]
source = "forever-70425 (stat offsets assumed)"
passives = [
  { name = "Wind Blessed", mods = [{ stat = "haste", mul = 1.03 }] },
  { name = "Elemental Insight", mods = [{ stat = "dmg_vs_elemental", mul = 1.05 }] },
]

[races.orc]
source = "forever-70425"
passives = [
  # Axe Specialization replaced with Savage: +1% crit with all spells and
  # abilities, any weapon (70425 data: spell 20574)
  { name = "Savage", mods = [{ stat = "crit", add = 1 }] },
  { name = "Hardiness", mods = [{ stat = "stun_duration", mul = 0.8 }] },
]
[races.orc.spells.blood_fury]
cooldown = 180                    # was 120 (Oct 15 notes; spell 20572)
[races.orc.spells.shatter_curse]
text = "Removes Curses and Banes; 5% less magic damage taken for 8 sec."
[races.orc.auras.shatter_curse]
mods = [{ stat = "spell_dmg_taken", mul = 0.95 }]   # was 15% (Oct 15 notes; spell 1299026)

[races.undead]
source = "forever-70425"
[[races.undead.passives]]
name = "Touch of the Grave"
text = "Your spells and attacks have a 20% (warriors, paladins, rogues) or 30% (priests, mages, warlocks) chance to drain health from the target, up to 5% of your maximum health. 25 sec internal cooldown."
# Oct 15 notes: 30% for casters, 20% for paladins, rogues and warriors, a 25
# sec internal cooldown (70425 data: spells 1260189 and 1260201), and it no
# longer scales with Shadow damage increases on the target or the caster.
procs = [
  { on = "damage_dealt", if = "!event.periodic", icd = 25, chance = "(class.mage || class.priest || class.warlock) ? opt.tog_chance_caster : opt.tog_chance_melee", effects = [{ type = "damage", school = "shadow", hit = "auto", amount = "opt.tog_drain_pct / 100 * max_hp", can_crit = false, lifesteal = 1, no_proc = true, fixed = true, tag = "Touch of the Grave" }] },
]

[options.tog_chance_melee]
default = 0.2
help = "Warriors, paladins and rogues."
cite = "Oct 15 beta notes and Forever spell data (spell 1260189: 20%, 25 sec internal cooldown)"
[options.tog_chance_caster]
default = 0.3
help = "Priests, mages and warlocks."
cite = "Oct 15 beta notes and Forever spell data (spell 1260201: 30%, 25 sec internal cooldown)"

[races.tauren]
source = "forever-70425"
passives = [
  # Endurance: critical strike bonus to damage and healing +2% (was 1% hit)
  # (Oct 15 notes; 70425 data: spell 20550)
  { name = "Endurance", mods = [{ stat = "max_hp_mult", mul = 1.05 }, { stat = "crit_bonus_melee", add = 0.02 }, { stat = "crit_bonus_spell", add = 0.02 }, { stat = "crit_bonus_heal", add = 0.02 }] },
]
[races.tauren.spells.war_stomp]
cooldown = 90                     # was 120 (Oct 15 notes; spell 20549)

[races.troll]
source = "forever-70425"
passives = [
  # Regeneration 20% (was 10%), in and out of combat (Oct 15 notes; spell
  # 20555). The sim reads only the in-combat part.
  { name = "Regeneration", mods = [{ stat = "combat_hp_regen", add = 0.20 }] },
  { name = "Beast Slaying", mods = [{ stat = "dmg_vs_beast", mul = 1.05 }] },
]

# ======================================================================
# paladin, warrior, rogue
# ======================================================================

# Paladin, warrior and rogue changes in client build 1.60.1.70425 (Oct 15
# beta patch). Sources: Blizzard's notes of Oct 15 ("Oct 15 notes") and the
# 70338 -> 70425 spell table diff ("70425 data: spell N").

# ============================================================== paladin

# ---------------------------------------------------------------- talents

[classes.paladin.talents.champion_of_the_light]
# Oct 15 notes and 70425 data (trait values of 1311084): 10/20/30% of
# Intellect as spell damage (was 20/40/60%).
text = "Spell damage +30% of Intellect."
mods = [{ stat = "sp", add = "0.1 * rank * int" }]

[classes.paladin.talents.shield_specialization]
# Oct 15 notes and 70425 data: spell 1310925 effect 0, 4% of maximum mana
# (was 6%), still once per 3 sec.
text = "Shield block value +30%; blocks restore 4% of maximum mana (once per 3 sec)."
procs = [{ on = "block", chance = "rank == 3 ? 1 : 0.33 * rank", icd = 3, effects = [{ type = "resource", res = "mana", amount = "0.04 * max_mana" }] }]

[classes.paladin.talents.reckoning]
# Oct 15 notes: each trigger stores a charge (up to 4) and your next auto
# attack swing releases all of them as extra attacks. 70425 data: 20177
# effect 0 is now a dummy (it used to cast 20178, an instant extra attack,
# which is gone); the stored charges are spell 1326084 (4 stacks, used up by
# your next melee auto attack). The 1.5 sec proc cooldown is unchanged
# (the tooltip now names it for blocks only; kept on both triggers, as the
# data has one proc cooldown for the talent's aura).
text = "Blocks (8% per rank) and non-periodic crits against you (20% per rank) store an extra attack, up to 4, released on your next auto attack swing."
procs = [
  { on = "block", chance = "0.08 * rank", icd = 1.5, effects = [{ type = "aura", aura = "reckoning" }] },
  { on = "struck_crit", if = "!event.periodic", chance = "0.2 * rank", icd = 1.5, effects = [{ type = "aura", aura = "reckoning" }] },
]

# ------------------------------------------------------------------ auras

# New (70425 data: spell 1326084). Extra attacks don't reset the swing timer.
[classes.paladin.auras.reckoning]
name = "Reckoning"
max_stacks = 4
text = "Stored extra attacks, released on the next auto attack swing."
procs = [{ on = "melee_swing", if = "event.mh && !event.extra", effects = [{ type = "extra_attack", hand = "mh", count = "aura.reckoning.stacks" }, { type = "remove_self" }] }]

[classes.paladin.auras.righteous_fury]
# Oct 15 notes and 70425 data: spell 25780 effect 0, +90% threat from Holy
# damage (was 60%). Threat decides nothing for a paladin in any scenario yet.
spell_mods = [{ school = "holy", prop = "threat", mul = 1.9 }]

[classes.paladin.auras.consecration]
# Oct 15 notes and 70425 data: spells 1280345 to 1280349 effect 1, 0.042 of
# spell power per tick (was 0.095).
tick = { interval = 1, effects = [{ type = "damage", school = "holy", periodic = true, tag = "Consecration", amount = "(r.dot + r.bonus) / 8", coef = 0.042 }] }

