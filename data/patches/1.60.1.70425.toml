  { type = "remove_aura", aura = "mind_flay_ramp" },
  { type = "damage", school = "shadow", amount = 0, can_crit = false, on_hit = [{ type = "aura", aura = "mind_flay", target = "target" }], on_miss = [{ type = "interrupt", target = "self" }] },
]
