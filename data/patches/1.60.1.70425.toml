spell_mods = [{ spells = ["frostbolt", "frost_blast"], prop = "cast_time", add = "-0.1 * rank" }]

[classes.mage.talents.frostbite]
# Oct 15 notes: Frostbite and Fingers of Frost now trigger from Frost and Ice
