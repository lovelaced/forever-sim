[classes.shaman.spells.grace_of_air_totem]
# Oct 15 notes: no longer exclusive with Windfury Totem and Flametongue Totem.
# Windfury Totem still shares its air totem slot.
requires = "!aura.grace_of_air_totem.up && !aura.windfury_totem.up"

[classes.shaman.spells.flametongue_totem]
# Oct 15 notes: Grace of Air no longer exclusive with it; Windfury Totem still is
requires = "!aura.flametongue_totem.up && !aura.windfury_totem.up"

[classes.shaman.spells.elemental_mastery]
name = "Elemental Mastery"
icon = "spell_nature_wispheal"
talent = "elemental_mastery"
school = "nature"
# 70425 data: spell 16166, 3 min cooldown, no global cooldown
off_gcd = true
cooldown = 180
target = "self"
ranks = [{ level = 1, id = 16166 }]
effects = [{ type = "aura", aura = "elemental_mastery" }]

# ------------------------------------------------------------ rotations

[classes.shaman.rotations.elemental]
# Elemental Mastery on cooldown, like the other damage cooldowns. While it is
# up, Lightning Bolt (1.5 sec with Elemental Alacrity) does more per second
# than Chain Lightning on one target, so Chain Lightning waits for it to end.
# On one target Chain Lightning does about half of Lightning Bolt's damage
# per mana, so it waits for mana above 60% there (boss 207 -> 220 DPS at 60).
desc = "Elemental: Elemental Mastery, Flame Shock, Lava Burst, Earth Shock, Chain Lightning, Lightning Bolt, Searing Totem; heals when hurt"
actions = [
  { cast = "healing_potion", if = "opt.potions && (hp_pct < 0.2)" },
  { cast = "mana_potion", if = "opt.potions && (mana_pct < 0.25 && (target.boss || target.is_player))" },
  { cast = "natures_swiftness", if = "hp_pct < 0.3" },
  { cast = "healing_wave", if = "hp_pct < 0.3 && aura.natures_swiftness.up" },
  { cast = "lesser_healing_wave", if = "hp_pct < 0.35 && !(!target.is_player && target.hp_pct < 0.25 && hp_pct > 0.2)" },
  { cast = "healing_wave", if = "hp_pct < 0.35 && !known.lesser_healing_wave && !(!target.is_player && target.hp_pct < 0.25 && hp_pct > 0.2)" },
  { cast = "earth_shock", if = "target.casting" },   # cut a cast short
  { cast = "purge", if = "target.is_player && target.magic_buffs > 0" },   # strip a player's shield or buff
  { cast = "war_stomp", if = "enemies_within_8 >= 2 && hp_pct < 0.4" },   # panic (Tauren)
  { cast = "frost_shock", if = "target.fleeing && !target.slowed" },   # stop a runner
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "elemental_mastery" },
  { cast = "flame_shock", if = "!target.aura.flame_shock.up && (target.hp_pct > 0.35 || target.boss)" },
  { cast = "lava_burst" },
  { cast = "earth_shock", if = "target.hp_pct < 0.35 || !known.flame_shock" },
  { cast = "chain_lightning", if = "!aura.elemental_mastery.up && (enemies >= 2 || mana_pct > 0.6)" },
  { cast = "searing_totem", if = "target.hp_pct > 0.4 || target.boss" },
  { cast = "fire_nova", if = "enemies >= 2" },
  { cast = "lightning_bolt" },
]
