# Already as the notes describe, nothing to change:
# - Sanctified Judgement's mana no longer causes threat: the sim's resource
#   effects never cause threat.
# - Infusion of Light no longer gives Holy Shock +50% damage: the sim never
#   modelled that bug; it only shortens Holy Light.
# Not modelled (no party, no Power Word: Shield on a paladin): Salvation and
# Mass Salvation (renamed blessings, 1038 and 25895), Revoke (1325499), Seal
# of Fury vs Power Word: Shield, Light's Vigil focus macros, Sense Undead.

# ============================================================== warrior

[classes.warrior.talents.weaponmaster]
# Oct 15 notes: Shield Bash and Shield Slam no longer trigger the sword
# extra attack.
procs = [{ on = "melee_landed", if = "!event.extra && !spell.shield_bash && !spell.shield_slam && ((event.mh && mh.sword) || (event.oh && oh.sword))", chance = "0.01 * rank", effects = [{ type = "extra_attack", hand = "mh" }] }]

[classes.warrior.talents.improved_berserker_rage]
# Oct 15 notes: now removes movement impairing effects as its tooltip says
# (20500: 50/100% chance). Roots and slows change nothing in the sim yet.
text = "Berserker Rage generates 10 Rage and frees you from roots and slows (roots and slows change nothing in the sim)."

[classes.warrior.talents.lingering_rage]
# Oct 15 notes: no longer stops health regeneration after combat. 70425 data:
# spell 1323965 changed from aura 94 (which stopped regeneration) to
# mod_power_regen_percent -100% on Rage (misc 1) for 2/4/6/8/10 sec after
# combat, which pauses Rage decay. The sim keeps all Rage between pulls.
text = "Rage starts decaying 2 sec later per rank after combat (not simulated: the sim keeps all Rage between pulls)."

[classes.warrior.spells.berserker_rage]
effects = [
  { type = "dispel", mechanics = ["fear", "incap"] },
  { type = "aura", aura = "berserker_rage" },
  { type = "resource", res = "rage", amount = "5 * t.improved_berserker_rage" },
  { type = "chance", p = "0.5 * t.improved_berserker_rage", then = [{ type = "dispel", mechanics = ["root", "slow"] }] },
  { type = "emit", event = "gore_trigger" },
]

# Oct 15 notes: Slam is no longer subject to spell pushback. The engine has
# no per-spell pushback flag, so this is a class passive; Slam is the only
# warrior spell with a cast time. The first three passives are unchanged.
[[classes.warrior.passives]]
name = "Victory"
procs = [{ on = "kill", effects = [{ type = "aura", aura = "victory_rush_ready" }] }]
[[classes.warrior.passives]]
name = "Overpower window"
procs = [{ on = "attack_dodged", effects = [{ type = "aura", aura = "overpower_ready" }] }]
[[classes.warrior.passives]]
name = "Revenge window"
procs = [
  { on = "dodge", effects = [{ type = "aura", aura = "revenge_ready" }] },
  { on = "parry", effects = [{ type = "aura", aura = "revenge_ready" }] },
  { on = "block", effects = [{ type = "aura", aura = "revenge_ready" }] },
]
[[classes.warrior.passives]]
name = "Slam ignores pushback"
mods = [{ stat = "pushback_resist", add = 1 }]

# Not modelled: Battle Shout is raid wide (5242 ...: targets 20 -> 56; the sim
# has no party). Overpower against much lower level enemies: the sim's
# Overpower window never depended on level. Savior's Sacrifice (18826, +300
# armor, 10 -> 20 sec) is not cast by any warrior spell or talent.

# ============================================================== rogue
# Nothing to change. Already as the notes describe: poisons only trigger on
# your own hits; Cold Blood is used up by the Mutilate cast whether or not it
# crits. Not modelled: Sap (no weapon procs), spec swaps keeping Energy.
# Relentless Strikes (14179) now also covers Death Mark (1316709, 1325756 to
# 1325758: family flag 4 in word 2), a finisher that no trainer or talent
# teaches in 70425 and whose stored-damage numbers are not in the local data.
# The new Stealth (1326175) is a dummy aura with no cost or effect.

# ======================================================================
# druid, hunter
# ======================================================================

# Druid and hunter changes in WoW: Forever build 1.60.1.70425 (Oct 15 beta
# patch), on top of data/base (build 70338). Sources: the Oct 15 notes and
# the 70425 spell and trait tables (data/reference/spellbook.json).

# ================================================================== druid

[classes.druid.spells.shred]
# Oct 15 notes: Shred (Rank 1) is now learned at level 20 (was 22).
# 70425 data: spell 5221 level 22 -> 20, effect 0 (flat damage) 24 -> 22.
ranks = [
  { level = 20, id = 5221, bonus = 22 },
  { level = 30, id = 6800, bonus = 32 },
  { level = 38, id = 8992, bonus = 44 },
  { level = 46, id = 9829, bonus = 64 },
  { level = 54, id = 9830, bonus = 80 },
]

[classes.druid.auras.bear_form]
# Oct 15 notes: Furor now keeps the Energy you had when you were last in Cat
# Form even through Bear and Dire Bear Form; those forms still stop Energy
# regeneration. 70425 data: Bear Form 5487 and Dire Bear Form 9634 gain
# effect 4, Energy regeneration -100% (Furor's energy_active already leaves
# Bear Form out). So Bear Form no longer empties your Energy.
on_apply = [{ type = "resource", res = "rage", amount = 0, set = true }, { type = "chance", p = "0.2 * t.furor", then = [{ type = "resource", res = "rage", amount = 10 }] }]

[classes.druid.talents.furor]
text = "Keep your Energy when you leave Cat Form (100% at 5), even through Bear Form, and regenerate it in caster form (not in Bear Form); Bear Form gives 10 Rage (100% at 5)."

[classes.druid.auras.moonkin_form]
# Oct 15 notes: Moonkin Aura now only increases spell crit, and is raid wide.
# 70425 data: spell 24907 effect 0 is now mod_spell_crit_chance +3 (was aura
# 290, every kind of crit) and an area_aura_raid (65).
mods = [{ stat = "armor_mult", mul = 4.6 }, { stat = "spell_crit", add = 3 }]

[classes.druid.talents.moonkin_form]
text = "Moonkin Form: item armor +360%, +3% spell crit (raid aura), Omen of Clarity procs twice as often (half the internal cooldown)."

[classes.druid.talents.leader_of_the_pack]
# Oct 15 notes: Leader of the Pack now only increases melee and ranged crit,
# and is raid wide. 70425 data: spell 24932 effect 0 is now mod_crit_percent
# (was aura 290, every kind of crit) and an area_aura_raid (65). The sim
# already gave melee crit only; ranged crit is added for completeness.
text = "+3% melee and ranged crit in Cat and Bear Form (party and raid aura)."
mods = [
  { stat = "melee_crit", add = "(form.cat_form || form.bear_form) ? 3 : 0" },
  { stat = "ranged_crit", add = "(form.cat_form || form.bear_form) ? 3 : 0" },
]

[classes.druid.auras.faerie_fire]
# Oct 15 notes: "Fixed an issue allowing multiple Faerie Fire debuffs to be
# active on a target." One Faerie Fire per target, whoever cast it.
# Also in the notes: Faerie Fire now generates threat in Bear and Dire Bear
# Form. 70425 data: spells 770, 778, 9749, 9907 gain effect 3, a threat
# effect (type 63) with no amount, so the server sets it. Not modeled: no
# number to use, and no scenario reads a druid's threat.
per_source = false

[[classes.druid.passives]]
# Oct 15 notes: Faerie Fire in Cat, Bear and Dire Bear Form costs nothing,
# so it can no longer trigger Omen of Clarity. Same as data/base otherwise.
name = "Omen of Clarity"
procs = [
  { on = "melee_landed", if = "opt.druid_omen > 0 && !event.extra && !aura.omen_cooldown.up", ppm = "opt.omen_ppm * (form.moonkin_form ? 2 : 1)", effects = [{ type = "aura", aura = "clearcasting" }, { type = "aura", aura = "omen_cooldown" }] },
  { on = "cast", if = "opt.druid_omen > 0 && !aura.omen_cooldown.up && (spell.wrath || spell.moonfire || spell.starfire || spell.insect_swarm || spell.entangling_roots || spell.natures_grasp || spell.thorns || spell.mark_of_the_wild || (spell.faerie_fire && !(form.cat_form || form.bear_form)) || spell.healing_touch || spell.rejuvenation || spell.regrowth || spell.swiftmend || spell.wild_growth)", chance = "opt.omen_spell_chance * (form.moonkin_form ? 2 : 1)", effects = [{ type = "aura", aura = "clearcasting" }, { type = "aura", aura = "omen_cooldown" }] },
]

# ================================================================== hunter
[classes.hunter.pets.cat]
# Oct 15 notes: pets now inherit the higher of the hunter's melee and ranged
# crit (they only ever took melee crit before). Like data/base, no base crit
# of the pet's own on top (a judgment call). In the sim a hunter's melee and
# ranged crit are always equal, so this changes no numbers today.
crit = "max(melee_crit, ranged_crit) + 2 * t.ferocity"


[classes.hunter.spells.multi_shot]
# 70425 data: spell 2643 cast 0.5 sec -> instant. Not in the Oct 15 notes.
cast_time = 0

[classes.hunter.talents.efficiency]
# Oct 15 notes: Sniper Shot now benefits from "a few Marksmanship talents".
# 70425 data: Efficiency (19416) and Mortal Shots (19485) add Sniper Shot's
# family flag (word 3, 8388608) to their spell lists. The other Marksmanship
# talents either already covered it (Hawk Eye's range, Rapid Killing's buff
# 415407), are global (Lethal Attacks, Ranged Weapon Specialization), or
# still leave it out (Barrage, Improved Stings).
spell_mods = [{ spells = ["arcane_shot", "aimed_shot", "multi_shot", "serpent_sting", "scatter_shot", "summon_hawk", "sniper_shot", "raptor_strike", "mongoose_bite", "counterattack", "wing_clip", "lacerate"], prop = "cost", mul = "1 - 0.03 * rank" }]

[classes.hunter.talents.mortal_shots]
# Oct 15 notes / 70425 data: Mortal Shots now covers Sniper Shot too (see
# Efficiency above), so the 70338 exception is removed.
text = "Ranged crit damage bonus +30%, Auto Shot and Sniper Shot included (the sim gives it to melee crits too)."
spell_mods = []

[classes.hunter.talents.improved_mend_pet]
# Oct 15 notes: "Fixed an issue causing the Improved Mend Pet talent to
# increase the Mana cost of Mend Pet instead of decrease." 70425 trait data:
# effect 1 (Mend Pet cost) +10/+20% -> -10/-20%.
text = "Mend Pet costs 20% less, and each heal has a 50% chance to cleanse a curse, disease, magic or poison effect from your pet (the cleanse is not simulated)."
spell_mods = [{ spells = ["mend_pet"], prop = "cost", mul = "1 - 0.1 * rank" }]

[classes.hunter.talents.resourcefulness]
# Oct 15 notes: Resourcefulness now reduces Strider Kick's mana cost, and now
# activates on critical strikes, but only on melee and ranged ability crits
# (not auto attacks, not traps).
# 70425 data: spell 440529 effect 0 adds Strider Kick (word 2, 2097152) to
# its list; trait data for effect 1 (the proc, which triggers #1242688)
# -20/-40 -> 50/100, the chance per crit.
# Counterattack's damage is a spell-style hit here (hit = "auto"), so its
# crits come as spell_crit events.
text = "Melee abilities and Strider Kick cost 60% less mana; melee and ranged ability crits (not Auto Shot or auto attacks) have a 50% chance a point to give 50% mana regeneration while casting for 30 sec."
spell_mods = [{ spells = ["raptor_strike", "mongoose_bite", "counterattack", "wing_clip", "strider_kick"], prop = "cost", mul = "1 - 0.3 * rank" }]
procs = [
  { on = "melee_crit", if = "event.special", chance = "0.5 * rank", effects = [{ type = "aura", aura = "resourcefulness" }] },
  { on = "ranged_landed", if = "event.crit && event.special", chance = "0.5 * rank", effects = [{ type = "aura", aura = "resourcefulness" }] },
  { on = "spell_crit", if = "spell.counterattack", chance = "0.5 * rank", effects = [{ type = "aura", aura = "resourcefulness" }] },
]

[classes.hunter.talents.trueshot_aura]
# Oct 15 notes: Trueshot Aura is now raid wide (70425 data: spells 1299346,
# 1299348, 19506, 20905, 20906 effect 0 area_aura_party -> area_aura_raid).
text = "Trueshot Aura: you and your party or raid gain ranged Attack Power (+30 at level 25, rising with rank to +75)."

# Summon Hawk. Oct 15 notes: the hawk now spawns at the target you cast it on
# (position: not simulated) and sticks to that target. The hawks are now a
# debuff on the target they were summoned on, so they stop when it dies and
# don't follow you to the next one (before, they hit whatever you targeted).
# The notes don't say what a hawk does once its target dies; stopping is an
# assumption. The sim's hunter only changes targets when one dies, so that
# is the only case where sticking matters here.
[classes.hunter.talents.summon_hawk]
text = "Summon a hawk that dive-bombs the target for (32 + 5% ranged AP), 18 sec, up to 2. Shares a cooldown with Arcane Shot. The hawk stays on the target it was summoned on."

[classes.hunter.spells.summon_hawk]
target = "enemy"
effects = [{ type = "aura", aura = "hawk", target = "target" }]

[classes.hunter.auras.hawk]
debuff = true
text = "Each hawk dive-bombs the target it was summoned on every opt.hawk_dive_interval sec (not on the tooltip; assumption)."
tick = { interval = "opt.hawk_dive_interval", effects = [{ type = "damage", school = "physical", hit = "auto", tag = "Hawk", amount = "(r.base + 0.05 * rap) * stacks", mult = "1 + 0.03 * t.unleashed_fury", crit = "2 * t.ferocity" }] }

[classes.hunter.rotations.ranged_pet]
# Summon Hawk counts the hawks on the current target (they stick to it now),
# and only goes on bosses and players: a hawk summoned on a regular mob dies
# with it (12 sec or so) and costs a global cooldown and mana each time. In
# the sim, summoning on regular mobs loses kills per hour against not doing
# it (BM Ranged, solo_1: about 6% at level 30, 2% at level 60).
actions = [
  { cast = "wing_clip", if = "target.dist < 6 && target.is_player" },   # slow it, then step out of the dead zone
  { cast = "feign_death", if = "hp_pct < 0.15 && !target.boss" },   # escape: drop it all
  { cast = "feign_death", if = "target.boss && threat.pct > 0.85" },   # in a group: shed threat and keep shooting
  { cast = "disengage", if = "has_aggro && pet.active && !target.is_player && target.dist < 6" },   # hand it back to the pet
  { cast = "scare_beast", target = "other_enemy", pick = "nearest", if = "enemies_active >= 2 && !target.feared && hp_pct < 0.5" },   # a beast add runs off when it gets rough
  { cast = "concussive_shot", if = "target.fleeing || (target.is_player && !target.slowed)" },   # stop a runner, slow a chaser
  { cast = "volley", if = "enemies_active >= 3 && cc_near == 0" },
  { cast = "mend_pet", if = "pet.active && pet.hp_pct < 0.4 && !pet.aura.mend_pet.up" },
  { cast = "deterrence", if = "hp_pct < 0.35" },
  { cast = "intimidation", target = "enemy", if = "target.is_player" },
  { cast = "bestial_wrath" },
  { cast = "rapid_fire" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "scatter_shot", if = "target.is_player" },
  { cast = "serpent_sting", if = "target.hp_pct > 0.3" },
  { cast = "summon_hawk", if = "target.aura.hawk.stacks < 2 && (target.boss || target.is_player)" },
  { cast = "sniper_shot" },
  { cast = "multi_shot", if = "(enemies >= 2 && cc_near == 0) || !known.aimed_shot" },
  { cast = "aimed_shot" },
  { cast = "arcane_shot", if = "mana_pct > 0.3" },
  { cast = "aspect_of_the_hawk" },
]

[classes.hunter.rotations.survival_melee]
# Summon Hawk counts the hawks on the current target (they stick to it now),
# and only goes on bosses and players: a hawk summoned on a regular mob dies
# with it (12 sec or so) and costs a global cooldown and mana each time. In
# the sim, summoning on regular mobs loses kills per hour against not doing
# it (BM Ranged, solo_1: about 6% at level 30, 2% at level 60).
actions = [
  { cast = "mend_pet", if = "pet.active && pet.hp_pct < 0.4 && !pet.aura.mend_pet.up" },
  { cast = "feign_death", if = "hp_pct < 0.15 && !target.boss" },   # escape: drop it all
  { cast = "deterrence", if = "hp_pct < 0.35" },
  { cast = "scare_beast", target = "other_enemy", pick = "nearest", if = "enemies_active >= 2 && !target.feared && hp_pct < 0.5" },   # a beast add runs off when it gets rough
  { cast = "concussive_shot", if = "target.fleeing" },   # stop a runner
  { cast = "intimidation", target = "enemy", if = "target.is_player" },
  { cast = "bestial_wrath" },
  { cast = "rapid_fire" },
  { cast = "blood_fury" },
  { cast = "berserking" },
  { cast = "counterattack" },
  { cast = "mongoose_bite" },
  { cast = "raptor_strike" },
  { cast = "strider_kick" },
  { cast = "wing_clip", if = "target.is_player || target.fleeing" },
  { cast = "lacerate", if = "target.hp_pct > 0.3" },
  { cast = "serpent_sting", if = "target.hp_pct > 0.3" },
  { cast = "summon_hawk", if = "target.aura.hawk.stacks < 2 && (target.boss || target.is_player)" },
  { cast = "aspect_of_the_monkey" },
]

