text = "Chill effects (Frostbolt, Frost Blast, Cone of Cold, Frostfire Bolt, Frost and Ice Armor, Blizzard with Improved Blizzard) have a 15% chance to freeze for 5 sec."

[classes.mage.talents.ice_lance]
